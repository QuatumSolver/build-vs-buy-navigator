const RUNGS={r1:['Data','"Is the data already in a lake or warehouse? All of it, or finance only?"','Omega can run on what they have. Not a blocker.'],
 r2:['Semantic model','"Have you built a semantic model? How does the AI know what a cost centre or a driver is?"','Where most builds stall. Omega builds it.'],
 r3:['Planning layer','"How do budget owners enter and change numbers? How do versions, workflow and approvals work?"','The part EPM vendors spent 20 years on.'],
 r4:['Cumulative context','"When someone asks a question or makes a decision, is that kept? Does the next answer get better?"','Omega\'s core. Most builds start over every session.'],
 r5:['Orchestration','"How are you handling model orchestration? Agent flows, harnesses, routing different question types?"','Omega handles it. Bring Solution Architecture or Morpheo to go deep.'],
 r6:['Context weighting','"How do you prioritize context? Industry, company, user level? How is it weighted over time?"','Almost nobody has. The strongest rung.'],
 r7:['Interfaces','"Once it works, how does finance use it? Excel? Power BI? A chat window?"','Vena for Excel, PowerPoint and Power BI already sit on Omega.']};
const GAPS={g1:['Budget owners','"How do budget owners enter their numbers?"'],g2:['Versions','"What happens when two people change the same driver?" "How do you lock a version?"'],g3:['Audit','"How would your auditor see who changed what?"'],g4:['Key person','"What\'s the plan if that person leaves?"'],g5:['Meaning','"How will the model know what gross margin means at your company?" "Where does that knowledge live today?"'],g6:['Memory','"Does it get smarter as people use it, or start over each time?"']};

const BUILD_PLAT={pbi:'fabric',snowflake:'snowflake',databricks:'databricks',fabric:'fabric',google:'google',sap:'sap',aws:'aws',palantir:'palantir'};
const RUNG_CRIT={r1:'ingestion',r2:'semantic_model',r3:'write_back',r4:'cumulative_memory',r5:'agent_orchestration',r6:'planning_event_context',r7:'excel'};
const PKG={
 core:{n:'Omega Core',d:'The context layer, hosted by Vena and connected to their lakehouse through Morpheo connectors. MCP and API access. They build their own apps and agents on it.'},
 fin:{n:'Omega for Finance',d:'Core plus Vena for Excel, PowerPoint and Vena AI. Finance gets a full planning and reporting tool with the context layer under it.'},
 ent:{n:'Omega Enterprise',d:'Every interface, connected to their platform, and a dedicated FDE pod. Planning and AI across more than one business domain.'},
 wait:{n:'Wait and see',d:'They want to try. Leave the door open, set a dated check-in, and send one useful thing rather than a pitch.'}};

function evaluate(s){
  const platId=BUILD_PLAT[s.build]||null, isPlat=!!platId&&s.build!=='pbi';
  const fin=s.owner==='fin';
  const sig=s.signals||[], gaps=s.gaps||[], lad=s.ladder||[];
  let persona,believe,truth,play,tone;
  if(fin){
    persona=isPlat?'Finance with a data ally':'Finance DIY';
    believe='"We can set this up ourselves with the AI tools we already use."';
    truth='Works for one model with one owner. Breaks when a second person enters numbers, the auditor asks who changed what, or the builder leaves. AI speeds the build but gives the model no memory of the business.';
    play='Gentle challenge, then wait and see. Ask the questions that let them find the gaps. Never say it won\'t work.';
    tone='Curious and gentle';
  } else {
    persona=sig.includes('mandate')?'IT with an AI mandate':'IT platform builder';
    believe='"EPM is a boxed app. We can build this on the platform we already run."';
    truth='They can build the data layer. They underestimate planning semantics, write-back, security by intersection, and the ongoing work of keeping context current. They think of AI as a model to call, not a layer that learns the business.';
    play='Partner, don\'t compete. Walk them up the build ladder one rung at a time. By the top they are describing Omega. Then say so and show Omega connected to their data.';
    tone='Respectful of the builder';
  }
  // package
  let pkg, pkgWhy;
  const unfinished=s.stage==='idea'||s.stage==='proto';
  if(s.stage==='failed'){ pkg=fin?'fin':(sig.includes('teams')||sig.includes('mandate')?'ent':'core'); pkgWhy='The build broke. Skip the build questions, lead with what broke and the fix.'; }
  else if(fin){
    if(sig.includes('teams')||sig.includes('mandate')){pkg='ent';pkgWhy='Teams beyond finance or a mandate from the top. Sell Finance now if they are not ready, but log Enterprise as the path.';}
    else if(gaps.length>=2){pkg='fin';pkgWhy='They named the gaps themselves. A finance-only start with the context layer underneath is the natural next step.';}
    else if(s.stage==='live'){pkg='wait';pkgWhy='It is running and they have not admitted much. Check in the week after their next cycle.';}
    else {pkg=gaps.length?'fin':'wait';pkgWhy=gaps.length?'One gap admitted. Push on the others, then offer a demo on their data.':'No gaps admitted yet. Run the funnel, then set a check-in tied to their next budget cycle.';}
  } else {
    if(sig.includes('mandate')||sig.includes('teams')){pkg='ent';pkgWhy='An AI mandate or several teams planning. This is a program, not a tool. Planning is the first use case.';}
    else if(sig.includes('own')&&!sig.includes('excel')){pkg='core';pkgWhy='They want to own the data layer and build on it. Give them the context layer with MCP and API access.';}
    else if(sig.includes('excel')){pkg='ent';pkgWhy='IT builds the platform, finance wants Excel on top. Omega connected to their platform with the finance interfaces.';}
    else if(lad.length>=5&&unfinished){pkg='wait';pkgWhy='They have thought through most of the ladder and are still building. Offer an architecture review and check in when the semantic model is done.';}
    else {pkg='core';pkgWhy='Lead with Omega connected to their platform. The unticked rungs are your conversation.';}
  }
  // people
  const people=[];
  if(fin){ people.push(['PS','Standard presales','A planning demo on their own data. Presales does this every day.']);
    if(s.build!=='chat'||gaps.includes('g5')||gaps.includes('g6')) people.push(['SA','Solution Architecture, one call','The AI questions need someone who has built with these tools.']); }
  else { people.push(['SA','Solution Architecture','They need the ladder from someone who can go deep on semantic models, context and orchestration.']);
    if(isPlat||sig.includes('dbx')) people.push(['MO','Morpheo team','Connecting Omega to their platform is a technical conversation. Morpheo speaks it.']); }
  if(pkg==='ent') people.push(['AD','Advisory team','This is a program. Advisory frames the roadmap and the FDE model.']);
  if(s.stage==='failed') people.push(['RE','Whoever they spoke to before','Continuity matters. They already trust that person.']);
  // funnel
  const funnel=fin?[
   ['Situation','Understand the build',['"Walk me through how you\'d set it up."','"What tool does the heavy lifting?"','"Who maintains it after go-live?"'],'Heard, not sold to'],
   ['Last mile','Surface the gaps',Object.keys(GAPS).filter(g=>!gaps.includes(g)&&['g1','g2','g3'].includes(g)).map(g=>GAPS[g][1]),'Slight doubt they found on their own'],
   ['Cost of the build','Put a price on it',['"Who\'s on this and for how long?"','"Which close will run on it first?"',...(gaps.includes('g4')?[]:[GAPS.g4[1]]),'"What are you not doing while you build this?"'],'The build isn\'t free'],
   ['What AI needs','Move from tools to context',[...(gaps.includes('g5')?[]:[GAPS.g5[1]]),...(gaps.includes('g6')?[]:[GAPS.g6[1]])].concat(gaps.includes('g5')&&gaps.includes('g6')?['"Where would that business knowledge live so the model can use it?"']:[]),'The gap is context, not tools'],
   ['Outcome','Agree the future state',['"If this worked perfectly in 12 months, what would be different?"','"Who else would benefit beyond finance?"'],'Ambition'],
   ['Commit','Pick a path',['"Would it be a bad idea to keep your Excel and add the context layer under it?"','"Does it make sense to look at what a finance-only start costs?"'],'In control of the choice'],
  ]:[
   ['Situation','Respect the builder',['"What\'s driving this? A mandate, a cost, a failed tool?"','"Who\'s the sponsor?"'],'Respected as a builder'],
   ['Build ladder','Ask the unticked rungs, in order',Object.keys(RUNGS).filter(r=>!lad.includes(r)).map(r=>RUNGS[r][1]),'They find the gaps themselves'],
   ['Cost of the build','A timeline and a payroll',['"How many engineers, for how long?"','"What\'s their opportunity cost?"','"When does finance actually get to use it?"'],'The build has a price'],
   ['Outcome','Bigger than a planning tool',['"What does the business get in year two that it didn\'t get in year one?"','"Which teams beyond finance would use this?"'],'Ambition beyond finance'],
   ['The turn','Name it',['"Everything you just described is what Omega is. It connects to your platform, builds the semantic model, keeps the context, including how your team plans and approves, and finance gets it in Excel and Power BI."'],'Recognition, not defeat'],
   ['Commit','A shortcut, not a pitch',['"Would it be a bad idea to see Omega on your own data before you commit the engineering time?"'],'In control, with a shortcut'],
  ];
  if(s.stage==='failed'){ funnel.splice(1,fin?3:2,['What broke','Lead with the fix',['"What broke, and who felt it?"','"What did the auditor or the CFO ask that you couldn\'t answer?"','"What would need to be true for the team to trust it again?"'],'Relief that someone gets it']); }
  // actions
  const actions=[];
  if(pkg==='wait'&&fin) actions.push(['Today','Calendar a check-in for the week after their next budget or forecast cycle. Open with "How did the cycle go on the new setup?" Nothing else.'],['This week','Send one useful thing (a template, a checklist), not a pitch.'],['Salesforce','Stage: Nurture. Log the build tool, the gaps and the check-in date as next step.']);
  else if(pkg==='wait') actions.push(['Today','Ask to check in when the semantic model is done. Offer a free architecture review from Solution Architecture.'],['Salesforce','Stage: Nurture. Log the platform and the rungs they have built.']);
  else if(s.stage==='failed') actions.push(['Today','Ask for a 30-minute call on what broke. Lead with the fix, skip the build questions.'],['Salesforce','Reopen the opp. Log what broke and who felt it.']);
  else if(pkg==='fin') actions.push(['This week','Book a demo on their own data within two weeks.'],['Today','Send a two-line recap of the gaps they named, in their words.'],['Salesforce','Stage: Discovery to Demo. Log the build tool and the gaps.']);
  else if(pkg==='core') actions.push(['This week','Offer an architecture session with Solution Architecture. Show Omega connected to their platform.'],['Salesforce','Stage: Technical validation. Log the platform and which rungs they have built.']);
  else if(pkg==='ent') actions.push(['This week','Ask for a joint call with finance leadership and the data lead. Bring Advisory.'],['Salesforce','Stage: Executive alignment. Log the sponsor and the mandate.']);
  if(sig.includes('dbx')) actions.push(['Objection','Open the head to head for their platform on the Compare tab and use its talk track. Book Morpheo for the next call. Re-ask rungs 3, 4 and 6 about the platform specifically, then position Omega as the planning and context layer on top.']);
  if(sig.includes('platplan')) actions.push(['Competitor','A platform planning product is in play. Against Fabric Planning lead with consolidation, allocations, Excel and the GA Planning Agent. Against SAP lead with speed to value and non-SAP data. Open the matching head to head before the next call.']);
  if(sig.includes('teams')&&pkg!=='ent') actions.push(['Expansion','They mentioned teams beyond finance. Log Enterprise as the expansion path.']);
  const words=fin?[['"Have you thought about how the model learns what a driver means at your company?"','"AI can\'t do planning"'],['"You keep Excel. The context layer sits under it"','"You\'d replace your spreadsheets"'],['"What happens when that person leaves?"','"That\'s not sustainable"'],['"Would it be a bad idea to see it on your data first?"','"Can I book a demo?"']]
   :[['"Everything you described is what Omega is"','"You\'d be rebuilding Vena"'],['"Omega connects to the platform you already run and adds the planning memory it does not keep"','"You\'d move everything to us"'],['"What does the second year look like?"','"What\'s your budget?"'],['"Would it be a bad idea to see it on your data first?"','"Can I book a demo?"']];
  return {persona,believe,truth,play,tone,pkg,pkgWhy,people,funnel,actions,words,platId,fin};
}

// ---------- state & render ----------
let state={}, idx=0;
const host=document.getElementById('stepHost'), prog=document.getElementById('progress');
const visible=()=>STEPS.filter(st=>!st.onlyIf||st.onlyIf(state));
try{const saved=JSON.parse(localStorage.getItem('bvb-state')||'null');if(saved&&saved.state){state=saved.state;idx=saved.idx||0;}}catch(e){}
function save(){try{localStorage.setItem('bvb-state',JSON.stringify({state,idx}))}catch(e){}}

function renderProgress(){
  const v=visible(); prog.innerHTML='';
  v.forEach((st,i)=>{const s=document.createElement('span');if(i<idx)s.className='done';else if(i===idx)s.className='cur';prog.appendChild(s)});
  const s=document.createElement('span');s.className=idx>=v.length?'done':'';prog.appendChild(s);
}
function render(){
  renderProgress(); const v=visible();
  if(idx>=v.length){renderResult();return;}
  const st=v[idx]; const sel=state[st.id];
  host.innerHTML=`<div class="step">
    <div class="eyebrow">Step ${idx+1} of ${v.length}</div>
    <div class="q">${st.q}</div>
    <p class="why">${st.why}</p>
    ${st.tip?`<div class="tip">${ICONS.info}<div>${st.tip}</div></div>`:''}
    <div class="opts">${st.opts.map(o=>{const on=st.multi?(sel||[]).includes(o.v):sel===o.v;return `<button class="opt" type="button" aria-pressed="${on}" data-v="${o.v}"><span class="ic">${ICONS[o.ic]}</span><span><b>${o.b}</b><small>${o.s}</small></span></button>`}).join('')}</div>
    <div class="nav">
      <button class="btn ghost" id="back" ${idx===0?'disabled':''}>Back</button>
      <span class="hint">${st.multi?'Pick all that apply, or none':'Pick one'}</span>
      <button class="btn" id="next" ${(!st.multi&&!sel)?'disabled':''}>${idx===v.length-1?'Show the path':'Next'}</button>
    </div></div>`;
  host.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    const v=b.dataset.v;
    if(st.multi){const a=new Set(state[st.id]||[]);a.has(v)?a.delete(v):a.add(v);state[st.id]=[...a];}
    else state[st.id]=v;
    if(st.id==='owner'){delete state.ladder;delete state.gaps;}
    save(); render();
  }));
  host.querySelector('#back').addEventListener('click',()=>{idx--;save();render()});
  host.querySelector('#next').addEventListener('click',()=>{idx++;save();render()});
}
const label=(id,v)=>{const st=STEPS.find(s=>s.id===id);const o=st&&st.opts.find(o=>o.v===v);return o?o.b:''};
function platIntel(r){
  const p=r.platId&&typeof PROV!=='undefined'?PROV[r.platId]:null; if(!p)return '';
  const tools=p.tools.filter(t=>['context','ai','planning'].includes(capOf(t))).slice(0,6);
  const terms=GLO.filter(g=>g.category===({fabric:'Microsoft',google:'Google',aws:'AWS',sap:'SAP',palantir:'Palantir',snowflake:'Snowflake',databricks:'Databricks'})[p.id]).slice(0,10);
  const rungs=!r.fin?Object.keys(RUNGS).map(k=>{const c=p.ratings[RUNG_CRIT[k]]||{r:'nd'},v=VENA.ratings[RUNG_CRIT[k]]||{r:'nd'};return `<div class="row"><b>${esc(RUNGS[k][0])}</b><span>${rt(c.r)} ${esc(c.note)} <span class="muted">Vena</span> ${rt(v.r)}</span></div>`}).join(''):'';
  return `<div class="card pintel" style="--pc:${PCOLOR[p.id]}">
    <div style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div style="display:flex;gap:12px;align-items:center">${avatar(p,40)}<div><div class="eyebrow">Platform intel</div><h2 style="margin:2px 0 0">What ${esc(p.short)} will put in front of them</h2></div></div>
    <button class="btn ghost" data-openh2h="${p.id}">Open Vena vs ${esc(p.short)}</button></div>
    <div class="tgrid" style="margin-top:14px">${tools.map(t=>toolCard({...t,p,cap:capOf(t),sg:statusGroup(t.status)},false)).join('')}</div>
    ${rungs?`<h3 style="margin:18px 0 6px">Their platform, rung by rung</h3><div class="list">${rungs}</div>`:''}
    <div class="grid2" style="margin-top:16px">
      <div><h3 style="margin-bottom:6px">What they still have to build</h3><ul class="plain checks">${p.build.slice(0,6).map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>
      <div><h3 style="margin-bottom:6px">Talk track for ${esc(p.short)}</h3><div class="talk">${p.talkTrack.map(t=>`<div>${esc(t)}</div>`).join('')}</div></div>
    </div>
    ${terms.length?`<h3 style="margin:16px 0 6px">Terms you will hear</h3><div class="term"><div class="rel">${terms.map(g=>`<button data-gterm="${esc(g.term)}">${esc(g.term)}</button>`).join('')}</div></div>`:''}
  </div>`;
}
function renderResult(){
  const r=evaluate(state), pk=PKG[r.pkg];
  const summary=[`Build vs Buy summary`,`Decision maker: ${label('owner',state.owner)}`,`Building on: ${label('build',state.build)}`,`Stage: ${label('stage',state.stage)}`,...(r.platId&&typeof PROV!=='undefined'&&PROV[r.platId]?[`Compare: Vena ${PROV[r.platId].headline}`]:[]),`Persona: ${r.persona}`,`Recommended path: ${pk.n}`,`Why: ${r.pkgWhy}`,`Bring in: ${r.people.map(p=>p[1]).join('; ')}`,`Next actions:`,...r.actions.map(a=>`- ${a[0]}: ${a[1]}`),`Questions still to ask:`,...r.funnel.flatMap(f=>f[2].map(q=>`- ${q}`))].join('\n');
  host.innerHTML=`<div class="result">
   <div class="hero">
    <div class="card accent">
      <div class="eyebrow">Persona</div>
      <h2 style="font-size:26px;margin:4px 0 10px">${r.persona}</h2>
      <dl class="kv">
        <dt>They believe</dt><dd>${r.believe}</dd>
        <dt>Usually true</dt><dd>${r.truth}</dd>
        <dt>Your play</dt><dd>${r.play}</dd>
        <dt>Tone</dt><dd>${r.tone}</dd>
      </dl>
    </div>
    <div class="card">
      <div class="eyebrow">Recommended path</div>
      <h2 style="font-size:24px;margin:4px 0 8px">${pk.n}</h2>
      <p class="muted" style="font-size:14px">${pk.d}</p>
      <p style="margin-top:12px;font-size:14px"><b>Why this one.</b> ${r.pkgWhy}</p>
      <div class="vof" style="margin-top:14px"><span>${label('owner',state.owner)}</span><span>${label('build',state.build)}</span><span>${label('stage',state.stage)}</span></div>
    </div>
   </div>
   <div class="card">
    <div class="eyebrow">Question funnel</div>
    <h2 style="margin:4px 0 4px">What to ask, in order</h2>
    <p class="muted" style="margin-bottom:14px;font-size:14px">Each stage has a purpose for you and a feeling you want them to land on. Questions you already covered are left out.</p>
    <div class="funnel">${r.funnel.map((f,i)=>`<div class="rung"><div class="n">${i+1}</div><div><h3>${f[0]}</h3><ul>${f[2].map(q=>`<li>${q}</li>`).join('')||'<li class="muted">Covered. Move on.</li>'}</ul><div class="vof"><span><b>Value</b> ${f[1]}</span><span><b>Feeling</b> ${f[3]}</span></div></div></div>`).join('')}</div>
   </div>
   <div class="grid2">
    <div class="card"><div class="eyebrow">Bring in from Vena</div><h2 style="margin:4px 0 12px">Who joins the next call</h2>
     <div class="people">${r.people.map(p=>`<div class="person"><div class="av">${p[0]}</div><div><b>${p[1]}</b><div class="muted" style="font-size:13.5px">${p[2]}</div></div></div>`).join('')}</div>
     <p class="muted" style="font-size:13px;margin-top:14px">Don't bring Product into prospect calls. Route product questions through Solution Architecture.</p></div>
    <div class="card actions"><div class="eyebrow">Deal actions</div><h2 style="margin:4px 0 8px">Do these today</h2>
     <div class="list">${r.actions.map(a=>`<div class="row"><b>${a[0]}</b><span>${a[1]}</span></div>`).join('')}</div></div>
   </div>
   ${platIntel(r)}
   <div class="card"><div class="eyebrow">Language</div><h2 style="margin:4px 0 8px">Say this, not that</h2>
     <div class="list">${r.words.map(w=>`<div class="row"><b style="color:var(--accent-deep)">${w[0]}</b><span class="muted">not ${w[1]}</span></div>`).join('')}</div></div>

  const list=TOOLS.filter(t=>(!cs.tPlat.length||cs.tPlat.includes(t.p.id))&&(!cs.tCap.length||cs.tCap.includes(t.cap))&&(!cs.tStat.length||cs.tStat.includes(t.sg))&&(!q||[t.name,t.what,t.mapsTo,t.p.short].join(' ').toLowerCase().includes(q)));
  const stats=['GA','Preview','Beta','Other'];
  const any=cs.tPlat.length||cs.tCap.length||cs.tStat.length||cs.tq;
  return `<div class="card filters">
    <div class="gl-search"><input id="tq" type="search" placeholder="Search tools, like Genie, Cortex, memory or write-back" value="${esc(cs.tq)}" aria-label="Search tools" autocomplete="off"><span class="hint">${list.length} of ${TOOLS.length} tools</span>${any?'<button class="linkbtn" data-tclear="1">Clear filters</button>':''}</div>
    <div class="frow"><span class="flabel">Platform</span><div class="chips">${COMPETITORS.map(p=>`<button class="chip sm pchip" data-tplat="${p.id}" aria-pressed="${cs.tPlat.includes(p.id)}" style="--pc:${PCOLOR[p.id]}">${esc(p.short)} <small>${p.tools.length}</small></button>`).join('')}</div></div>
    <div class="frow"><span class="flabel">Capability</span><div class="chips">${CAPS.map(c=>`<button class="chip sm" data-tcap="${c.id}" aria-pressed="${cs.tCap.includes(c.id)}">${esc(c.name)} <small>${TOOLS.filter(t=>t.cap===c.id).length}</small></button>`).join('')}</div></div>
    <div class="frow"><span class="flabel">Status</span><div class="chips">${stats.map(s=>`<button class="chip sm" data-tstat="${s}" aria-pressed="${cs.tStat.includes(s)}">${s} <small>${TOOLS.filter(t=>t.sg===s).length}</small></button>`).join('')}</div></div>
  </div>
  <div class="tgrid">${list.map(t=>toolCard(t)).join('')||'<div class="empty">No tools match. Clear a filter or shorten the search.</div>'}</div>`;
}
function secMatrix(){
  const cols=[VENA,...COMPETITORS.filter(p=>cs.mProv.includes(p.id))];
  const differs=k=>{const v=RANK[(VENA.ratings[k.id]||{}).r];return cols.slice(1).some(p=>{const o=RANK[(p.ratings[k.id]||{}).r];return v&&o&&v!==o;});};
  let pop='<div class="cellpop muted">Select any rating to see the note and sources. Select a platform name to open its head to head.</div>';
  if(cs.cell){const p=PROV[cs.cell.p],k=ALLCRIT.find(x=>x.id===cs.cell.k),c=p.ratings[cs.cell.k]||{};pop=`<div class="cellpop">${avatar(p,24)} <b>${esc(p.short)}</b> on <b>${esc(k.name)}</b><div style="margin-top:6px">${rt(c.r)}${stTag(c.status)}</div><p style="margin-top:6px">${esc(c.note)} ${srcLinks(c.src)}</p></div>`;}
  const rows=CMP.categories.filter(c=>cs.cats.includes(c.id)).map(c=>{const ks=c.criteria.filter(k=>!cs.diff||differs(k));if(!ks.length)return '';return `<tr class="cat"><td colspan="${cols.length+1}">${esc(c.name)}</td></tr>`+ks.map(k=>`<tr><td class="crit">${esc(k.name)}</td>${cols.map(p=>{const c2=p.ratings[k.id]||{r:'nd'};return `<td class="cell ${p.id==='vena'?'vena':''}"><button data-p="${p.id}" data-k="${k.id}" aria-label="${esc(p.short+' '+k.name)}">${rt(c2.r)}</button>${cs.notes?`<p>${esc(c2.note)}</p>`:''}</td>`}).join('')}</tr>`).join('')}).join('');
  return `<div class="card filters">
    <div class="frow"><span class="flabel">Platforms</span><div class="chips">${COMPETITORS.map(p=>`<button class="chip sm pchip" data-mprov="${p.id}" aria-pressed="${cs.mProv.includes(p.id)}" style="--pc:${PCOLOR[p.id]}">${esc(p.short)}</button>`).join('')}</div></div>
    <div class="frow"><span class="flabel">Categories</span>${catChips()}</div>
    <div class="frow"><span class="flabel">View</span><div class="chips"><button class="chip sm" data-mnotes="1" aria-pressed="${cs.notes}">Show notes in cells</button><button class="chip sm" data-mdiff="1" aria-pressed="${cs.diff}">Only rows where Vena differs</button></div></div>
    ${legendHtml()}</div>
  ${pop}
  <div class="mtx master ${cs.notes?'withnotes':''}"><table><thead><tr><th>Criterion</th>${cols.map(p=>`<th class="pv ${p.id==='vena'?'vena':''}">${p.id==='vena'?'Vena':`<button data-goh2h="${p.id}">${esc(p.short)}</button>`}</th>`).join('')}</tr></thead>
  <tbody>${rows}<tr class="tot"><td class="crit">Strong ratings</td>${cols.map(p=>`<td class="cell ${p.id==='vena'?'vena':''}"><b>${tally(p).strong}</b></td>`).join('')}</tr></tbody></table></div>`;
}
function secEffort(){
  return `<div class="card"><div class="eyebrow">If they build it themselves</div><h2 style="margin:4px 0 8px">What building FP&amp;A planning on a lakehouse takes</h2><p class="muted" style="font-size:14px;max-width:80ch;margin-bottom:12px">${esc(CMP.effortNote)}</p>
    <div class="effort">${CMP.effort.map(e=>{const lvl=/high/i.test(e.complexity)?'high':/medium/i.test(e.complexity)?'med':'low';return `<div class="ef"><div class="ef-top"><b>${esc(e.component)}</b><span class="lvl ${lvl}">${esc(e.complexity)}</span></div><p>${esc(e.whatItTakes)}</p><small class="muted">${esc(e.evidence)} ${srcLinks(e.src)}</small></div>`}).join('')}</div></div>
  <div class="card"><div class="eyebrow">Buy on the platform</div><h2 style="margin:4px 0 8px">Planning vendors and semantic layers that connect to lakehouses</h2><p class="muted" style="font-size:14px;margin-bottom:10px">Most planning vendors still copy data into their own engine.</p>
    <div class="tbl"><table><thead><tr><th>Name</th><th>Type</th><th>How it reaches lakehouse data</th><th>Context or memory claim</th><th>Status</th></tr></thead><tbody>
    ${CMP.alternatives.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.type)}</td><td>${esc(a.lakehouse)} ${srcLinks(a.src)}</td><td>${esc(a.memory)}</td><td>${esc(a.status)}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}
function secEvidence(){
  return `<div class="card"><div class="eyebrow">Before you use this with a customer</div><h2 style="margin:4px 0 10px">Caveats</h2><ul class="plain">${CMP.caveats.map(c=>`<li>${esc(c.text)} ${srcLinks(c.src)}</li>`).join('')}</ul></div>
  <div class="card"><div class="eyebrow">Where sources disagree</div><h2 style="margin:4px 0 10px">Safe wording</h2><div class="tbl"><table><thead><tr><th>Item</th><th>Conflict</th><th>Say this</th></tr></thead><tbody>${CMP.conflicts.map(c=>`<tr><td>${esc(c.item)}</td><td>${esc(c.detail)} ${srcLinks(c.src)}</td><td>${esc(c.safeWording)}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><div class="eyebrow">Internal</div><h2 style="margin:4px 0 10px">Open questions for Vena</h2><ul class="plain">${CMP.openQuestions.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></div>
  <div class="card"><div class="eyebrow">Audit trail</div><h2 style="margin:4px 0 10px">Sources (${CMP.sources.length})</h2><ol class="srclist">${CMP.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('')}</ol></div>`;
}
function renderCompare(){
  const host=document.getElementById('view-compare');
  const body={overview:secOverview,h2h:secH2H,tools:secTools,matrix:secMatrix,effort:secEffort,evidence:secEvidence}[cs.sec]||secOverview;
  const ae=document.activeElement, focusTq=ae&&ae.id==='tq', caret=focusTq?ae.selectionStart:null;
  host.innerHTML=`<div class="cmp">
    <section class="xhero"><div><div class="eyebrow">Compare platforms</div><h2>Morpheo and Omega vs the data platforms</h2>
      <p>What Snowflake, Databricks, Microsoft, Google, AWS, SAP and Palantir actually ship, rated on the same ${ALLCRIT.length} criteria, with every rating linked to its source.</p></div>
      <div class="xstats"><div><b>${COMPETITORS.length}</b><small>platforms</small></div><div><b>${TOOLS.length}</b><small>tools tracked</small></div><div><b>${ALLCRIT.length}</b><small>criteria</small></div><div><b>${CMP.sources.length}</b><small>sources</small></div></div></section>
    <details class="banner" ${cs.banner?'open':''}><summary>Read before using this with a customer</summary><ul>${CMP.caveats.slice(0,4).map(c=>`<li>${esc(c.text)}</li>`).join('')}</ul><p class="muted" style="font-size:12.5px;margin-top:8px">Research as of ${esc(CMP.asOf)}. Public sources only. Full caveats and sources are under Caveats and sources.</p></details>
    <nav class="subnav" role="tablist" aria-label="Compare sections">${SECS.map(([id,n])=>`<button role="tab" data-sec="${id}" aria-selected="${cs.sec===id}">${n}</button>`).join('')}</nav>
    ${body()}
  </div>`;
  const $=s=>host.querySelectorAll(s);
  host.querySelector('.banner').addEventListener('toggle',e=>{cs.banner=e.target.open;});
  $('[data-sec]').forEach(b=>b.onclick=()=>{cs.sec=b.dataset.sec;cs.cell=null;saveCs();renderCompare();});
  $('[data-goh2h]').forEach(b=>b.onclick=()=>{cs.sec='h2h';cs.provider=b.dataset.goh2h;saveCs();renderCompare();host.scrollIntoView({behavior:'smooth'});});
  $('[data-prov]').forEach(b=>b.onclick=()=>{cs.provider=b.dataset.prov;saveCs();renderCompare();});
  $('[data-cat]').forEach(b=>b.onclick=()=>{const c=b.dataset.cat;if(cs.cats.includes(c)){if(cs.cats.length>1)cs.cats=cs.cats.filter(x=>x!==c);}else cs.cats=[...cs.cats,c];saveCs();renderCompare();});
  $('[data-mprov]').forEach(b=>b.onclick=()=>{const n=toggleIn(cs.mProv,b.dataset.mprov);if(n.length)cs.mProv=n;saveCs();renderCompare();});
  $('[data-mnotes]').forEach(b=>b.onclick=()=>{cs.notes=!cs.notes;saveCs();renderCompare();});
  $('[data-mdiff]').forEach(b=>b.onclick=()=>{cs.diff=!cs.diff;saveCs();renderCompare();});
  $('.mtx.master td.cell button').forEach(b=>b.onclick=()=>{cs.cell={p:b.dataset.p,k:b.dataset.k};renderCompare();});
  $('[data-tplat]').forEach(b=>b.onclick=()=>{cs.tPlat=toggleIn(cs.tPlat,b.dataset.tplat);saveCs();renderCompare();});
  $('[data-tcap]').forEach(b=>b.onclick=()=>{cs.tCap=toggleIn(cs.tCap,b.dataset.tcap);saveCs();renderCompare();});
  $('[data-tstat]').forEach(b=>b.onclick=()=>{cs.tStat=toggleIn(cs.tStat,b.dataset.tstat);saveCs();renderCompare();});
  $('[data-tclear]').forEach(b=>b.onclick=()=>{cs.tPlat=[];cs.tCap=[];cs.tStat=[];cs.tq='';saveCs();renderCompare();});
  const tq=host.querySelector('#tq'); if(tq){tq.addEventListener('input',()=>{cs.tq=tq.value;renderCompare();}); if(focusTq){tq.focus();if(caret!=null)tq.setSelectionRange(caret,caret);}}
}
function openCompare(sec,provider){if(provider)cs.provider=provider;if(sec)cs.sec=sec;saveCs();showView('compare');window.scrollTo({top:0,behavior:'smooth'});}

// ---------- glossaries ----------
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-');
const firstLetter=t=>{const c=t.trim()[0].toUpperCase();return /[A-Z]/.test(c)?c:'#';};
const TERM_HOME=new Map(); // term -> glossary id
const GLOSSARIES={};
function makeGlossary(cfg){
  const g={cfg,built:false,st:Object.assign({q:'',sel:[],mode:'both'},load(cfg.storeKey)||{})};
  g.st.q='';
  cfg.data.forEach(e=>{if(!TERM_HOME.has(e.term))TERM_HOME.set(e.term,cfg.id);});
  const pfx=cfg.id+'-';
  const save=()=>store(cfg.storeKey,{sel:g.st.sel,mode:g.st.mode});
  const host=()=>document.getElementById(cfg.hostId);
  const cnt=c=>cfg.data.filter(e=>e.category===c).length;
  function matches(e){const st=g.st;if(st.sel.length&&!st.sel.includes(e.category))return false;const q=st.q.trim().toLowerCase();if(!q)return true;return [e.term,...(e.aka||[]),e.technical,e.sales].join(' ').toLowerCase().includes(q);}
  function card(e){
    const rel=(e.related||[]).filter(r=>TERM_HOME.has(r));
    return `<article class="term" id="${pfx}${slug(e.term)}">
      <div class="term-h"><h3>${esc(e.term)}</h3><span class="pill">${esc(e.category)}</span></div>
      ${e.aka&&e.aka.length?`<div class="aka">Also called ${esc(e.aka.join(', '))}</div>`:''}
      ${g.st.mode!=='tech'?`<div class="def sales"><b>In plain terms</b>${esc(e.sales)}</div>`:''}
      ${g.st.mode!=='sales'?`<div class="def"><b>Technical</b>${esc(e.technical)}</div>`:''}
      ${rel.length?`<div class="rel"><span>See also</span>${rel.map(r=>`<button data-rel="${esc(r)}" ${TERM_HOME.get(r)!==cfg.id?'class="ext" title="Opens in the other glossary"':''}>${esc(r)}</button>`).join('')}</div>`:''}
      ${e.src?`<div class="foot"><a href="${esc(e.src)}" target="_blank" rel="noopener">Official source</a></div>`:''}
    </article>`;
  }
  function list(){
    const h=host(),st=g.st,q=st.q.trim().toLowerCase();
    const items=cfg.data.filter(matches);
    const starts=e=>e.term.toLowerCase().startsWith(q)||(e.aka||[]).some(x=>x.toLowerCase().startsWith(q));
    items.sort((a,b)=>{if(q){const x=starts(a),y=starts(b);if(x!==y)return x?-1:1;}return a.term.localeCompare(b.term,undefined,{sensitivity:'base'});});
    h.querySelector('.gl-count').textContent=`${items.length} of ${cfg.data.length} terms`;
    const letters=new Set(items.map(e=>firstLetter(e.term)));
    const az=h.querySelector('.az');
    az.innerHTML=[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map(l=>`<button data-az="${l}" ${letters.has(l)&&!q?'':'disabled'}>${l}</button>`).join('');
    az.querySelectorAll('[data-az]').forEach(b=>b.onclick=()=>{const el=document.getElementById(pfx+'L-'+b.dataset.az);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});});
    const out=h.querySelector('.gl-out');
    if(!items.length){out.innerHTML=`<div class="empty">No terms match "${esc(st.q)}". Try a shorter word or clear the filters.</div>`;return;}
    if(q)out.innerHTML=`<div class="gl-list">${items.map(card).join('')}</div>`;
    else{const groups={};items.forEach(e=>{const L=firstLetter(e.term);(groups[L]=groups[L]||[]).push(e);});
      out.innerHTML=Object.keys(groups).sort().map(L=>`<section class="gl-group"><h2 class="gl-letter" id="${pfx}L-${L}">${L}</h2><div class="gl-list">${groups[L].map(card).join('')}</div></section>`).join('');}
    out.querySelectorAll('[data-rel]').forEach(b=>b.onclick=()=>jumpTo(b.dataset.rel));
  }
  function sync(){
    const h=host();
    h.querySelectorAll('[data-gsel]').forEach(x=>x.setAttribute('aria-pressed',g.st.sel.includes(x.dataset.gsel)));
    h.querySelectorAll('[data-gmode]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.gmode===g.st.mode));
    h.querySelector('.gl-clear').hidden=!(g.st.sel.length||g.st.q);
  }
  g.reset=()=>{g.st.q='';g.st.sel=[];const i=host().querySelector('.gl-q');if(i)i.value='';sync();list();};
  g.focusTerm=t=>{g.reset();const el=document.getElementById(pfx+slug(t));if(!el)return;el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600);};
  g.render=()=>{
    if(g.built)return; g.built=true;
    const h=host();
    h.innerHTML=`<section class="xhero"><div><div class="eyebrow">${esc(cfg.eyebrow)}</div><h2>${esc(cfg.title)}</h2><p>${esc(cfg.sub)}</p></div>
      <div class="xstats"><div><b>${cfg.data.length}</b><small>terms</small></div>${cfg.groups.map(gr=>{const n=gr.cats.filter(c=>cnt(c)).length;return `<div><b>${n}</b><small>${esc(gr.label.toLowerCase())}${n===1?'':'s'}</small></div>`}).join('')}</div></section>
      <div class="gl-tools">
        <div class="gl-search"><input class="gl-q" type="search" id="${pfx}q" placeholder="${esc(cfg.placeholder)}" aria-label="Search ${esc(cfg.title)}" autocomplete="off">
          <div class="seg" role="group" aria-label="Definition view"><button data-gmode="both">Both</button><button data-gmode="sales">Plain terms</button><button data-gmode="tech">Technical</button></div>
          <span class="hint gl-count"></span><button class="linkbtn gl-clear" hidden>Clear filters</button></div>
        ${cfg.groups.map(gr=>`<div class="frow"><span class="flabel">${esc(gr.label)}</span><div class="chips">${gr.cats.filter(c=>cnt(c)).map(c=>`<button class="chip sm ${gr.colors?'pchip':''}" data-gsel="${esc(c)}" ${gr.colors?`style="--pc:${gr.colors[c]||'#888'}"`:''}>${esc(c)} <small>${cnt(c)}</small></button>`).join('')}</div></div>`).join('')}
        <nav class="az" aria-label="Jump to letter"></nav>
      </div><div class="gl-out"></div>`;
    const q=h.querySelector('.gl-q'); q.addEventListener('input',()=>{g.st.q=q.value;sync();list();});
    h.querySelectorAll('[data-gsel]').forEach(b=>b.onclick=()=>{g.st.sel=toggleIn(g.st.sel,b.dataset.gsel);save();sync();list();});
    h.querySelectorAll('[data-gmode]').forEach(b=>b.onclick=()=>{g.st.mode=b.dataset.gmode;save();sync();list();});
    h.querySelector('.gl-clear').onclick=()=>{g.reset();save();};
    sync(); list();
  };
  GLOSSARIES[cfg.id]=g; return g;
}
function jumpTo(term){
  const home=TERM_HOME.get(term); if(!home)return;
  const g=GLOSSARIES[home]; const view=g.cfg.view;
  if(document.getElementById('view-'+view).hidden)showView(view);
  g.render(); setTimeout(()=>g.focusTerm(term),30);
}
const GEN_ORDER=['Data foundations','Data management','AI fundamentals','Agents and AI apps','Cloud and software'];
makeGlossary({id:'gp',view:'glossary',hostId:'view-glossary',data:GLO,storeKey:'bvb-gl-p',eyebrow:'Platform glossary',
  title:'Product names and planning terms by platform',
  sub:'What each platform calls its tools, what they actually do, and the planning language you will need to explain why they are not a planning product. Each entry has a plain version for the customer and a technical one for the data team.',
  placeholder:'Search a product or term, like Genie, Cortex Analyst or write-back',
  groups:[{label:'Topic',cats:['Planning and FP&A']},{label:'Platform',cats:['Vena','Snowflake','Databricks','Microsoft','Google','AWS','SAP','Palantir'],colors:{Vena:PCOLOR.vena,Snowflake:PCOLOR.snowflake,Databricks:PCOLOR.databricks,Microsoft:PCOLOR.fabric,Google:PCOLOR.google,AWS:PCOLOR.aws,SAP:PCOLOR.sap,Palantir:PCOLOR.palantir}}]});
makeGlossary({id:'gg',view:'aiglossary',hostId:'view-aiglossary',data:GLO_GEN,storeKey:'bvb-gl-g',eyebrow:'AI and data glossary',
  title:'The general AI and data terms, in plain words',
  sub:'Vendor-neutral definitions for the words that come up on every data and AI conversation, from data lake and semantic layer to LLM, agent, MCP and AGI.',
  placeholder:'Search a term, like data lake, semantic layer, MCP or AGI',
  groups:[{label:'Topic',cats:GEN_ORDER.concat(Array.from(new Set(GLO_GEN.map(e=>e.category))).filter(c=>!GEN_ORDER.includes(c)))}]});
function renderGlossary(){GLOSSARIES.gp.render();}
function renderAiGlossary(){GLOSSARIES.gg.render();}

render();
const HASHMAP={'#reference':'ref','#compare':'compare','#glossary':'glossary','#ai-glossary':'aiglossary'};
if(HASHMAP[location.hash])showView(HASHMAP[location.hash]);

signer and use agents built with ADK. Gemini Enterprise for Financial Services, in preview since August 25, 2026, targets banking use cases rather than FP&A.", "sales": "Google's front door for company-wide AI assistants. Its finance edition targets banks and investment research, not corporate budgeting.", "related": ["Agent Development Kit (ADK)", "Agent Runtime and Memory Bank", "Conversational Analytics API"], "src": "https://cloud.google.com/blog/topics/google-cloud-next/google-cloud-next-2026-wrap-up"}, {"term": "Genie", "aka": ["Genie Agents", "Genie One", "Genie spaces", "Databricks One", "AI/BI Genie"], "category": "Databricks", "technical": "Databricks' natural-language analytics family. Genie Agents (renamed from Genie spaces in July 2026) answer questions over curated tables with read-only queries under each user's permissions, and Genie One (renamed from Databricks One) is the business-user agent app, both GA, with usage by people free through January 31, 2027.", "sales": "Databricks' ask-your-data assistant for business users. Its generated queries are always read-only, so it can explain the numbers but cannot update a plan.", "related": ["Genie Ontology", "Knowledge store", "Text-to-SQL", "Databricks Unit (DBU)"], "src": "https://learn.microsoft.com/en-us/azure/databricks/genie-agents/concepts"}, {"term": "Genie Ontology", "aka": ["Databricks ontology", "OntoRank"], "category": "Databricks", "technical": "A Databricks context layer in public preview that combines Unity Catalog semantics with snippets inferred from dashboards, SQL queries and Genie Agents, each ranked by an authority score based on source, usage and freshness.", "sales": "The Databricks feature closest to context that grows with use. It learns from analytics activity like dashboards and queries rather than from planning events like approvals and overrides.", "related": ["Ontology", "Genie", "Context engineering", "Cumulative context"], "src": "https://docs.databricks.com/aws/en/genie/genie-ontology"}, {"term": "Hybrid Tables", "aka": ["Unistore", "Snowflake Hybrid Tables"], "category": "Snowflake", "technical": "Snowflake tables, part of Unistore, that add a row store with row-level locking and enforced primary, foreign and unique keys for transactional workloads next to analytics. Snowflake declared them GA in November 2024, though one third party still calls them preview.", "sales": "Snowflake's way of handling many small, fast updates, which planning input requires. A secondary source reports they lack time travel, which would push plan history into custom tables.", "related": ["OLTP vs OLAP", "Write-back", "Snowflake Postgres"], "src": "https://www.snowflake.com/en/blog/unistore-general-availability/"}, {"term": "Intercompany eliminations", "aka": ["eliminations", "intercompany matching", "IC eliminations"], "category": "Planning and FP&A", "technical": "Consolidation entries that remove balances and transactions between entities in the same group, such as intercompany sales, receivables and payables, so group results reflect only external activity, usually after intercompany matching.", "sales": "Removing sales and balances between a company's own subsidiaries so revenue is not counted twice. It is a core reason finance teams buy a CPM product rather than build one.", "related": ["Financial consolidation", "Currency translation"], "src": ""}, {"term": "Joule", "aka": ["SAP Joule", "Joule Agents", "Joule Studio", "Financial Planning Assistant"], "category": "SAP", "technical": "SAP's AI assistant and agent front end that orchestrates workflows, data and more than 200 specialized agents through over 50 domain assistants. The Financial Planning Assistant and Joule Agents in SAP Enterprise Planning were scheduled for GA in Q3 2026, delivery was not verified, and Joule Studio MCP and A2A support is described as future.", "sales": "SAP's AI copilot across its applications. Its planning agents were due in Q3 2026, while Vena's Planning Agent has been GA since May 2026.", "related": ["SAP Analytics Cloud planning", "SAP Knowledge Graph", "Agent2Agent protocol (A2A)"], "src": "https://news.sap.com/2026/05/sap-sapphire-sap-unveils-autonomous-enterprise/"}, {"term": "Knowledge Catalog", "aka": ["Dataplex", "Dataplex Universal Catalog"], "category": "Google", "technical": "Google Cloud's metadata and governance catalog, renamed from Dataplex Universal Catalog on April 10, 2026, which brings BigQuery measures and LookML together. Automated context curation of descriptions, glossaries and verified SQL is in preview.", "sales": "Google's catalog of what data means and who owns it, previously called Dataplex. One analyst firm calls it more of a metadata aggregator than a true business context layer.", "related": ["Data catalog", "Business glossary", "BigQuery", "LookML"], "src": "https://docs.cloud.google.com/dataplex/docs/catalog-overview"}, {"term": "Knowledge store", "aka": ["Genie knowledge store", "Genie instructions"], "category": "Databricks", "technical": "The author-curated set of semantic definitions attached to a Genie Agent, including table descriptions, joins, SQL expressions, example SQL and instructions. Feedback generates suggestions, but Databricks states agent behavior does not change from user feedback alone.", "sales": "The hand-maintained notes that teach a Genie assistant how the data works. Someone on the data team has to keep them current.", "related": ["Genie", "Verified queries", "Context engineering"], "src": "https://docs.databricks.com/aws/en/genie-agents/tune-quality"}, {"term": "Lakebase", "aka": ["Databricks Lakebase", "serverless Postgres"], "category": "Databricks", "technical": "Databricks' managed serverless PostgreSQL service for transactional workloads, with autoscaling, zero-copy branching, point-in-time recovery and sync to Delta tables. GA on AWS in February 2026, with Azure in beta at that time.", "sales": "A transactional database inside Databricks that custom apps can save data to. Its branching copies a database, which is not the same as managing budget and forecast versions.", "related": ["Databricks Apps", "OLTP vs OLAP", "Versions", "Snowflake Postgres"], "src": "https://databricks.com/blog/databricks-lakebase-generally-available"}, {"term": "Lakeflow", "aka": ["Lakeflow Connect", "Lakeflow Jobs", "Lakeflow Designer"], "category": "Databricks", "technical": "Databricks' data engineering suite, including Lakeflow Connect managed connectors (for example NetSuite, Workday and Dynamics 365), Lakeflow Designer for no-code pipelines and Lakeflow Jobs for orchestration.", "sales": "Databricks' tools for bringing in and moving data. Lakeflow Jobs schedules data pipelines and is not a budget approval workflow.", "related": ["ETL and ELT", "Openflow", "Workflow and approvals"], "src": "https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/saas-overview"}, {"term": "Looker", "aka": ["Google Looker", "Conversational Analytics in Looker"], "category": "Google", "technical": "Google's BI platform built on the LookML semantic model, with Conversational Analytics in Looker (GA) and newer agentic features such as dashboard agents and a managed Looker MCP server in preview.", "sales": "Google's reporting tool, known for consistent metric definitions. Its only documented write-back to BigQuery is a reference pattern that only appends rows, which is far from planning input.", "related": ["LookML", "BigQuery", "Conversational Analytics API"], "src": "https://docs.cloud.google.com/looker/docs/conversational-analytics-overview"}, {"term": "LookML", "aka": ["Looker modeling language"], "category": "Google", "technical": "Looker's code-based modeling language that defines dimensions, measures, joins and Explores over SQL databases, maintained by developers with Git version control and continuous integration.", "sales": "The language Looker uses to define business metrics, maintained by developers in code. It is a strong reporting semantic layer, but it has no concept of plan input, versions or scenarios.", "related": ["Looker", "Semantic layer", "Metrics layer"], "src": "https://cloud.google.com/blog/products/business-intelligence/how-lookers-semantic-layer-enhances-gen-ai-trustworthiness"}, {"term": "MCP Toolbox for Databases", "aka": ["MCP Toolbox", "Google MCP Toolbox"], "category": "Google", "technical": "Google's open-source MCP server framework, version 1.0 GA, that exposes database and analytics tools, including BigQuery conversational analytics and TimesFM forecasting, to MCP clients and ADK agents as a self-managed alternative to Google's managed MCP servers.", "sales": "A free Google toolkit that lets AI assistants query company databases. It speeds up building agents but does not add planning features.", "related": ["MCP server", "Agent Development Kit (ADK)", "BigQuery"], "src": "https://cloud.google.com/blog/products/data-analytics/new-data-agents-across-the-agentic-data-cloud"}, {"term": "Metric views", "aka": ["UC metric views", "Unity Catalog Metrics", "UC Metrics"], "category": "Databricks", "technical": "Unity Catalog objects, defined in YAML, SQL or a low-code editor, that separate measures from dimensions so metrics are defined once and queried by any grouping, with star and snowflake joins, window measures and materialization. GA per Databricks, though one third-party recap lists them as preview.", "sales": "Databricks' semantic layer for KPIs, feeding dashboards, Genie and outside BI tools. Data engineers usually maintain them, not finance.", "related": ["Semantic layer", "Metrics layer", "Unity Catalog", "Genie"], "src": "https://docs.databricks.com/aws/en/metric-views"}, {"term": "Microsoft Copilot", "aka": ["Copilot", "Microsoft 365 Copilot", "Copilot in Fabric", "Copilot in Power BI"], "category": "Microsoft", "technical": "Microsoft's family of AI assistants, including Microsoft 365 Copilot and Copilot in Fabric and Power BI, which consumes Fabric capacity units. Copilot in Fabric processes data in the US and EU data boundaries, so Canadian data is processed cross-geo.", "sales": "Microsoft's AI assistant across Office, Teams and Power BI. Vena works inside it, since the Vena MCP server supports Microsoft Copilot as a client and Vena Copilot runs in Teams.", "related": ["Copilot Studio", "Vena MCP server", "Vena Copilot"], "src": "https://learn.microsoft.com/en-us/fabric/fundamentals/copilot-fabric-overview"}, {"term": "Microsoft Purview", "aka": ["Purview", "Purview DLP", "eDiscovery"], "category": "Microsoft", "technical": "Microsoft's data governance, security and compliance suite, providing data loss prevention, access restriction policies, audit and eDiscovery that apply to Fabric data agents and Copilot interactions.", "sales": "Microsoft's compliance toolset that protects and logs AI conversations about company data. It is a genuine governance strength for Microsoft and a standard expectation for any AI tool in finance.", "related": ["Fabric data agents", "Guardrails", "Audit trail"], "src": "https://learn.microsoft.com/en-us/fabric/data-science/concept-data-agent"}, {"term": "MLflow", "aka": ["MLflow 3", "Agent Evaluation"], "category": "Databricks", "technical": "An open-source platform, deeply integrated in Databricks, for tracking, evaluating and monitoring machine learning and generative AI applications. MLflow 3 attaches scorers such as LLM judges and code checks to traces before release and on production traffic.", "sales": "The quality-control system Databricks teams use to test AI before and after launch. Using it well is part of the ongoing engineering cost of building your own agents.", "related": ["Evaluations and benchmarks", "Agent Bricks"], "src": "https://docs.databricks.com/aws/en/mlflow3/genai/eval-monitor"}, {"term": "Morpheo", "aka": ["Morpheo AI", "Morpheo Omega"], "category": "Vena", "technical": "Morpheo AI Inc., a Toronto agentic data platform company acquired by Vena (announced July 28, closed August 18, 2026). Its Morpheo Omega data-product technology and connectors became the foundation of Vena Omega, GA November 17, 2026.", "sales": "The AI data company Vena bought to build Omega. It brings the connectors that pull in data from anywhere in the business and the technology that turns it into context.", "related": ["Vena Omega", "SOC 2"], "src": "https://www.venasolutions.com/newsroom/vena-completes-acquisition-of-morpheo-ai"}, {"term": "Mosaic AI", "aka": ["Mosaic AI Agent Framework", "Databricks Mosaic AI"], "category": "Databricks", "technical": "Databricks' brand for its generative AI tooling, whose Mosaic AI Agent Framework is now marketed under the Agent Bricks umbrella as Custom Agents on Apps.", "sales": "An older Databricks name reps will still see in decks and documents. Treat it as part of Agent Bricks.", "related": ["Agent Bricks", "MLflow"], "src": "https://www.databricks.com/blog/agent-bricks-governed-enterprise-agent-platform"}, {"term": "OneLake", "aka": ["Fabric OneLake", "shortcuts", "mirroring"], "category": "Microsoft", "technical": "The single, tenant-wide data lake under Microsoft Fabric, storing data in open Delta format and exposing outside data in place through shortcuts or as managed replicas through mirroring.", "sales": "Microsoft Fabric's one data lake for the whole company. Fabric Planning reads from it, and Vena's six Microsoft Fabric data integrations connect to the same Microsoft data estate.", "related": ["Direct Lake", "Zero-copy", "Fabric IQ", "Delta Lake"], "src": "https://azure.microsoft.com/en-us/blog/fabcon-and-sqlcon-2026-unifying-databases-and-fabric-on-a-single-data-platform/"}, {"term": "Ontology actions", "aka": ["action types", "Palantir actions"], "category": "Palantir", "technical": "Palantir action types define a single transaction that changes one or more Ontology objects using user-defined logic, with rules, submission criteria, per-action permissions, side effects to external systems and action logs with full audit history.", "sales": "Palantir's governed way to change data, with permissions and a full audit log. It is a generic building block, so budget submission and approval would need to be designed on top.", "related": ["Palantir Ontology", "Audit trail", "Workflow and approvals"], "src": "https://www.palantir.com/docs/foundry/action-types/overview"}, {"term": "Open Semantic Interchange (OSI)", "aka": ["OSI", "Apache Ossie"], "category": "Snowflake", "technical": "A vendor-neutral, Apache 2.0 specification for exchanging semantic definitions (data sets, metrics, dimensions, relationships and contexts) across tools. Snowflake published the first version January 27, 2026, recaps describe it as finalized at Summit 2026 with 54 vendors, and a secondary source reports it entered the Apache Incubator as Apache Ossie.", "sales": "An industry standard so metric definitions can move between tools instead of being rebuilt in each one. Databricks, dbt Labs and Salesforce are members, but no planning vendor appears on the published member list.", "related": ["Semantic layer", "Metrics layer", "Semantic views"], "src": "https://www.snowflake.com/en/blog/open-semantic-interchanges-specs-finalized/"}, {"term": "Openflow", "aka": ["Snowflake Openflow"], "category": "Snowflake", "technical": "Snowflake's managed data ingestion service based on Apache NiFi for batch and streaming pipelines, GA since May 2025, with second-generation deployments and runtimes GA September 8, 2026 and gen-2 connectors such as PostgreSQL and MySQL CDC still in public preview.", "sales": "Snowflake's tool for bringing data in from other systems. It moves actuals into Snowflake, which is the first step of any build on Snowflake.", "related": ["ETL and ELT", "Change data capture (CDC)", "Lakeflow"], "src": "https://docs.snowflake.com/en/release-notes/2026/other/2026-09-08-openflow-gen2-deployment-runtime-ga"}, {"term": "OpenSharing", "aka": ["Delta Sharing"], "category": "Databricks", "technical": "Databricks' open protocol for live, cross-platform table sharing without copying, renamed from Delta Sharing in June 2026 and hosted by the Linux Foundation.", "sales": "The way Databricks lets other tools read its tables directly. Planning vendors such as Pigment use it only to import data, with no write-back.", "related": ["Data sharing", "Zero-copy", "Delta Lake"], "src": "https://www.databricks.com/company/newsroom/press-releases/databricks-announces-opensharing"}, {"term": "Operational Tables", "aka": ["Vena Operational Tables"], "category": "Vena", "technical": "A Vena feature in open beta from the Spring 2026 release for creating, managing and using relational data directly within Excel, with the option to push that data into Power BI Desktop.", "sales": "A way to keep operational detail, such as headcount records or project lists, alongside financial plans in Vena. It is in open beta, so confirm availability before promising it.", "related": ["CubeFLEX", "Vena MCP server"], "src": "https://www.venasolutions.com/product-release/fy27/spring/partner"}, {"term": "Palantir AIP", "aka": ["AIP", "Artificial Intelligence Platform", "Chatbot Studio", "AIP Agent Studio"], "category": "Palantir", "technical": "Palantir's AI platform on Foundry, including AIP Logic, Chatbot Studio (formerly AIP Agent Studio), Threads, Assist, Evals and pro-code agents built with the Claude, OpenAI or Google agent SDKs and bound to the Ontology.", "sales": "Palantir's AI layer for building assistants and AI workflows on the Ontology. It is powerful, and any finance agents would be custom-built.", "related": ["AIP Logic", "Palantir Ontology", "AI agent"], "src": "https://www.palantir.com/docs/foundry/aip/overview"}, {"term": "Palantir Foundry", "aka": ["Foundry", "Workshop"], "category": "Palantir", "technical": "Palantir's data integration and application platform centered on the Ontology, with pipelines, Workshop applications and AIP for AI workflows, sold under enterprise contracts with AIP usage priced in compute-seconds.", "sales": "Palantir's platform for building bespoke operational and decision apps on company data. It can power a custom planning app, but the planning model, calculations, approvals and Excel experience would all be built.", "related": ["Palantir Ontology", "Palantir AIP", "Forward deployed engineering (FDE)"], "src": "https://www.palantir.com/docs/foundry/aip/overview"}, {"term": "Palantir Ontology", "aka": ["Ontology (Palantir)", "Ontology MCP"], "category": "Palantir", "technical": "Foundry's semantic and operational layer of object types, properties, links, actions and functions that serves as both the business model and the governed write-back layer, exposed to outside agents through Ontology MCP with controlled writes.", "sales": "Palantir's model of the business, which also controls how data gets changed. Architecturally it is the closest match to context plus actions, but every finance concept must be modeled by the customer.", "related": ["Ontology actions", "Ontology", "Model Context Protocol (MCP)"], "src": "https://www.palantir.com/docs/foundry/ontology-mcp/overview"}, {"term": "Period locking", "aka": ["data locking", "version locking", "close lock"], "category": "Planning and FP&A", "technical": "Controls that freeze data for closed periods, submitted entities or approved versions so values cannot change without an authorized unlock, sometimes delegated to data owners. SAP Analytics Cloud calls this data locking.", "sales": "Freezing last month or an approved budget so nobody changes it after the fact. It protects the numbers that went to the board.", "related": ["Versions", "Workflow and approvals", "Audit trail"], "src": ""}, {"term": "Planning in Fabric", "aka": ["Fabric Planning", "Lumel", "Inforiver", "PowerTable"], "category": "Microsoft", "technical": "Microsoft's first-party EPM and CPM workload in Fabric IQ, built by Lumel, for budgets, forecasts, scenarios and variance analysis, writing back to Fabric SQL databases. GA by mid-2026 with billing on Fabric capacity from August 1, 2026, and documented limits include one semantic model per plan item and 1.2 million cells per write-back.", "sales": "Microsoft's own budgeting and forecasting tool inside Fabric, and the most direct competitor in Microsoft-centric accounts. Probe consolidation, native Excel use and what its AI does today, since Microsoft lists agentic planning as roadmap.", "related": ["Fabric IQ", "Acterys", "Fabric capacity units", "CPM and EPM"], "src": "https://learn.microsoft.com/en-us/fabric/iq/plan/overview"}, {"term": "Power BI semantic model", "aka": ["semantic model", "Power BI dataset", "Prep data for AI"], "category": "Microsoft", "technical": "The governed tabular model in Power BI and Fabric, formerly called a dataset, holding tables, relationships, DAX measures, hierarchies and row-level security, now enriched with AI instructions and verified answers for Copilot (preview).", "sales": "The model most Power BI finance reports already run on. Microsoft now reuses it as AI context and as the base for Fabric Planning, which is a strong advantage in Power BI shops.", "related": ["Semantic layer", "Fabric IQ", "Planning in Fabric", "Direct Lake"], "src": "https://learn.microsoft.com/en-us/power-bi/create-reports/copilot-prepare-data-ai"}, {"term": "Rolling forecast", "aka": ["continuous forecast", "12-month rolling forecast"], "category": "Planning and FP&A", "technical": "A forecast updated on a regular cadence that always extends a fixed number of periods ahead, such as 12 or 18 months, adding a new period as each one closes instead of stopping at fiscal year end.", "sales": "A forecast that always looks a year or more ahead instead of ending in December. It means refreshing data and revisiting assumptions more often, which raises the value of automation and of remembering past assumptions.", "related": ["Driver-based planning", "Versions", "Variance analysis"], "src": ""}, {"term": "SageMaker Unified Studio", "aka": ["Amazon SageMaker Unified Studio", "SageMaker Catalog", "SageMaker Lakehouse"], "category": "AWS", "technical": "AWS's unified data and AI workspace, GA March 13, 2025, that brings together EMR, Glue, Athena and Redshift tools with lakehouse data access and governance through SageMaker Catalog, which can enforce business glossary terms.", "sales": "Amazon's one-stop workspace for data and AI teams. It governs and prepares data well, but it is a toolset for engineers, not an application for planners.", "related": ["Data catalog", "Business glossary", "Amazon Redshift"], "src": "https://aws.amazon.com/about-aws/whats-new/2025/03/amazon-sagemaker-unified-studio-generally-available/"}, {"term": "SAP Analytics Cloud planning", "aka": ["SAC", "SAC planning", "SAP Analytics Cloud"], "category": "SAP", "technical": "The planning capabilities of SAP Analytics Cloud, including cell-level data entry with rolldown, private and published versions, data locking, data actions, structured allocations, validation rules, value driver trees and an Excel add-in with write-back.", "sales": "SAP's real planning tool and the most direct full-stack competitor in SAP ERP accounts. Ask what is shipped versus scheduled for its AI agents, and how it handles entities that run on other ERPs.", "related": ["Joule", "SAP Business Data Cloud", "Allocations", "Period locking"], "src": "https://learning.sap.com/courses/exploring-sap-analytics-cloud/describing-planning-features_c4054dc5-c8af-4c7b-8f74-54d03b0bc413"}, {"term": "SAP Business Data Cloud", "aka": ["BDC", "SAP BDC", "BDC Connect", "SAP Business AI Platform"], "category": "SAP", "technical": "SAP's business data fabric combining Datasphere, SAP Analytics Cloud, HANA Cloud, BW and SAP Databricks with curated SAP data products, sold in Capacity Units and required to be bought with at least one Intelligent Application. BDC Connect shares data zero-copy with Databricks, Snowflake, BigQuery and Fabric.", "sales": "SAP's data platform for SAP and partner data, bundled with its analytics and planning tools. It is strongest where the business runs on SAP and it carries commercial lock-in signals.", "related": ["SAP Datasphere", "SAP Analytics Cloud planning", "SAP Knowledge Graph", "Zero-copy"], "src": "https://news.sap.com/2026/05/sap-bdc-accelerate-autonomous-enterprise/"}, {"term": "SAP Datasphere", "aka": ["Datasphere", "seamless planning"], "category": "SAP", "technical": "SAP's data warehousing and modeling service inside Business Data Cloud that federates SAP and non-SAP data. With seamless planning, SAP Analytics Cloud planning models store their data in Datasphere spaces.", "sales": "SAP's data warehouse layer under its planning and analytics tools. Seamless planning requires SAC on HANA Cloud, one-to-one SAC and Datasphere tenants and the same data center.", "related": ["SAP Business Data Cloud", "SAP Analytics Cloud planning"], "src": "https://www.sap.com/events/sapphire/innovation-guide/data-cloud.html"}, {"term": "SAP Knowledge Graph", "aka": ["Knowledge Graph (SAP)"], "category": "SAP", "technical": "A structured map of business entities, processes and relationships that SAP announced at Sapphire in May 2026 as the foundation of the SAP Business AI Platform, building on the knowledge graph component SAP added to Datasphere in 2025.", "sales": "SAP's map of how its business objects connect, used to give Joule agents context. It is strongest on SAP master data and processes.", "related": ["Knowledge graph", "Joule", "SAP Business Data Cloud"], "src": "https://news.sap.com/2026/05/sap-sapphire-sap-unveils-autonomous-enterprise/"}, {"term": "Scenarios", "aka": ["what-if", "scenario planning", "scenario modeling"], "category": "Planning and FP&A", "technical": "Alternative sets of assumptions and their calculated outcomes, such as base, upside and downside, stored and compared alongside versions. A persisted scenario differs from a one-off what-if question answered by an AI agent.", "sales": "Modeling what happens if growth slows or a price increase lands, and keeping those cases to compare. Many data platform agents can answer a what-if question, but they do not save the scenario into a governed plan.", "related": ["Versions", "Driver-based planning", "Vena Planning, Query and Reporting agents"], "src": ""}, {"term": "Semantic View Autopilot", "aka": ["SVA", "Autopilot"], "category": "Snowflake", "technical": "A Snowflake feature, GA February 3, 2026, that generates and updates semantic views from query history, BI dashboards such as Tableau and Power BI, and trusted SQL, proposing changes that data teams review and certify. One third-party recap lists it as preview, possibly reflecting newer sub-features.", "sales": "Snowflake software that learns business definitions by watching how people already query data. It is a real, shipping example of context that improves with use, though it learns from analytics rather than from planning cycles.", "related": ["Semantic views", "Context engineering", "Verified queries", "Cortex Sense"], "src": "https://www.snowflake.com/en/blog/semantic-view-autopilot/"}, {"term": "Semantic views", "aka": ["Snowflake semantic views", "semantic model (Snowflake)"], "category": "Snowflake", "technical": "Schema-level Snowflake database objects that define tables, relationships, facts, dimensions and metrics for BI tools and Cortex Analyst, replacing YAML semantic models. GA for querying since August 26, 2025.", "sales": "Snowflake's semantic layer, where business definitions of metrics live. They describe reporting data and do not include plan versions, input or approval logic.", "related": ["Semantic layer", "Semantic View Autopilot", "Cortex Analyst", "Open Semantic Interchange (OSI)"], "src": "https://docs.snowflake.com/en/release-notes/2025/9_25"}, {"term": "Snowflake CoWork", "aka": ["CoWork", "Snowflake Intelligence"], "category": "Snowflake", "technical": "Snowflake's packaged agent application for business users, with charts, artifacts, automations, skills, Deep Research and per-user memory, inheriting row-access and column-level policies. Renamed from Snowflake Intelligence at Summit 2026 in June, and the preview status of features such as User Memory is reported inconsistently.", "sales": "Snowflake's ready-made AI assistant for business users, previously called Snowflake Intelligence. Its memory is personal to each user, not shared memory of the finance team's planning decisions.", "related": ["Cortex Agents", "Agent memory", "Cortex Sense"], "src": "https://docs.snowflake.com/en/user-guide/snowflake-cortex/snowflake-cowork"}, {"term": "Snowflake Horizon", "aka": ["Horizon", "Horizon Catalog", "Horizon Context"], "category": "Snowflake", "technical": "Snowflake's built-in governance and discovery capabilities, covering access policies, classification, lineage and AI guardrails. Horizon Context, announced at Summit 2026 and reported in private preview, collects and enriches metadata from outside sources through five connectors.", "sales": "The governance layer inside Snowflake that controls who sees what and documents data. It helps prove data is trusted, but it is not a planning or approval workflow.", "related": ["Data catalog", "Cortex Sense", "Row-level security"], "src": ""}, {"term": "Snowflake Native Apps", "aka": ["Native App Framework", "Native Apps"], "category": "Snowflake", "technical": "Applications packaged with the Snowflake Native App Framework that install and run inside a customer's Snowflake account. Support for Cortex Agents and Snowflake-managed MCP servers inside Native Apps went GA August 7, 2026.", "sales": "A way for software vendors to ship an app that runs inside the customer's own Snowflake account. It is the route any third party, including a CPM vendor, could use to deliver an AI planning agent in Snowflake.", "related": ["Cortex Agents", "MCP server", "Streamlit in Snowflake"], "src": "https://docs.snowflake.com/en/release-notes/2026/other/2026-08-07-native-apps-agents-mcp-ga"}, {"term": "Snowflake Postgres", "aka": ["Postgres in Snowflake"], "category": "Snowflake", "technical": "Managed PostgreSQL instances that run inside Snowflake, GA February 24, 2026 in selected AWS and Azure regions, suited to transactional application state and write-back.", "sales": "A standard transactional database now available inside Snowflake. It gives builders a place to save plan inputs, but versions, workflow and calculations still have to be built around it.", "related": ["Hybrid Tables", "OLTP vs OLAP", "Lakebase"], "src": "https://docs.snowflake.com/en/release-notes/2026/other/2026-02-24-snowflake-postgres-ga"}, {"term": "Snowplan", "aka": ["Snowplan v2"], "category": "Snowflake", "technical": "Snowflake's internal long-range planning application for 40+ entities, built by its finance team on Snowflake, Streamlit and the CoCo coding agent, with write-back, versioned scenarios, role-based review and row-level controls. Described in a July 8, 2026 blog that discloses no team size or cost.", "sales": "Proof that a data platform company had to build its own planning app, with its own engineers, on its own platform. It shows planning on Snowflake is possible, and also that it is a custom software project.", "related": ["Streamlit in Snowflake", "Forward deployed engineering (FDE)", "Write-back"], "src": "https://www.snowflake.com/en/blog/fpa-ai-modernization-snowplan-v2/"}, {"term": "Spreading and breakback", "aka": ["spreading", "breakback", "top-down allocation", "rolldown"], "category": "Planning and FP&A", "technical": "Spreading pushes a value entered at a summary level down to lower-level members or periods by a method such as even, seasonal or prior-year pattern, while breakback adjusts the detail proportionally when a parent total is changed.", "sales": "Entering an annual number and having it fall into months, or changing a total and having the detail adjust automatically. Finance users expect this in any planning grid, and it is a significant build item on a data platform.", "related": ["Allocations", "Driver-based planning", "Write-back"], "src": ""}, {"term": "Streamlit in Snowflake", "aka": ["Streamlit", "SiS"], "category": "Snowflake", "technical": "Snowflake's hosted Streamlit environment for building Python data apps with interactive inputs that run against Snowflake data. Cortex Agents APIs require its container runtime rather than the warehouse runtime.", "sales": "A quick way for developers to build simple web apps on Snowflake. Snowflake's own finance team used it as the input screen for its internal planning app, Snowplan.", "related": ["Snowplan", "Hybrid Tables", "Databricks Apps"], "src": "https://www.snowflake.com/en/blog/fpa-ai-modernization-snowplan-v2/"}, {"term": "Translytical task flows", "aka": ["Power BI write-back", "translytical"], "category": "Microsoft", "technical": "A GA Power BI capability that lets report users add, edit or delete data and call external APIs from a report, executed by Fabric user data functions against Fabric SQL databases, warehouses or lakehouse files.", "sales": "Buttons in a Power BI report that save changes back to the database. It is a general-purpose write-back building block, not a planning process with versions and approvals.", "related": ["User data functions", "Write-back", "Acterys"], "src": "https://learn.microsoft.com/en-us/power-bi/create-reports/translytical-task-flow-overview"}, {"term": "Unity Catalog", "aka": ["UC", "Databricks Unity Catalog"], "category": "Databricks", "technical": "Databricks' unified governance layer for data and AI assets, providing access control including ABAC, lineage, auditing, metric views and business semantics. At Data + AI Summit 2026 its Glossary was listed as preview coming soon and Domains as public preview.", "sales": "Databricks' central catalog and permission system. It governs who can read data and what it means, while plan input, approval and versioning sit outside its scope.", "related": ["Metric views", "ABAC", "Data catalog", "Genie Ontology"], "src": "https://www.databricks.com/blog/whats-new-unity-catalog-data-ai-summit-2026"}, {"term": "User data functions", "aka": ["UDF", "Fabric user data functions"], "category": "Microsoft", "technical": "Serverless Python functions in Fabric that read and write Fabric SQL databases, warehouses and lakehouse files and can be called from reports, pipelines, notebooks, Activator rules or REST.", "sales": "Small pieces of custom code that handle saving and logic behind Fabric apps. They are how a builder would let an AI agent write to Fabric, which is custom work.", "related": ["Translytical task flows", "Copilot Studio", "Write-back"], "src": "https://learn.microsoft.com/en-us/fabric/data-engineering/user-data-functions/user-data-functions-overview"}, {"term": "Variance analysis", "aka": ["budget vs actual", "BvA", "plan vs actual"], "category": "Planning and FP&A", "technical": "Comparing actuals with budget, forecast or prior periods across dimensions, quantifying the differences and attributing them to drivers such as price, volume or mix, usually with written commentary.", "sales": "Explaining why results differ from plan, the core monthly conversation in FP&A. AI can draft the analysis, but the commentary and decisions are exactly the history a cumulative context engine aims to keep.", "related": ["Versions", "Rolling forecast", "Cumulative context"], "src": ""}, {"term": "Vena Copilot", "aka": ["Vena AI", "Vena Copilot for Teams"], "category": "Vena", "technical": "Vena's AI assistant built on Microsoft Azure OpenAI and the CubeFLEX model, introduced in beta April 3, 2024, which inherits Vena data, application and individual permissions and hosts Vena's named agents. Vena Copilot for Microsoft Teams has been GA since May 15, 2025.", "sales": "Vena's built-in AI assistant for finance users, available inside Vena and Microsoft Teams. It respects existing permissions, and Vena states customer data is never used to train public AI models.", "related": ["Vena Planning, Query and Reporting agents", "CubeFLEX", "Microsoft Copilot"], "src": "https://www.venasolutions.com/vena-ai"}, {"term": "Vena MCP server", "aka": ["Vena MCP", "Vena Model Context Protocol server"], "category": "Vena", "technical": "Vena's MCP server, GA May 13, 2026, connects Claude, ChatGPT and Microsoft Copilot to live Vena data under each user's existing data and application permissions. Developer docs list read tools only, while release materials announce plan updates and write-back.", "sales": "Lets a customer's preferred AI assistant work with live Vena data. Say read access is documented and write-back is announced until the developer docs change.", "related": ["Model Context Protocol (MCP)", "MCP server", "Microsoft Copilot"], "src": "https://developers.venasolutions.com/docs/mcp-overview"}, {"term": "Vena Omega", "aka": ["Omega", "cumulative context engine"], "category": "Vena", "technical": "Vena's cumulative context engine for finance, GA November 17, 2026. It combines governed data from across the business with definitions, assumptions, drivers, approvals and past decisions in user, industry, business and planning layers, and serves that context to Vena agents, Excel, PowerPoint, Power BI and MCP clients. Built on technology from the Morpheo acquisition.", "sales": "The brain under all of Vena's tools. It learns how your finance team plans and decides, keeps that knowledge, and makes every answer and forecast better the more you use it.", "related": ["Cumulative context", "Morpheo", "Vena Copilot", "Context layer"], "src": "https://www.venasolutions.com/newsroom/vena-to-acquire-morpheo-ai"}, {"term": "Vena Planning, Query and Reporting agents", "aka": ["Planning Agent", "Query Agent", "Reporting Agent", "Analytics Agent", "Scenario Agent"], "category": "Vena", "technical": "Named Vena Copilot agents, with the Planning Agent (GA May 13, 2026) generating forecasts, updating plans and applying scenario logic in natural language, the Query Agent (GA, Spring 2026) turning plain English into MQL, and the Reporting Agent (GA) working in the Ad Hoc tool. A Scenario Agent is listed as coming soon.", "sales": "Vena's shipped AI agents that answer questions and, in the Planning Agent's case, update plans inside governed workflows. That is a key contrast with data platform agents, which are read-only.", "related": ["Vena Copilot", "Text-to-SQL", "Scenarios", "AI agent"], "src": "https://www.venasolutions.com/product-release/fy27/spring/partner"}, {"term": "Versions", "aka": ["plan versions", "version dimension", "Budget v1", "Forecast 3+9"], "category": "Planning and FP&A", "technical": "Distinct, persistent copies of plan data such as Budget, Forecast 3+9 or Actuals, held in a version dimension with lifecycle states like open, locked and archived so they can be compared and promoted.", "sales": "Keeping Budget, each forecast and actuals side by side without overwriting each other. Database branching, such as Lakebase's, is not the same thing, because finance versions need business rules, locking and comparison.", "related": ["Scenarios", "Period locking", "Variance analysis", "Lakebase"], "src": ""}, {"term": "Workflow and approvals", "aka": ["planning workflow", "budget calendar", "submission and approval"], "category": "Planning and FP&A", "technical": "Process orchestration for planning cycles, including a budget calendar, task assignment, submission, review, rejection and approval routing, notifications and status tracking for each contributor.", "sales": "Making sure every department submits on time and the right people sign off. Snowflake's Multi-Party Approval and Databricks' Lakeflow Jobs sound similar but are admin and data controls, not budget workflows.", "related": ["Period locking", "Audit trail", "Agentic workflow"], "src": ""}, {"term": "Write-back", "aka": ["writeback", "data entry", "plan input"], "category": "Planning and FP&A", "technical": "Saving user- or system-entered values, such as budget inputs or forecast changes, back into the model's storage so they are immediately available to calculations, reports and other users.", "sales": "Typing a number into the plan and having it saved where everyone can use it. On data platforms this usually means custom development, for example Databricks' Excel add-in only overwrites whole tables, while Vena writes back natively from Excel.", "related": ["Versions", "Cell-level security", "Translytical task flows", "Hybrid Tables"], "src": ""}]</script>
<script type="application/json" id="glossary-general-json">[{"term": "ABAC", "aka": ["attribute-based access control", "tag-based policies"], "category": "Data management", "technical": "An access model that grants or denies access by evaluating attributes of the user, the data (such as governed tags) and the context against central policies, which scales better than granting permissions object by object. Databricks reports support for 10,000+ such policies per metastore.", "sales": "Rules like anyone in HR can see data tagged as payroll, instead of granting access table by table. It is strong for governing reads, but write permissions on plan intersections still have to be designed.", "related": ["RBAC", "Row-level security", "Column masking", "Unity Catalog"], "src": "https://www.databricks.com/blog/abac-row-filtering-and-column-masking-policies-governed-tags-and-data-classification-are-now"}, {"term": "Agent harness", "aka": ["harness", "agent framework", "agent runtime"], "category": "Agents and AI apps", "technical": "The software scaffolding around an LLM that runs the agent loop, including the system prompt, tool definitions, context management, memory, permissions and logging. Databricks describes its Omnigent project as an open-source meta-harness.", "sales": "The machinery that turns a raw AI model into a dependable worker. Building and maintaining a harness is real engineering work a buyer takes on when they build their own finance agents.", "related": ["AI agent", "Agent orchestration", "Guardrails"], "src": ""}, {"term": "Agent memory", "aka": ["short-term memory", "long-term memory", "episodic memory", "user memory"], "category": "Agents and AI apps", "technical": "Stored state an agent reuses, split into short-term memory (events from the current session or recent turns) and long-term memory (facts, preferences, summaries or episodes extracted and kept across sessions). AgentCore Memory, Memory Bank and Genie One memory are examples.", "sales": "Whether an AI remembers past conversations and what it learned. Most shipped memory today is per user, such as remembering preferences, rather than shared memory of how the finance team plans.", "related": ["Cumulative context", "AgentCore Memory", "Agent Runtime and Memory Bank", "Snowflake CoWork"], "src": ""}, {"term": "Agent orchestration", "aka": ["orchestration", "orchestrator"], "category": "Agents and AI apps", "technical": "Coordinating the sequence of model calls, tool invocations, sub-agents, state and error handling needed to finish a task, handled either by a framework or by a supervising agent.", "sales": "The traffic control that decides which AI step or tool runs next. Data platforms are strong here, but orchestrating AI steps is different from orchestrating a budget process with deadlines and sign-offs.", "related": ["Multi-agent system", "Agent Bricks", "Amazon Bedrock AgentCore", "Agent Development Kit (ADK)"], "src": ""}, {"term": "Agent2Agent protocol (A2A)", "aka": ["A2A", "Agent2Agent"], "category": "Agents and AI apps", "technical": "An open protocol, created by Google and donated to the Linux Foundation in June 2025, that lets agents discover each other, exchange tasks and collaborate across vendors. It complements MCP, which connects agents to tools.", "sales": "A standard way for one vendor's AI agent to hand work to another's. Google, SAP and others back it, though SAP describes Joule Studio support as future.", "related": ["Model Context Protocol (MCP)", "Multi-agent system", "Agent Development Kit (ADK)"], "src": ""}, {"term": "Agentic workflow", "aka": ["agentic process", "AI-driven workflow"], "category": "Agents and AI apps", "technical": "A business process in which one or more agents carry out multi-step work, such as data preparation, analysis or plan updates, with defined tools, checkpoints and human approvals.", "sales": "A process where AI does much of the legwork and people review and approve. In planning it only works well if the workflow, approvals and audit trail already exist for the agent to operate inside.", "related": ["AI agent", "Workflow and approvals", "Guardrails"], "src": ""}, {"term": "AI agent", "aka": ["agent"], "category": "Agents and AI apps", "technical": "Software in which an LLM plans steps, calls tools such as queries, APIs or other agents, observes the results and iterates toward a goal, rather than producing a single response.", "sales": "An AI assistant that can carry out a multi-step task, such as pulling actuals, comparing them to budget and drafting commentary. In a planning deal, the key question is whether the agent can only read or can also update a plan inside governed workflow.", "related": ["Agentic workflow", "Tool calling", "Agent orchestration"], "src": ""}, {"term": "AI assistant", "aka": ["assistant", "chat assistant", "chatbot"], "category": "Agents and AI apps", "technical": "A conversational AI application that answers questions and completes tasks at a user's request, usually one turn at a time, with the user directing each step.", "sales": "An AI you chat with to get answers or drafts. Unlike an agent, it typically waits for you at each step rather than running a task end to end.", "related": ["AI copilot", "AI agent", "Large language model (LLM)"], "src": ""}, {"term": "AI bias", "aka": ["algorithmic bias", "model bias", "bias"], "category": "AI fundamentals", "technical": "Systematic errors in AI output that unfairly favor or disadvantage groups or outcomes, often inherited from skewed training data or design choices.", "sales": "When AI consistently leans one way because of the data it learned from. It matters most in people decisions such as compensation planning.", "related": ["Responsible AI", "Training", "AI governance"], "src": ""}, {"term": "AI copilot", "aka": ["copilot pattern", "embedded assistant"], "category": "Agents and AI apps", "technical": "An AI assistant embedded inside a specific application that helps users with in-context suggestions, drafting and actions while the human stays in control.", "sales": "An AI helper built into the tool you already use, such as a planning add-in. Its value depends on how much of the app's data and logic it can actually use.", "related": ["AI assistant", "AI agent", "Microsoft Copilot", "Human in the loop"], "src": ""}, {"term": "AI gateway", "aka": ["LLM gateway", "model gateway", "Unity Gateway"], "category": "Agents and AI apps", "technical": "A proxy layer in front of model and tool endpoints that centralizes routing, authentication, rate limits, spend caps, logging and policy enforcement across providers. Databricks renamed its AI Gateway to Unity Gateway, GA August 4, 2026.", "sales": "A central checkpoint for all AI traffic, used to control cost and keep a record of what was asked. It is infrastructure a build team has to set up and run.", "related": ["Guardrails", "Tokens and token pricing", "Unity Catalog"], "src": "https://docs.databricks.com/aws/en/release-notes/unity-gateway/"}, {"term": "AI governance", "aka": ["AI policy framework", "model governance"], "category": "AI fundamentals", "technical": "The policies, roles, controls and oversight that govern how AI systems are selected, approved, monitored and used, including risk assessment and regulatory compliance such as the EU AI Act.", "sales": "The rules for which AI can be used, on what data and with what checks. Finance leaders increasingly sit on the committee that sets them.", "related": ["Responsible AI", "Data governance", "Guardrails", "Human in the loop"], "src": ""}, {"term": "AI safety", "aka": ["AI alignment", "model safety"], "category": "AI fundamentals", "technical": "The field and practices focused on making AI systems behave as intended and avoid harmful outcomes, including alignment, robustness, misuse prevention and testing.", "sales": "Making sure AI does what it is supposed to and nothing harmful. For a finance buyer, it shows up as controls on what an AI agent can see and change.", "related": ["Responsible AI", "Guardrails", "Prompt injection", "Jailbreak"], "src": ""}, {"term": "Anomaly detection", "aka": ["outlier detection"], "category": "AI fundamentals", "technical": "Identifying data points or patterns that deviate significantly from expected behavior, using statistical rules or machine learning.", "sales": "Automatically spotting numbers that look wrong or unusual, like a duplicated accrual. It helps reviewers focus where it matters during close and forecast reviews.", "related": ["Unsupervised learning", "Data observability", "Variance analysis"], "src": ""}, {"term": "Apache Airflow", "aka": ["Airflow", "workflow orchestration"], "category": "Data management", "technical": "An open-source platform for authoring, scheduling and monitoring data workflows as code, with tasks and dependencies defined in Python.", "sales": "A scheduler that runs data jobs in the right order, such as loading actuals before refreshing reports. Someone has to write and maintain those workflows in code.", "related": ["Data pipeline", "Python", "Agent orchestration"], "src": ""}, {"term": "Apache Iceberg", "aka": ["Iceberg tables"], "category": "Data foundations", "technical": "An open table format governed by the Apache Software Foundation that adds transactions, schema evolution and snapshots to files in object storage, supported by BigQuery, Snowflake, AWS and other engines.", "sales": "An open format, similar to Delta Lake, that lets several platforms read the same tables without copying them. It matters because it reduces lock-in to any single data vendor.", "related": ["Delta Lake", "Lakehouse", "Parquet", "Zero-copy"], "src": ""}, {"term": "Apache Kafka", "aka": ["Kafka", "event streaming"], "category": "Data management", "technical": "An open-source distributed event streaming platform that publishes, stores and delivers high volumes of real-time data streams between systems.", "sales": "Infrastructure for moving live event data, such as orders or payments, between systems as it happens. Powerful, but it requires engineering skill to run.", "related": ["Batch vs streaming", "Data pipeline", "Change data capture (CDC)"], "src": ""}, {"term": "Apache Spark", "aka": ["Spark", "PySpark", "Spark SQL"], "category": "Data management", "technical": "An open-source distributed processing engine for large-scale data transformation, SQL analytics, streaming and machine learning across clusters of machines.", "sales": "The engine many data platforms use to crunch very large data sets. It is a developer tool, so using it for planning means writing and maintaining code.", "related": ["Query engine", "Lakehouse", "Python", "Data pipeline"], "src": ""}, {"term": "API", "aka": ["application programming interface", "web API"], "category": "Cloud and software", "technical": "A defined set of rules and endpoints that lets one software system request data or actions from another in a predictable way.", "sales": "The doorway that lets systems talk to each other without manual exports. A strong API means planning data can flow to and from other systems automatically.", "related": ["REST API", "Webhook", "SDK", "Data integration"], "src": ""}, {"term": "Artificial general intelligence (AGI)", "aka": ["AGI", "general AI"], "category": "AI fundamentals", "technical": "A hypothetical AI system that can match or exceed human ability across most cognitive tasks and transfer learning between domains. There is no agreed definition or test for it.", "sales": "The idea of AI as broadly capable as a person. It makes headlines, but it has no bearing on which planning tool to buy today.", "related": ["Artificial superintelligence (ASI)", "Narrow AI", "Artificial intelligence (AI)"], "src": ""}, {"term": "Artificial intelligence (AI)", "aka": ["AI"], "category": "AI fundamentals", "technical": "The field of building computer systems that perform tasks normally requiring human intelligence, such as understanding language, recognizing patterns, making predictions and making decisions.", "sales": "Software that can learn, reason or generate content rather than only follow fixed rules. In finance, it ranges from forecasting models to assistants that draft commentary.", "related": ["Machine learning (ML)", "Generative AI", "Narrow AI"], "src": ""}, {"term": "Artificial superintelligence (ASI)", "aka": ["ASI", "superintelligence"], "category": "AI fundamentals", "technical": "A hypothetical AI system that would far surpass the best human abilities in virtually every domain, including science, strategy and social skills.", "sales": "A speculative future beyond AGI. Useful context for news headlines, not for evaluating software.", "related": ["Artificial general intelligence (AGI)", "AI safety"], "src": ""}, {"term": "Autonomous agent", "aka": ["fully autonomous agent", "background agent"], "category": "Agents and AI apps", "technical": "An AI agent that pursues a goal over many steps with little or no human intervention, deciding its own actions, tools and when it is done.", "sales": "An agent that runs a whole task on its own, like monitoring spend and flagging overruns overnight. For financial data, most firms keep a human approval before anything is written.", "related": ["AI agent", "Human in the loop", "Guardrails", "Agentic workflow"], "src": ""}, {"term": "Batch vs streaming", "aka": ["batch processing", "stream processing", "real-time data"], "category": "Data management", "technical": "Batch processing handles data in scheduled chunks, such as a nightly load, while streaming processes each event continuously within seconds of it occurring.", "sales": "Nightly updates versus live updates. Most planning runs well on batch loads, and real-time streaming adds cost that only pays off for truly time-sensitive decisions.", "related": ["Data pipeline", "Apache Kafka", "Latency", "Change data capture (CDC)"], "src": ""}, {"term": "Build vs buy", "aka": ["make or buy", "build versus buy"], "category": "Cloud and software", "technical": "The decision between developing a capability in-house, often on a data or AI platform, and purchasing a packaged product, weighed on cost, time, fit, risk and ongoing ownership.", "sales": "Should we make it ourselves or buy something proven. For planning, the question is who owns versions, workflow, audit and upkeep once the first demo is done.", "related": ["Total cost of ownership (TCO)", "Technical debt", "Vibe coding", "Vendor lock-in"], "src": ""}, {"term": "Business glossary", "aka": ["glossary", "business terms", "data dictionary"], "category": "Data management", "technical": "A curated set of business terms with definitions, synonyms, owners and links to the data assets they describe, maintained in a catalog and used by AI to interpret questions. Databricks listed its Glossary as preview coming soon in June 2026, while SageMaker Catalog can require glossary terms before an asset is published.", "sales": "The agreed definitions of terms like ARR, opex or headcount, written down and owned. Most platforms now have one, but someone still has to write and maintain the entries.", "related": ["Data catalog", "Semantic layer", "Context layer"], "src": ""}, {"term": "Business intelligence (BI)", "aka": ["BI", "analytics", "reporting tools"], "category": "Data management", "technical": "Tools and practices for analyzing and visualizing historical data through reports, dashboards and ad hoc queries to support decisions.", "sales": "Software that shows what happened. BI is strong for reporting actuals, while planning tools add the forward-looking side with inputs, versions and approvals.", "related": ["Dashboard", "KPI", "Semantic layer", "CPM and EPM"], "src": ""}, {"term": "Chain of thought", "aka": ["CoT", "step-by-step reasoning"], "category": "AI fundamentals", "technical": "A technique, and a model behavior, in which the model writes out intermediate reasoning steps before its final answer, which tends to improve accuracy on multi-step problems.", "sales": "Having AI show its working. It improves answers and can make them easier to check, though the written steps are not a guaranteed record of how the model decided.", "related": ["Reasoning model", "Prompt engineering", "Explainability"], "src": ""}, {"term": "Change data capture (CDC)", "aka": ["CDC", "log-based replication"], "category": "Data management", "technical": "A technique that detects inserts, updates and deletes in a source database, often by reading its transaction log, and streams only those changes to a target system.", "sales": "A way to keep a copy of ERP or CRM data current without reloading everything each night. It shortens the lag between a posting in the GL and the number a planner sees.", "related": ["ETL and ELT", "Openflow", "Data sharing"], "src": ""}, {"term": "ChatGPT", "aka": ["OpenAI ChatGPT", "GPT", "GPT models"], "category": "AI fundamentals", "technical": "OpenAI's conversational AI assistant, launched in November 2022 and built on OpenAI's GPT and reasoning model families, offered in consumer, business and enterprise editions.", "sales": "The assistant that brought generative AI into the mainstream. Many finance staff already use it, which raises questions about what company data goes into it.", "related": ["Large language model (LLM)", "Claude", "Gemini", "Generative AI"], "src": ""}, {"term": "Chunking", "aka": ["document chunking", "text splitting"], "category": "Agents and AI apps", "technical": "Splitting documents into smaller passages before creating embeddings so retrieval can return the most relevant pieces within a model's context window.", "sales": "Cutting long documents into bite-sized pieces so AI can find the right paragraph. Poor chunking is a common reason document AI misses answers.", "related": ["Retrieval-augmented generation (RAG)", "Embeddings and vector database", "Context window"], "src": ""}, {"term": "Citizen developer", "aka": ["business developer", "power user"], "category": "Cloud and software", "technical": "A business user who builds applications or automations with low-code, no-code or AI tools, outside the central IT development team.", "sales": "A finance analyst who builds their own tools. It unlocks speed, but without governance it can recreate spreadsheet risk in a new form.", "related": ["Low-code", "No-code", "Vibe coding", "Technical debt"], "src": ""}, {"term": "Classification", "aka": ["classifier", "categorization model"], "category": "AI fundamentals", "technical": "A supervised learning task that assigns inputs to predefined categories, such as approve or reject, or mapping a transaction to a GL account.", "sales": "AI that sorts things into buckets. Mapping transactions to accounts or tagging expenses by category are common finance uses.", "related": ["Supervised learning", "Regression", "Machine learning (ML)"], "src": ""}, {"term": "Claude", "aka": ["Anthropic Claude", "Claude Code"], "category": "AI fundamentals", "technical": "A family of large language models and AI assistant products made by Anthropic, available through a chat app, an API, cloud marketplaces and developer tools such as Claude Code. Anthropic also introduced the Model Context Protocol.", "sales": "One of the leading general-purpose AI assistants. Finance teams increasingly connect it to business systems through MCP so it can work with governed data.", "related": ["Large language model (LLM)", "Model Context Protocol (MCP)", "ChatGPT", "Gemini"], "src": ""}, {"term": "Closed model", "aka": ["proprietary model", "hosted model"], "category": "AI fundamentals", "technical": "A model whose weights are not released and that is accessed only through the provider's API or applications.", "sales": "An AI model you use as a service from its maker. It is often the most capable option, and the key questions are data handling and retention terms.", "related": ["Open-weight model", "API", "Foundation model"], "src": ""}, {"term": "Cloud computing", "aka": ["the cloud", "public cloud"], "category": "Cloud and software", "technical": "On-demand delivery of computing resources, such as servers, storage, databases and software, over the internet with pay-as-you-go pricing from providers like AWS, Microsoft Azure and Google Cloud.", "sales": "Renting computing power and software instead of owning hardware. Nearly every modern planning and data platform runs in the cloud.", "related": ["Software as a service (SaaS)", "Infrastructure as a service (IaaS)", "On-premises"], "src": ""}, {"term": "Column masking", "aka": ["column-level security", "CLS", "dynamic data masking"], "category": "Data management", "technical": "A policy that hides or obfuscates values in sensitive columns, such as salary, for users without permission while still returning the rest of the row.", "sales": "Hiding sensitive fields like individual salaries from people who should not see them. It is important for workforce planning data, and data platforms enforce it when data is read.", "related": ["Row-level security", "ABAC", "Cell-level security"], "src": "https://www.databricks.com/blog/abac-row-filtering-and-column-masking-policies-governed-tags-and-data-classification-are-now"}, {"term": "Compute and storage separation", "aka": ["decoupled storage and compute", "separation of compute and storage"], "category": "Data foundations", "technical": "An architecture in which data sits in shared storage while processing runs on independently scaled compute clusters, so each can grow and be billed separately.", "sales": "You pay for storage and for processing power separately, so you can scale up for the close and down afterward. It also means usage spikes can show up as surprise bills.", "related": ["Object storage", "Lakehouse", "Serverless", "Query engine"], "src": ""}, {"term": "Computer use agent", "aka": ["desktop agent", "browser agent", "computer-using agent"], "category": "Agents and AI apps", "technical": "An AI agent that operates a computer's graphical interface, viewing the screen and controlling the mouse, keyboard or browser, to complete tasks in applications that lack an API.", "sales": "AI that clicks through screens like a person would. Useful for legacy systems, but slower and more fragile than a proper integration or MCP connection.", "related": ["AI agent", "Robotic process automation (RPA)", "Tool calling", "Model Context Protocol (MCP)"], "src": ""}, {"term": "Computer vision", "aka": ["CV", "image recognition", "OCR"], "category": "AI fundamentals", "technical": "The field of AI that enables systems to interpret images and video, including object detection, image classification and optical character recognition.", "sales": "AI that reads images and documents. In finance it shows up in invoice capture and reading scanned statements.", "related": ["Multimodal model", "Deep learning"], "src": ""}, {"term": "Context engineering", "aka": ["context curation", "prompt context design"], "category": "AI fundamentals", "technical": "The practice of designing, curating and maintaining what information, tools, instructions and memory go into an AI model's context for each task, including retrieval, summarization and permission filtering.", "sales": "The behind-the-scenes work that decides what the AI is shown before it answers. Snowflake and Databricks currently ship more automated context engineering than Vena, through usage-mined semantics and inferred ontologies.", "related": ["Context layer", "Retrieval-augmented generation (RAG)", "Semantic View Autopilot", "Genie Ontology"], "src": ""}, {"term": "Context layer", "aka": ["data context layer", "AI context layer", "context engine"], "category": "Agents and AI apps", "technical": "The combined semantics, metadata, business definitions, rules, examples and memory that are assembled and supplied to an AI model so its answers reflect how a specific business works. a16z describes it as a superset of the traditional semantic layer.", "sales": "Everything an AI assistant needs to know about the company to give a right answer, not just a plausible one. Every data platform now sells a version of this, so the real questions are what context it holds and who keeps it current.", "related": ["Semantic layer", "Cumulative context", "Context engineering", "Vena Omega"], "src": "https://a16z.com/your-data-agents-need-context/"}, {"term": "Context window", "aka": ["context length", "context limit"], "category": "AI fundamentals", "technical": "The maximum amount of text, measured in tokens, that a model can consider at once, including instructions, conversation history, retrieved data and its own output.", "sales": "How much the AI can keep in mind in one go. Bigger windows help, but you still cannot paste a whole general ledger in, which is why retrieval and semantic layers matter.", "related": ["Tokens and token pricing", "Context engineering", "Retrieval-augmented generation (RAG)"], "src": ""}, {"term": "CSV", "aka": ["comma-separated values", "flat file"], "category": "Data foundations", "technical": "A plain-text file format in which each line is a record and fields are separated by commas, with no built-in data types, hierarchy or validation.", "sales": "The flat file every finance team knows from system exports. It is universal but fragile, since nothing stops a broken column or a stray comma from corrupting a load.", "related": ["JSON", "ETL and ELT", "Data quality"], "src": ""}, {"term": "Cumulative context", "aka": ["compounding context", "institutional memory", "planning memory"], "category": "Agents and AI apps", "technical": "Context that persists and grows across sessions, users and planning cycles, capturing items such as assumptions, overrides, approvals and decisions, rather than resetting with each conversation. Vena positions Vena Omega around this idea.", "sales": "An AI that remembers why last quarter's forecast was overridden and who approved it, so it gets more useful every cycle. Vena has announced this through Vena Omega but not shipped it, and no competitor reviewed documents memory built from planning events.", "related": ["Vena Omega", "Agent memory", "Context layer", "Variance analysis"], "src": "https://www.venasolutions.com/newsroom/vena-to-acquire-morpheo-ai"}, {"term": "Dashboard", "aka": ["scorecard", "report dashboard"], "category": "Data management", "technical": "A visual display of key metrics and charts, usually interactive and refreshed from underlying data, that summarizes performance at a glance.", "sales": "A one-screen view of how the business is doing. The value depends entirely on whether the numbers behind it are governed and current.", "related": ["Business intelligence (BI)", "KPI", "Variance analysis"], "src": ""}, {"term": "Data catalog", "aka": ["metadata catalog", "catalog"], "category": "Data management", "technical": "A metadata system that inventories data assets with descriptions, owners, classifications, glossary terms, lineage and access policies, such as Unity Catalog, Knowledge Catalog or SageMaker Catalog.", "sales": "The searchable directory of what data exists, what it means and who may use it. Catalogs feed AI context, but they describe data rather than run a budget process.", "related": ["Business glossary", "Data lineage", "Unity Catalog", "Knowledge Catalog"], "src": ""}, {"term": "Data contract", "aka": ["data agreement", "data SLA"], "category": "Data management", "technical": "A formal agreement between a data producer and its consumers that specifies schema, meaning, quality expectations and change rules, often enforced automatically in pipelines.", "sales": "A promise from the team that owns a data feed that its structure and meaning will not change without notice. It protects finance from upstream changes that silently break reports.", "related": ["Schema", "Data product", "Data quality", "SLA"], "src": ""}, {"term": "Data fabric", "aka": ["enterprise data fabric"], "category": "Data foundations", "technical": "An architecture that uses metadata, integration and automation to give unified, governed access to data spread across many systems and clouds, often without moving it.", "sales": "A layer that makes scattered data feel like one connected estate. It is an architecture goal, not a product you install, and it still needs business logic on top for planning.", "related": ["Data mesh", "Data virtualization", "Metadata", "Data catalog"], "src": ""}, {"term": "Data federation", "aka": ["federated query", "query federation"], "category": "Data management", "technical": "Running a single query across multiple independent databases or storage systems and combining the results, so each source keeps its own data.", "sales": "Asking one question that pulls answers from several systems at once. Convenient for analysis, but slower and harder to govern than a curated planning model.", "related": ["Data virtualization", "Query engine", "Zero-copy"], "src": ""}, {"term": "Data governance", "aka": ["governance", "data policy"], "category": "Data management", "technical": "The policies, roles, standards and controls that determine how data is defined, accessed, protected, quality-checked and used across an organization.", "sales": "The rules for who owns which data, who can see or change it and how it is kept accurate. Finance leaders care because governed data is what auditors and the board can trust.", "related": ["Data quality", "Data catalog", "RBAC", "AI governance"], "src": ""}, {"term": "Data hub", "aka": ["integration hub", "hub and spoke"], "category": "Data foundations", "technical": "A central architecture where data from many sources is collected, harmonized and distributed to consuming systems through one point, rather than through point-to-point connections.", "sales": "One central exchange point so each system connects once instead of to every other system. It cuts the integration spaghetti that slows down month-end and planning cycles.", "related": ["Data integration", "Master data management (MDM)", "Data fabric"], "src": ""}, {"term": "Data integration", "aka": ["integration", "system integration"], "category": "Data management", "technical": "The practice of combining data from different sources into a consistent, usable view through pipelines, APIs, replication or virtualization.", "sales": "Getting ERP, payroll, CRM and spreadsheet data to line up in one place. Integration effort is often the largest hidden cost in a build vs buy comparison.", "related": ["ETL and ELT", "iPaaS", "API", "Data virtualization"], "src": ""}, {"term": "Data lake", "aka": ["raw data zone"], "category": "Data foundations", "technical": "A low-cost storage repository, usually cloud object storage, that holds raw structured and unstructured files in open formats such as Parquet without imposing a schema up front.", "sales": "A large, inexpensive storage pool where data from every system lands before it is cleaned up. It is a source of actuals for planning, not a place where budgets are entered or approved.", "related": ["Data warehouse", "Lakehouse", "Parquet"], "src": ""}, {"term": "Data lineage", "aka": ["lineage"], "category": "Data management", "technical": "Metadata that traces how data flows from sources through transformations to tables, reports, models and AI outputs, usually captured automatically by the catalog down to column level.", "sales": "The ability to show where a number came from and what touched it along the way. It helps with audit questions, but it tracks data pipelines, not who changed a plan and why.", "related": ["Audit trail", "Data catalog", "Unity Catalog"], "src": ""}, {"term": "Data mart", "aka": ["departmental data mart", "finance data mart"], "category": "Data foundations", "technical": "A subset of a data warehouse modeled for one business area or team, such as finance or sales, often as a star schema.", "sales": "A slice of the warehouse built for one department. Many companies already have a finance data mart that can feed actuals into a planning tool.", "related": ["Data warehouse", "Star schema", "Data product"], "src": ""}, {"term": "Data mesh", "aka": ["domain-oriented data ownership"], "category": "Data foundations", "technical": "An organizational approach in which business domains own and publish their data as governed products on shared self-service platform standards, instead of one central data team owning everything.", "sales": "A way of organizing data so finance, sales and operations each own their own data sets. In a mesh, finance usually owns planning data, which favors tools finance can run without engineers.", "related": ["Data product", "Data catalog"], "src": ""}, {"term": "Data model", "aka": ["logical data model", "conceptual model"], "category": "Data foundations", "technical": "A representation of the entities, attributes and relationships in a domain, expressed at conceptual, logical or physical levels, that guides how data is stored and joined.", "sales": "The map of how business things relate, such as accounts, departments and products. In planning, the data model decides which questions you can answer and how quickly you can add a new driver or entity.", "related": ["Schema", "Star schema", "Dimension", "OLAP cube"], "src": ""}, {"term": "Data observability", "aka": ["data monitoring", "pipeline observability"], "category": "Data management", "technical": "Automated monitoring of data health across pipelines, tracking freshness, volume, schema changes, distribution shifts and lineage to detect issues before users do.", "sales": "An alarm system that flags when a data feed is late, missing rows or suddenly looks wrong. It helps catch a broken actuals load before it reaches a variance report.", "related": ["Data quality", "Data pipeline", "Data lineage", "Anomaly detection"], "src": ""}, {"term": "Data pipeline", "aka": ["pipeline", "data flow"], "category": "Data management", "technical": "An automated series of steps that moves data from sources to destinations, extracting, transforming, validating and loading it on a schedule or in real time.", "sales": "The plumbing that carries actuals from the ERP into reports and plans. In a build scenario, every pipeline is something the customer owns, monitors and fixes when it breaks.", "related": ["ETL and ELT", "Batch vs streaming", "Apache Airflow", "Data observability"], "src": ""}, {"term": "Data product", "aka": ["curated data set", "certified data set"], "category": "Data management", "technical": "A curated, documented and governed data set with a named owner, quality checks and access rules, published for reuse by people, applications or agents. SAP Business Data Cloud and Google Knowledge Catalog use the term heavily.", "sales": "A packaged, trusted data set, such as approved actuals by entity, that others can reuse. SAP and Google pitch data products as the raw material for their AI agents.", "related": ["Data mesh", "SAP Business Data Cloud", "Knowledge Catalog"], "src": ""}, {"term": "Data quality", "aka": ["data cleansing", "data validation", "DQ"], "category": "Data management", "technical": "The degree to which data is accurate, complete, consistent, timely and valid for its intended use, and the processes that measure and fix it.", "sales": "Whether the numbers can be trusted. Poor data quality is a top reason forecasts slip, and AI makes it worse because it can turn bad inputs into confident outputs.", "related": ["Data observability", "Data governance", "Master data management (MDM)", "Hallucination"], "src": ""}, {"term": "Data replication", "aka": ["replication", "database replication"], "category": "Data management", "technical": "Copying data from one system to another and keeping the copies in sync, either continuously or on a schedule, for availability, performance or analytics.", "sales": "Keeping a copy of data in another place so it can be analyzed or survive an outage. Copies need to be kept in sync, which is where reconciliation issues creep in.", "related": ["Change data capture (CDC)", "Data pipeline", "Zero-copy"], "src": ""}, {"term": "Data residency", "aka": ["data sovereignty", "data localization"], "category": "Data management", "technical": "Requirements, set by law, contract or policy, that data be stored and processed within a specific country or region.", "sales": "Rules about which country your data must live in. Buyers in Canada, Europe and regulated industries often ask where the vendor and its AI providers process data.", "related": ["GDPR", "Encryption", "Software as a service (SaaS)"], "src": ""}, {"term": "Data sharing", "aka": ["secure data sharing", "live data sharing"], "category": "Data management", "technical": "Platform features that give another account, organization or tool live, governed read access to tables without exporting files, for example OpenSharing (formerly Delta Sharing), Snowflake sharing or SAP BDC Connect.", "sales": "Letting another team or vendor see a live table instead of emailing extracts. Most planning vendors still use sharing only to import actuals one way, so ask how approved plans flow back.", "related": ["Zero-copy", "OpenSharing", "Data product"], "src": ""}, {"term": "Data store", "aka": ["data repository", "storage system"], "category": "Data foundations", "technical": "Any system that persists data for later use, including databases, data warehouses, data lakes, object storage and even file shares or spreadsheets.", "sales": "The umbrella term for anywhere data lives. In a planning discussion it helps to list every data store feeding the forecast, because each one is a potential reconciliation point.", "related": ["Database", "Data warehouse", "Data lake", "Object storage"], "src": ""}, {"term": "Data virtualization", "aka": ["virtual data layer", "logical data warehouse"], "category": "Data management", "technical": "An approach that presents data from multiple sources through one virtual layer that queries the sources at request time, without physically copying the

 "OLAP cube", "Star schema", "Versions"], "src": ""}, {"term": "Direct Lake", "aka": ["Direct Lake on OneLake"], "category": "Microsoft", "technical": "A Power BI storage mode that reads Delta tables directly from OneLake into memory without import, announced GA on OneLake at FabCon 2026.", "sales": "A way for Power BI reports to read Fabric data live without copying it in. Note that Fabric Planning needs a gateway with fixed credentials, not single sign-on, when connected to these models.", "related": ["OneLake", "Power BI semantic model", "Zero-copy"], "src": "https://azure.microsoft.com/en-us/blog/fabcon-and-sqlcon-2026-unifying-databases-and-fabric-on-a-single-data-platform/"}, {"term": "Driver-based planning", "aka": ["driver-based models", "value driver trees", "measure trees"], "category": "Planning and FP&A", "technical": "A modeling approach in which plan values are calculated from operational drivers, such as headcount times salary rate or units times price, with dependent values recalculated when a driver changes.", "sales": "Planning from the business levers people understand, like volume and price, instead of typing every line. It needs a calculation engine that recalculates on save, which data platforms do not provide out of the box.", "related": ["Scenarios", "Spreading and breakback", "Rolling forecast"], "src": ""}, {"term": "Embeddings and vector database", "aka": ["embeddings", "vector database", "vector search", "AI Search", "pgvector"], "category": "Data and AI", "technical": "Embeddings are numeric vectors that represent the meaning of text or other content, and a vector database indexes them for similarity search. Examples include Databricks AI Search (formerly Vector Search) and pgvector in Postgres.", "sales": "A way to search by meaning instead of exact words, mostly used for documents and policies. It helps AI find relevant commentary or policy text, but it is not how plan numbers should be calculated.", "related": ["Retrieval-augmented generation (RAG)", "Cortex Search", "Grounding"], "src": ""}, {"term": "ETL and ELT", "aka": ["ETL", "ELT", "extract transform load", "data pipeline"], "category": "General data", "technical": "Extract, transform, load moves data out of source systems, reshapes it and then loads it into a target, while extract, load, transform loads raw data first and transforms it inside the warehouse with SQL.", "sales": "The pipelines that move actuals from the ERP, CRM and HR systems into a data platform or a planning tool. Every build option has to fund building and maintaining these pipelines over time.", "related": ["Change data capture (CDC)", "Zero-copy", "Lakeflow", "Openflow"], "src": ""}, {"term": "Evaluations and benchmarks", "aka": ["evals", "benchmarks", "LLM judges", "accuracy testing"], "category": "AI and agents", "technical": "Systematic tests that score AI outputs against expected answers or rubrics, using question sets, LLM judges or code checks, both before release and on sampled production traffic, as with MLflow scorers or Genie benchmarks.", "sales": "How a team proves the AI gives right answers before trusting it. Vendor accuracy figures come from their own small tests, such as Databricks' 84.5% on 28 questions, so ask for results on the buyer's own finance questions.", "related": ["MLflow", "Hallucination", "Text-to-SQL"], "src": ""}, {"term": "Fabric capacity units", "aka": ["CU", "capacity units", "F SKU", "Fabric capacity"], "category": "Microsoft", "technical": "The unit of shared compute in Microsoft Fabric, sold as F SKUs from F2 to F8192, with one or three year reservations saving about 41% over pay-as-you-go, and consumed by workloads including Copilot, data agents and Planning.", "sales": "The prepaid pool of computing power a company buys for Fabric. Because Planning and AI draw from the same pool, Microsoft can position them as already paid for, so ask about real consumption at full use.", "related": ["Planning in Fabric", "Tokens and token pricing", "Microsoft Copilot"], "src": "https://azure.microsoft.com/en-us/pricing/details/microsoft-fabric/"}, {"term": "Fabric data agents", "aka": ["data agents", "AI skills"], "category": "Microsoft", "technical": "Conversational agents in Fabric, GA since FabCon in March 2026, that generate read-only SQL, DAX and KQL over up to five sources such as lakehouses, warehouses and semantic models, with answers capped at 25 rows by 25 columns and English-only support.", "sales": "Microsoft's ask-your-data assistants on Fabric. They cannot change data and only work in English, which matters for bilingual Canadian finance teams.", "related": ["Fabric IQ", "Copilot Studio", "Text-to-SQL"], "src": "https://learn.microsoft.com/en-us/fabric/data-science/concept-data-agent"}, {"term": "Fabric IQ", "aka": ["Microsoft Fabric IQ", "Microsoft IQ", "Fabric IQ Ontology"], "category": "Microsoft", "technical": "Microsoft's enterprise intelligence layer in Fabric that grounds data in business language for people and agents, with Power BI semantic models (GA) and Ontology (preview) as core items and Graph (preview), data agents, operations agents and Planning (GA) as supporting items.", "sales": "Microsoft's umbrella for business context, AI and planning on Fabric. It is the closest platform match to a context layer with planning, and it bills on capacity many prospects already own.", "related": ["Planning in Fabric", "Fabric data agents", "Power BI semantic model", "Ontology"], "src": "https://learn.microsoft.com/en-us/fabric/iq/overview"}, {"term": "Financial consolidation", "aka": ["consolidation", "group reporting", "close and consolidation"], "category": "Planning and FP&A", "technical": "Combining the financial results of multiple legal entities into group statements, including currency translation, intercompany eliminations, ownership and minority interest calculations, and top-side adjustments.", "sales": "Rolling up all the subsidiaries into one set of group numbers that auditors accept. No data platform reviewed offers it natively, while Vena's advanced consolidation went GA on August 26, 2026.", "related": ["Intercompany eliminations", "Currency translation", "Period locking", "Audit trail"], "src": "https://www.venasolutions.com/newsroom/vena-launches-advanced-financial-consolidation-solution"}, {"term": "Fine-tuning", "aka": ["model tuning", "custom model training"], "category": "AI and agents", "technical": "Further training a pre-trained model on a smaller, task-specific data set to change its behavior or style, which is different from supplying context at question time through retrieval or a semantic layer.", "sales": "Teaching an AI model with extra examples so it behaves a certain way. The products in these deals mostly rely on supplying context instead, since charts of accounts and plans change every cycle and a tuned model would go stale.", "related": ["Large language model (LLM)", "Context layer", "Retrieval-augmented generation (RAG)"], "src": ""}, {"term": "Forward deployed engineering (FDE)", "aka": ["FDE", "forward deployed engineers", "Forward Deployed Finance Specialists"], "category": "Planning and FP&A", "technical": "A delivery model in which vendor engineers embed with a customer to build and adapt solutions on the vendor's platform. Snowflake points finance customers to Forward Deployed Finance Specialists, and Palantir is known for this approach.", "sales": "Vendor engineers who come in to build a custom solution. It signals that the platform has no packaged planning product, so the customer ends up owning a custom application.", "related": ["Snowplan", "Palantir Foundry", "CPM and EPM"], "src": "https://www.snowflake.com/en/blog/fpa-ai-modernization-snowplan-v2/"}, {"term": "Gemini Enterprise", "aka": ["Agentspace", "Google Agentspace"], "category": "Google", "technical": "Google's enterprise agent workspace, formerly Agentspace, where users reach Google and partner agents, build no-code agents with Agent Designer and use agents built with ADK. Gemini Enterprise for Financial Services, in preview since August 25, 2026, targets banking use cases rather than FP&A.", "sales": "Google's front door for company-wide AI assistants. Its finance edition targets banks and investment research, not corporate budgeting.", "related": ["Agent Development Kit (ADK)", "Agent Runtime and Memory Bank", "Conversational Analytics API"], "src": "https://cloud.google.com/blog/topics/google-cloud-next/google-cloud-next-2026-wrap-up"}, {"term": "Genie", "aka": ["Genie Agents", "Genie One", "Genie spaces", "Databricks One", "AI/BI Genie"], "category": "Databricks", "technical": "Databricks' natural-language analytics family. Genie Agents (renamed from Genie spaces in July 2026) answer questions over curated tables with read-only queries under each user's permissions, and Genie One (renamed from Databricks One) is the business-user agent app, both GA, with usage by people free through January 31, 2027.", "sales": "Databricks' ask-your-data assistant for business users. Its generated queries are always read-only, so it can explain the numbers but cannot update a plan.", "related": ["Genie Ontology", "Knowledge store", "Text-to-SQL", "Databricks Unit (DBU)"], "src": "https://learn.microsoft.com/en-us/azure/databricks/genie-agents/concepts"}, {"term": "Genie Ontology", "aka": ["Databricks ontology", "OntoRank"], "category": "Databricks", "technical": "A Databricks context layer in public preview that combines Unity Catalog semantics with snippets inferred from dashboards, SQL queries and Genie Agents, each ranked by an authority score based on source, usage and freshness.", "sales": "The Databricks feature closest to context that grows with use. It learns from analytics activity like dashboards and queries rather than from planning events like approvals and overrides.", "related": ["Ontology", "Genie", "Context engineering", "Cumulative context"], "src": "https://docs.databricks.com/aws/en/genie/genie-ontology"}, {"term": "Grounding", "aka": ["grounded answers", "citations"], "category": "Data and AI", "technical": "Constraining an AI model's response to specific, retrievable sources such as governed tables, semantic definitions or documents, often with citations, so outputs can be traced back to data.", "sales": "Making the AI answer from the company's actual numbers and show its sources. In finance, grounding in governed planning data is what makes an answer usable in a review meeting.", "related": ["Retrieval-augmented generation (RAG)", "Hallucination", "Semantic layer"], "src": ""}, {"term": "Guardrails", "aka": ["AI policy", "human in the loop", "prompt injection defense"], "category": "AI and agents", "technical": "Controls that limit what an AI system can see, say or do, such as permission inheritance, content filters, prompt-injection defenses, spending limits and policies that block actions above a threshold. AgentCore Policy is one example.", "sales": "Safety rails that stop an AI from showing the wrong data or making a change it should not. For plan updates, the strongest guardrail is routing AI changes through the same approvals and audit trail people use.", "related": ["AI gateway", "Workflow and approvals", "Amazon Bedrock AgentCore", "Audit trail"], "src": ""}, {"term": "Hallucination", "aka": ["confabulation", "made-up answer"], "category": "Data and AI", "technical": "Output from a language model that is fluent but factually wrong or unsupported by its sources, such as an invented number, field name or policy.", "sales": "When an AI confidently states something untrue. BARC puts the finance stakes well, noting that finance teams need explainable recommendations tied to planning logic and governed data, not confident guesses.", "related": ["Grounding", "Evaluations and benchmarks", "Retrieval-augmented generation (RAG)"], "src": ""}, {"term": "Hybrid Tables", "aka": ["Unistore", "Snowflake Hybrid Tables"], "category": "Snowflake", "technical": "Snowflake tables, part of Unistore, that add a row store with row-level locking and enforced primary, foreign and unique keys for transactional workloads next to analytics. Snowflake declared them GA in November 2024, though one third party still calls them preview.", "sales": "Snowflake's way of handling many small, fast updates, which planning input requires. A secondary source reports they lack time travel, which would push plan history into custom tables.", "related": ["OLTP vs OLAP", "Write-back", "Snowflake Postgres"], "src": "https://www.snowflake.com/en/blog/unistore-general-availability/"}, {"term": "Intercompany eliminations", "aka": ["eliminations", "intercompany matching", "IC eliminations"], "category": "Planning and FP&A", "technical": "Consolidation entries that remove balances and transactions between entities in the same group, such as intercompany sales, receivables and payables, so group results reflect only external activity, usually after intercompany matching.", "sales": "Removing sales and balances between a company's own subsidiaries so revenue is not counted twice. It is a core reason finance teams buy a CPM product rather than build one.", "related": ["Financial consolidation", "Currency translation"], "src": ""}, {"term": "Joule", "aka": ["SAP Joule", "Joule Agents", "Joule Studio", "Financial Planning Assistant"], "category": "SAP", "technical": "SAP's AI assistant and agent front end that orchestrates workflows, data and more than 200 specialized agents through over 50 domain assistants. The Financial Planning Assistant and Joule Agents in SAP Enterprise Planning were scheduled for GA in Q3 2026, delivery was not verified, and Joule Studio MCP and A2A support is described as future.", "sales": "SAP's AI copilot across its applications. Its planning agents were due in Q3 2026, while Vena's Planning Agent has been GA since May 2026.", "related": ["SAP Analytics Cloud planning", "SAP Knowledge Graph", "Agent2Agent protocol (A2A)"], "src": "https://news.sap.com/2026/05/sap-sapphire-sap-unveils-autonomous-enterprise/"}, {"term": "Knowledge Catalog", "aka": ["Dataplex", "Dataplex Universal Catalog"], "category": "Google", "technical": "Google Cloud's metadata and governance catalog, renamed from Dataplex Universal Catalog on April 10, 2026, which brings BigQuery measures and LookML together. Automated context curation of descriptions, glossaries and verified SQL is in preview.", "sales": "Google's catalog of what data means and who owns it, previously called Dataplex. One analyst firm calls it more of a metadata aggregator than a true business context layer.", "related": ["Data catalog", "Business glossary", "BigQuery", "LookML"], "src": "https://docs.cloud.google.com/dataplex/docs/catalog-overview"}, {"term": "Knowledge graph", "aka": ["graph", "semantic graph"], "category": "Data and AI", "technical": "A graph data structure of entities as nodes and relationships as edges, with attached metadata, that supports traversal queries and gives AI structured context. SAP Knowledge Graph and BigQuery Graph are examples.", "sales": "A connected web of business facts, like which entities roll up to which region and which contracts drive which revenue. SAP now positions its Knowledge Graph as the foundation for its AI agents.", "related": ["Ontology", "SAP Knowledge Graph", "Context layer"], "src": ""}, {"term": "Knowledge store", "aka": ["Genie knowledge store", "Genie instructions"], "category": "Databricks", "technical": "The author-curated set of semantic definitions attached to a Genie Agent, including table descriptions, joins, SQL expressions, example SQL and instructions. Feedback generates suggestions, but Databricks states agent behavior does not change from user feedback alone.", "sales": "The hand-maintained notes that teach a Genie assistant how the data works. Someone on the data team has to keep them current.", "related": ["Genie", "Verified queries", "Context engineering"], "src": "https://docs.databricks.com/aws/en/genie-agents/tune-quality"}, {"term": "Lakebase", "aka": ["Databricks Lakebase", "serverless Postgres"], "category": "Databricks", "technical": "Databricks' managed serverless PostgreSQL service for transactional workloads, with autoscaling, zero-copy branching, point-in-time recovery and sync to Delta tables. GA on AWS in February 2026, with Azure in beta at that time.", "sales": "A transactional database inside Databricks that custom apps can save data to. Its branching copies a database, which is not the same as managing budget and forecast versions.", "related": ["Databricks Apps", "OLTP vs OLAP", "Versions", "Snowflake Postgres"], "src": "https://databricks.com/blog/databricks-lakebase-generally-available"}, {"term": "Lakeflow", "aka": ["Lakeflow Connect", "Lakeflow Jobs", "Lakeflow Designer"], "category": "Databricks", "technical": "Databricks' data engineering suite, including Lakeflow Connect managed connectors (for example NetSuite, Workday and Dynamics 365), Lakeflow Designer for no-code pipelines and Lakeflow Jobs for orchestration.", "sales": "Databricks' tools for bringing in and moving data. Lakeflow Jobs schedules data pipelines and is not a budget approval workflow.", "related": ["ETL and ELT", "Openflow", "Workflow and approvals"], "src": "https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/saas-overview"}, {"term": "Lakehouse", "aka": ["data lakehouse"], "category": "General data", "technical": "An architecture that adds warehouse features such as ACID transactions, schemas and governance on top of data lake storage, using open table formats like Delta Lake or Apache Iceberg.", "sales": "The modern blend of a data lake and a warehouse, popularized by Databricks and now offered by most platforms. It is a strong foundation for data, but budgets, approvals and versions still have to come from a planning application on top.", "related": ["Data lake", "Data warehouse", "Delta Lake", "Apache Iceberg"], "src": ""}, {"term": "Large language model (LLM)", "aka": ["LLM", "foundation model", "GPT", "Claude", "Gemini"], "category": "AI and agents", "technical": "A neural network trained on very large text collections to predict tokens, which can follow instructions, summarize, reason and generate code or SQL. Examples include OpenAI GPT, Anthropic Claude and Google Gemini models.", "sales": "The general-purpose AI engine behind chat assistants. On its own it knows nothing about a company's chart of accounts, which is why context and semantics matter so much.", "related": ["Tokens and token pricing", "Fine-tuning", "Grounding"], "src": ""}, {"term": "Looker", "aka": ["Google Looker", "Conversational Analytics in Looker"], "category": "Google", "technical": "Google's BI platform built on the LookML semantic model, with Conversational Analytics in Looker (GA) and newer agentic features such as dashboard agents and a managed Looker MCP server in preview.", "sales": "Google's reporting tool, known for consistent metric definitions. Its only documented write-back to BigQuery is a reference pattern that only appends rows, which is far from planning input.", "related": ["LookML", "BigQuery", "Conversational Analytics API"], "src": "https://docs.cloud.google.com/looker/docs/conversational-analytics-overview"}, {"term": "LookML", "aka": ["Looker modeling language"], "category": "Google", "technical": "Looker's code-based modeling language that defines dimensions, measures, joins and Explores over SQL databases, maintained by developers with Git version control and continuous integration.", "sales": "The language Looker uses to define business metrics, maintained by developers in code. It is a strong reporting semantic layer, but it has no concept of plan input, versions or scenarios.", "related": ["Looker", "Semantic layer", "Metrics layer"], "src": "https://cloud.google.com/blog/products/business-intelligence/how-lookers-semantic-layer-enhances-gen-ai-trustworthiness"}, {"term": "MCP server", "aka": ["managed MCP server", "remote MCP server"], "category": "AI and agents", "technical": "A service that exposes a system's capabilities as MCP tools and resources and handles authentication and permissions, so external AI clients can query or act on that system. Servers can be vendor-managed remote endpoints or self-hosted.", "sales": "The specific connector a vendor publishes so AI assistants can reach its data. Check the tool list, since many are read-only, including Microsoft's Fabric IQ MCP server, and Vena's developer docs currently list read tools only.", "related": ["Model Context Protocol (MCP)", "Vena MCP server", "MCP Toolbox for Databases"], "src": ""}, {"term": "MCP Toolbox for Databases", "aka": ["MCP Toolbox", "Google MCP Toolbox"], "category": "Google", "technical": "Google's open-source MCP server framework, version 1.0 GA, that exposes database and analytics tools, including BigQuery conversational analytics and TimesFM forecasting, to MCP clients and ADK agents as a self-managed alternative to Google's managed MCP servers.", "sales": "A free Google toolkit that lets AI assistants query company databases. It speeds up building agents but does not add planning features.", "related": ["MCP server", "Agent Development Kit (ADK)", "BigQuery"], "src": "https://cloud.google.com/blog/products/data-analytics/new-data-agents-across-the-agentic-data-cloud"}, {"term": "Measure", "aka": ["metric", "KPI", "fact"], "category": "General data", "technical": "A numeric value or aggregation defined over facts, such as revenue, headcount or margin percent, calculated by summing or applying a formula across the selected dimension members.", "sales": "The actual number being reported or planned, like revenue or headcount. Defining each measure once, in one place, is the main promise of a semantic layer.", "related": ["Dimension", "Metrics layer", "Semantic layer"], "src": ""}, {"term": "Metric views", "aka": ["UC metric views", "Unity Catalog Metrics", "UC Metrics"], "category": "Databricks", "technical": "Unity Catalog objects, defined in YAML, SQL or a low-code editor, that separate measures from dimensions so metrics are defined once and queried by any grouping, with star and snowflake joins, window measures and materialization. GA per Databricks, though one third-party recap lists them as preview.", "sales": "Databricks' semantic layer for KPIs, feeding dashboards, Genie and outside BI tools. Data engineers usually maintain them, not finance.", "related": ["Semantic layer", "Metrics layer", "Unity Catalog", "Genie"], "src": "https://docs.databricks.com/aws/en/metric-views"}, {"term": "Metrics layer", "aka": ["metric layer", "metrics store", "MetricFlow", "BigQuery measures"], "category": "Data and AI", "technical": "A semantic layer component focused on defining business metrics as reusable calculations that tools request by name instead of writing SQL, such as dbt MetricFlow, Databricks metric views or BigQuery measures (preview).", "sales": "One place where KPIs are defined so the board deck and the AI assistant agree. It covers reporting definitions, not plan inputs, versions or approvals.", "related": ["Semantic layer", "Metric views", "Semantic views", "Open Semantic Interchange (OSI)"], "src": ""}, {"term": "Microsoft Copilot", "aka": ["Copilot", "Microsoft 365 Copilot", "Copilot in Fabric", "Copilot in Power BI"], "category": "Microsoft", "technical": "Microsoft's family of AI assistants, including Microsoft 365 Copilot and Copilot in Fabric and Power BI, which consumes Fabric capacity units. Copilot in Fabric processes data in the US and EU data boundaries, so Canadian data is processed cross-geo.", "sales": "Microsoft's AI assistant across Office, Teams and Power BI. Vena works inside it, since the Vena MCP server supports Microsoft Copilot as a client and Vena Copilot runs in Teams.", "related": ["Copilot Studio", "Vena MCP server", "Vena Copilot"], "src": "https://learn.microsoft.com/en-us/fabric/fundamentals/copilot-fabric-overview"}, {"term": "Microsoft Purview", "aka": ["Purview", "Purview DLP", "eDiscovery"], "category": "Microsoft", "technical": "Microsoft's data governance, security and compliance suite, providing data loss prevention, access restriction policies, audit and eDiscovery that apply to Fabric data agents and Copilot interactions.", "sales": "Microsoft's compliance toolset that protects and logs AI conversations about company data. It is a genuine governance strength for Microsoft and a standard expectation for any AI tool in finance.", "related": ["Fabric data agents", "Guardrails", "Audit trail"], "src": "https://learn.microsoft.com/en-us/fabric/data-science/concept-data-agent"}, {"term": "MLflow", "aka": ["MLflow 3", "Agent Evaluation"], "category": "Databricks", "technical": "An open-source platform, deeply integrated in Databricks, for tracking, evaluating and monitoring machine learning and generative AI applications. MLflow 3 attaches scorers such as LLM judges and code checks to traces before release and on production traffic.", "sales": "The quality-control system Databricks teams use to test AI before and after launch. Using it well is part of the ongoing engineering cost of building your own agents.", "related": ["Evaluations and benchmarks", "Agent Bricks"], "src": "https://docs.databricks.com/aws/en/mlflow3/genai/eval-monitor"}, {"term": "Model Context Protocol (MCP)", "aka": ["MCP"], "category": "AI and agents", "technical": "An open protocol, introduced by Anthropic, that standardizes how AI applications discover and call external tools, data and prompts through MCP servers, so one integration works across clients such as Claude, ChatGPT and Microsoft Copilot.", "sales": "A universal plug that lets any AI assistant connect to a business system. Almost every vendor in these deals now has one, so the useful questions are what it can read, whether it can write, and whose permissions it uses.", "related": ["MCP server", "Tool calling", "Vena MCP server", "Agent2Agent protocol (A2A)"], "src": ""}, {"term": "Morpheo", "aka": ["Morpheo AI", "Morpheo Omega"], "category": "Vena", "technical": "Morpheo AI Inc., a seven-person Toronto agentic data platform company whose Morpheo Omega product launched in preview in November 2025. Vena announced the acquisition July 28, 2026 and closed it August 18, 2026 to strengthen Vena Omega.", "sales": "The startup Vena bought to accelerate Vena Omega, bringing data preparation and context technology. Avoid enterprise-maturity claims for its technology until Vena publishes controls and timelines.", "related": ["Vena Omega", "SOC 2"], "src": "https://www.venasolutions.com/newsroom/vena-completes-acquisition-of-morpheo-ai"}, {"term": "Mosaic AI", "aka": ["Mosaic AI Agent Framework", "Databricks Mosaic AI"], "category": "Databricks", "technical": "Databricks' brand for its generative AI tooling, whose Mosaic AI Agent Framework is now marketed under the Agent Bricks umbrella as Custom Agents on Apps.", "sales": "An older Databricks name reps will still see in decks and documents. Treat it as part of Agent Bricks.", "related": ["Agent Bricks", "MLflow"], "src": "https://www.databricks.com/blog/agent-bricks-governed-enterprise-agent-platform"}, {"term": "Multi-agent system", "aka": ["multi-agent", "supervisor agent", "sub-agents"], "category": "AI and agents", "technical": "An architecture in which specialized agents handle sub-tasks while a supervisor or router agent delegates work and combines results. Databricks' Supervisor Agent, GA February 10, 2026, is one example.", "sales": "A team of specialist AI helpers with a coordinator, for example one for actuals, one for documents and one for forecasting. It is powerful, but each specialist still needs a reliable data and planning foundation.", "related": ["Agent orchestration", "Agent Bricks", "Agent2Agent protocol (A2A)"], "src": ""}, {"term": "OLAP cube", "aka": ["cube", "multidimensional model", "planning cube"], "category": "General data", "technical": "A multidimensional data structure that stores measures at the intersections of dimensions such as account, entity, time and version, with hierarchies that roll values up for fast slicing and aggregation.", "sales": "The engine behind most planning tools, where every number sits at a point like Revenue, Ontario, March, Budget. Vena's CubeFLEX is a cube, while data platform semantic layers are mostly read-only views over tables.", "related": ["Dimension", "Measure", "CubeFLEX", "Star schema"], "src": ""}, {"term": "OLTP vs OLAP", "aka": ["OLTP", "OLAP", "transactional vs analytical"], "category": "General data", "technical": "Online transaction processing systems handle many small concurrent reads and writes such as order entry, while online analytical processing systems handle large aggregations across dimensions. Planning needs both, fast cell-level writes and fast rollups.", "sales": "One kind of database is built for recording transactions, the other for summarizing them. Planning is unusual because users type numbers and expect instant totals, which is why platforms bolt on Postgres or hybrid tables when teams try to build it.", "related": ["OLAP cube", "Hybrid Tables", "Lakebase", "Snowflake Postgres"], "src": ""}, {"term": "OneLake", "aka": ["Fabric OneLake", "shortcuts", "mirroring"], "category": "Microsoft", "technical": "The single, tenant-wide data lake under Microsoft Fabric, storing data in open Delta format and exposing outside data in place through shortcuts or as managed replicas through mirroring.", "sales": "Microsoft Fabric's one data lake for the whole company. Fabric Planning reads from it, and Vena's six Microsoft Fabric data integrations connect to the same Microsoft data estate.", "related": ["Direct Lake", "Zero-copy", "Fabric IQ", "Delta Lake"], "src": "https://azure.microsoft.com/en-us/blog/fabcon-and-sqlcon-2026-unifying-databases-and-fabric-on-a-single-data-platform/"}, {"term": "Ontology", "aka": ["business ontology", "entity model"], "category": "Data and AI", "technical": "A formal model of business entities, their properties, relationships and rules, such as customer, contract or cost center, that people and agents can reason over. Palantir, Microsoft Fabric IQ and Databricks Genie Ontology each use the word differently.", "sales": "A map of the business that explains how things relate, not just what columns mean. Ask whether a vendor's ontology is hand-built by engineers or learned from use, and whether it can change data or only describe it.", "related": ["Knowledge graph", "Palantir Ontology", "Genie Ontology", "Fabric IQ", "Semantic layer"], "src": ""}, {"term": "Ontology actions", "aka": ["action types", "Palantir actions"], "category": "Palantir", "technical": "Palantir action types define a single transaction that changes one or more Ontology objects using user-defined logic, with rules, submission criteria, per-action permissions, side effects to external systems and action logs with full audit history.", "sales": "Palantir's governed way to change data, with permissions and a full audit log. It is a generic building block, so budget submission and approval would need to be designed on top.", "related": ["Palantir Ontology", "Audit trail", "Workflow and approvals"], "src": "https://www.palantir.com/docs/foundry/action-types/overview"}, {"term": "Open Semantic Interchange (OSI)", "aka": ["OSI", "Apache Ossie"], "category": "Snowflake", "technical": "A vendor-neutral, Apache 2.0 specification for exchanging semantic definitions (data sets, metrics, dimensions, relationships and contexts) across tools. Snowflake published the first version January 27, 2026, recaps describe it as finalized at Summit 2026 with 54 vendors, and a secondary source reports it entered the Apache Incubator as Apache Ossie.", "sales": "An industry standard so metric definitions can move between tools instead of being rebuilt in each one. Databricks, dbt Labs and Salesforce are members, but no planning vendor appears on the published member list.", "related": ["Semantic layer", "Metrics layer", "Semantic views"], "src": "https://www.snowflake.com/en/blog/open-semantic-interchanges-specs-finalized/"}, {"term": "Openflow", "aka": ["Snowflake Openflow"], "category": "Snowflake", "technical": "Snowflake's managed data ingestion service based on Apache NiFi for batch and streaming pipelines, GA since May 2025, with second-generation deployments and runtimes GA September 8, 2026 and gen-2 connectors such as PostgreSQL and MySQL CDC still in public preview.", "sales": "Snowflake's tool for bringing data in from other systems. It moves actuals into Snowflake, which is the first step of any build on Snowflake.", "related": ["ETL and ELT", "Change data capture (CDC)", "Lakeflow"], "src": "https://docs.snowflake.com/en/release-notes/2026/other/2026-09-08-openflow-gen2-deployment-runtime-ga"}, {"term": "OpenSharing", "aka": ["Delta Sharing"], "category": "Databricks", "technical": "Databricks' open protocol for live, cross-platform table sharing without copying, renamed from Delta Sharing in June 2026 and hosted by the Linux Foundation.", "sales": "The way Databricks lets other tools read its tables directly. Planning vendors such as Pigment use it only to import data, with no write-back.", "related": ["Data sharing", "Zero-copy", "Delta Lake"], "src": "https://www.databricks.com/company/newsroom/press-releases/databricks-announces-opensharing"}, {"term": "Operational Tables", "aka": ["Vena Operational Tables"], "category": "Vena", "technical": "A Vena feature in open beta from the Spring 2026 release for creating, managing and using relational data directly within Excel, with the option to push that data into Power BI Desktop.", "sales": "A way to keep operational detail, such as headcount records or project lists, alongside financial plans in Vena. It is in open beta, so confirm availability before promising it.", "related": ["CubeFLEX", "Vena MCP server"], "src": "https://www.venasolutions.com/product-release/fy27/spring/partner"}, {"term": "Palantir AIP", "aka": ["AIP", "Artificial Intelligence Platform", "Chatbot Studio", "AIP Agent Studio"], "category": "Palantir", "technical": "Palantir's AI platform on Foundry, including AIP Logic, Chatbot Studio (formerly AIP Agent Studio), Threads, Assist, Evals and pro-code agents built with the Claude, OpenAI or Google agent SDKs and bound to the Ontology.", "sales": "Palantir's AI layer for building assistants and AI workflows on the Ontology. It is powerful, and any finance agents would be custom-built.", "related": ["AIP Logic", "Palantir Ontology", "AI agent"], "src": "https://www.palantir.com/docs/foundry/aip/overview"}, {"term": "Palantir Foundry", "aka": ["Foundry", "Workshop"], "category": "Palantir", "technical": "Palantir's data integration and application platform centered on the Ontology, with pipelines, Workshop applications and AIP for AI workflows, sold under enterprise contracts with AIP usage priced in compute-seconds.", "sales": "Palantir's platform for building bespoke operational and decision apps on company data. It can power a custom planning app, but the planning model, calculations, approvals and Excel experience would all be built.", "related": ["Palantir Ontology", "Palantir AIP", "Forward deployed engineering (FDE)"], "src": "https://www.palantir.com/docs/foundry/aip/overview"}, {"term": "Palantir Ontology", "aka": ["Ontology (Palantir)", "Ontology MCP"], "category": "Palantir", "technical": "Foundry's semantic and operational layer of object types, properties, links, actions and functions that serves as both the business model and the governed write-back layer, exposed to outside agents through Ontology MCP with controlled writes.", "sales": "Palantir's model of the business, which also controls how data gets changed. Architecturally it is the closest match to context plus actions, but every finance concept must be modeled by the customer.", "related": ["Ontology actions", "Ontology", "Model Context Protocol (MCP)"], "src": "https://www.palantir.com/docs/foundry/ontology-mcp/overview"}, {"term": "Parquet", "aka": ["Apache Parquet", "columnar file format"], "category": "General data", "technical": "An open-source columnar file format that compresses well and lets query engines read only the columns they need, used as the storage layer under Delta Lake and Iceberg.", "sales": "The standard file type behind most modern data platforms. Buyers rarely need to think about it, but it is why large data sets can be queried quickly and cheaply.", "related": ["Delta Lake", "Apache Iceberg", "Data lake"], "src": ""}, {"term": "Period locking", "aka": ["data locking", "version locking", "close lock"], "category": "Planning and FP&A", "technical": "Controls that freeze data for closed periods, submitted entities or approved versions so values cannot change without an authorized unlock, sometimes delegated to data owners. SAP Analytics Cloud calls this data locking.", "sales": "Freezing last month or an approved budget so nobody changes it after the fact. It protects the numbers that went to the board.", "related": ["Versions", "Workflow and approvals", "Audit trail"], "src": ""}, {"term": "Planning in Fabric", "aka": ["Fabric Planning", "Lumel", "Inforiver", "PowerTable"], "category": "Microsoft", "technical": "Microsoft's first-party EPM and CPM workload in Fabric IQ, built by Lumel, for budgets, forecasts, scenarios and variance analysis, writing back to Fabric SQL databases. GA by mid-2026 with billing on Fabric capacity from August 1, 2026, and documented limits include one semantic model per plan item and 1.2 million cells per write-back.", "sales": "Microsoft's own budgeting and forecasting tool inside Fabric, and the most direct competitor in Microsoft-centric accounts. Probe consolidation, native Excel use and what its AI does today, since Microsoft lists agentic planning as roadmap.", "related": ["Fabric IQ", "Acterys", "Fabric capacity units", "CPM and EPM"], "src": "https://learn.microsoft.com/en-us/fabric/iq/plan/overview"}, {"term": "Power BI semantic model", "aka": ["semantic model", "Power BI dataset", "Prep data for AI"], "category": "Microsoft", "technical": "The governed tabular model in Power BI and Fabric, formerly called a dataset, holding tables, relationships, DAX measures, hierarchies and row-level security, now enriched with AI instructions and verified answers for Copilot (preview).", "sales": "The model most Power BI finance reports already run on. Microsoft now reuses it as AI context and as the base for Fabric Planning, which is a strong advantage in Power BI shops.", "related": ["Semantic layer", "Fabric IQ", "Planning in Fabric", "Direct Lake"], "src": "https://learn.microsoft.com/en-us/power-bi/create-reports/copilot-prepare-data-ai"}, {"term": "RBAC", "aka": ["role-based access control", "roles"], "category": "General data", "technical": "An access model that assigns permissions to roles and roles to users, so access follows job function. Snowflake and most SaaS applications are built around it.", "sales": "Access based on job role, such as planner, reviewer or admin. Planning tools combine roles with workflow so the right people submit and approve, which data platforms leave to the builder.", "related": ["ABAC", "Workflow and approvals", "Cell-level security"], "src": ""}, {"term": "Retrieval-augmented generation (RAG)", "aka": ["RAG", "retrieval"], "category": "Data and AI", "technical": "A pattern in which a system retrieves relevant documents or records at question time and passes them to an LLM as context, so answers draw on the organization's data rather than the model's training alone.", "sales": "Looking things up before answering, the way an analyst checks the source file. It reduces made-up answers, but quality still depends on what gets retrieved and whether it is current.", "related": ["Grounding", "Embeddings and vector database", "Hallucination"], "src": ""}, {"term": "Rolling forecast", "aka": ["continuous forecast", "12-month rolling forecast"], "category": "Planning and FP&A", "technical": "A forecast updated on a regular cadence that always extends a fixed number of periods ahead, such as 12 or 18 months, adding a new period as each one closes instead of stopping at fiscal year end.", "sales": "A forecast that always looks a year or more ahead instead of ending in December. It means refreshing data and revisiting assumptions more often, which raises the value of automation and of remembering past assumptions.", "related": ["Driver-based planning", "Versions", "Variance analysis"], "src": ""}, {"term": "Row-level security", "aka": ["RLS", "row access policy", "row filter"], "category": "General data", "technical": "A policy that filters which rows a user can see based on identity or attributes, enforced by the database or semantic model at query time. AI agents on most platforms inherit these filters.", "sales": "Making sure a regional manager only sees their own region's data. On data platforms it mainly controls what people read, not which plan numbers they are allowed to change.", "related": ["Column masking", "Cell-level security", "ABAC"], "src": ""}, {"term": "SageMaker Unified Studio", "aka": ["Amazon SageMaker Unified Studio", "SageMaker Catalog", "SageMaker Lakehouse"], "category": "AWS", "technical": "AWS's unified data and AI workspace, GA March 13, 2025, that brings together EMR, Glue, Athena and Redshift tools with lakehouse data access and governance through SageMaker Catalog, which can enforce business glossary terms.", "sales": "Amazon's one-stop workspace for data and AI teams. It governs and prepares data well, but it is a toolset for engineers, not an application for planners.", "related": ["Data catalog", "Business glossary", "Amazon Redshift"], "src": "https://aws.amazon.com/about-aws/whats-new/2025/03/amazon-sagemaker-unified-studio-generally-available/"}, {"term": "SAP Analytics Cloud planning", "aka": ["SAC", "SAC planning", "SAP Analytics Cloud"], "category": "SAP", "technical": "The planning capabilities of SAP Analytics Cloud, including cell-level data entry with rolldown, private and published versions, data locking, data actions, structured allocations, validation rules, value driver trees and an Excel add-in with write-back.", "sales": "SAP's real planning tool and the most direct full-stack competitor in SAP ERP accounts. Ask what is shipped versus scheduled for its AI agents, and how it handles entities that run on other ERPs.", "related": ["Joule", "SAP Business Data Cloud", "Allocations", "Period locking"], "src": "https://learning.sap.com/courses/exploring-sap-analytics-cloud/describing-planning-features_c4054dc5-c8af-4c7b-8f74-54d03b0bc413"}, {"term": "SAP Business Data Cloud", "aka": ["BDC", "SAP BDC", "BDC Connect", "SAP Business AI Platform"], "category": "SAP", "technical": "SAP's business data fabric combining Datasphere, SAP Analytics Cloud, HANA Cloud, BW and SAP Databricks with curated SAP data products, sold in Capacity Units and required to be bought with at least one Intelligent Application. BDC Connect shares data zero-copy with Databricks, Snowflake, BigQuery and Fabric.", "sales": "SAP's data platform for SAP and partner data, bundled with its analytics and planning tools. It is strongest where the business runs on SAP and it carries commercial lock-in signals.", "related": ["SAP Datasphere", "SAP Analytics Cloud planning", "SAP Knowledge Graph", "Zero-copy"], "src": "https://news.sap.com/2026/05/sap-bdc-accelerate-autonomous-enterprise/"}, {"term": "SAP Datasphere", "aka": ["Datasphere", "seamless planning"], "category": "SAP", "technical": "SAP's data warehousing and modeling service inside Business Data Cloud that federates SAP and non-SAP data. With seamless planning, SAP Analytics Cloud planning models store their data in Datasphere spaces.", "sales": "SAP's data warehouse layer under its planning and analytics tools. Seamless planning requires SAC on HANA Cloud, one-to-one SAC and Datasphere tenants and the same data center.", "related": ["SAP Business Data Cloud", "SAP Analytics Cloud planning"], "src": "https://www.sap.com/events/sapphire/innovation-guide/data-cloud.html"}, {"term": "SAP Knowledge Graph", "aka": ["Knowledge Graph (SAP)"], "category": "SAP", "technical": "A structured map of business entities, processes and relationships that SAP announced at Sapphire in May 2026 as the foundation of the SAP Business AI Platform, building on the knowledge graph component SAP added to Datasphere in 2025.", "sales": "SAP's map of how its business objects connect, used to give Joule agents context. It is strongest on SAP master data and processes.", "related": ["Knowledge graph", "Joule", "SAP Business Data Cloud"], "src": "https://news.sap.com/2026/05/sap-sapphire-sap-unveils-autonomous-enterprise/"}, {"term": "Scenarios", "aka": ["what-if", "scenario planning", "scenario modeling"], "category": "Planning and FP&A", "technical": "Alternative sets of assumptions and their calculated outcomes, such as base, upside and downside, stored and compared alongside versions. A persisted scenario differs from a one-off what-if question answered by an AI agent.", "sales": "Modeling what happens if growth slows or a price increase lands, and keeping those cases to compare. Many data platform agents can answer a what-if question, but they do not save the scenario into a governed plan.", "related": ["Versions", "Driver-based planning", "Vena Planning, Query and Reporting agents"], "src": ""}, {"term": "Semantic layer", "aka": ["semantic model", "business layer", "universal semantic layer"], "category": "Data and AI", "technical": "A governed model that maps physical tables to business concepts, defining measures, dimensions, relationships, hierarchies and synonyms once so BI tools and AI agents generate consistent queries.", "sales": "A shared dictionary that tells every report and AI assistant what revenue or gross margin actually means. Every major data platform now ships one, so a semantic layer alone no longer sets a planning vendor apart.", "related": ["Metrics layer", "Semantic views", "Metric views", "LookML", "Power BI semantic model"], "src": ""}, {"term": "Semantic View Autopilot", "aka": ["SVA", "Autopilot"], "category": "Snowflake", "technical": "A Snowflake feature, GA February 3, 2026, that generates and updates semantic views from query history, BI dashboards such as Tableau and Power BI, and trusted SQL, proposing changes that data teams review and certify. One third-party recap lists it as preview, possibly reflecting newer sub-features.", "sales": "Snowflake software that learns business definitions by watching how people already query data. It is a real, shipping example of context that improves with use, though it learns from analytics rather than from planning cycles.", "related": ["Semantic views", "Context engineering", "Verified queries", "Cortex Sense"], "src": "https://www.snowflake.com/en/blog/semantic-view-autopilot/"}, {"term": "Semantic views", "aka": ["Snowflake semantic views", "semantic model (Snowflake)"], "category": "Snowflake", "technical": "Schema-level Snowflake database objects that define tables, relationships, facts, dimensions and metrics for BI tools and Cortex Analyst, replacing YAML semantic models. GA for querying since August 26, 2025.", "sales": "Snowflake's semantic layer, where business definitions of metrics live. They describe reporting data and do not include plan versions, input or approval logic.", "related": ["Semantic layer", "Semantic View Autopilot", "Cortex Analyst", "Open Semantic Interchange (OSI)"], "src": "https://docs.snowflake.com/en/release-notes/2025/9_25"}, {"term": "Service principal", "aka": ["service account", "machine identity", "app identity"], "category": "General data", "technical": "A non-human identity, such as an application or automation account, that authenticates with its own credentials and permissions rather than acting on behalf of a signed-in user.", "sales": "A system account that software uses to log in. It matters for cost and governance, for example Databricks bills Genie usage by service principals while usage by people is free through January 31, 2027.", "related": ["Single sign-on (SSO)", "RBAC", "Genie"], "src": ""}, {"term": "Single sign-on (SSO)", "aka": ["SSO", "SAML", "OpenID Connect", "Entra ID", "Okta"], "category": "General data", "technical": "An authentication setup in which users sign in once with a central identity provider such as Microsoft Entra ID or Okta, and applications trust that identity through standards like SAML or OpenID Connect.", "sales": "One company login for every tool. Buyers expect it from any vendor, and it also decides whether AI assistants act as the individual user with that user's permissions.", "related": ["Service principal", "RBAC"], "src": ""}, {"term": "Snowflake CoWork", "aka": ["CoWork", "Snowflake Intelligence"], "category": "Snowflake", "technical": "Snowflake's packaged agent application for business users, with charts, artifacts, automations, skills, Deep Research and per-user memory, inheriting row-access and column-level policies. Renamed from Snowflake Intelligence at Summit 2026 in June, and the preview status of features such as User Memory is reported inconsistently.", "sales": "Snowflake's ready-made AI assistant for business users, previously called Snowflake Intelligence. Its memory is personal to each user, not shared memory of the finance team's planning decisions.", "related": ["Cortex Agents", "Agent memory", "Cortex Sense"], "src": "https://docs.snowflake.com/en/user-guide/snowflake-cortex/snowflake-cowork"}, {"term": "Snowflake Horizon", "aka": ["Horizon", "Horizon Catalog", "Horizon Context"], "category": "Snowflake", "technical": "Snowflake's built-in governance and discovery capabilities, covering access policies, classification, lineage and AI guardrails. Horizon Context, announced at Summit 2026 and reported in private preview, collects and enriches metadata from outside sources through five connectors.", "sales": "The governance layer inside Snowflake that controls who sees what and documents data. It helps prove data is trusted, but it is not a planning or approval workflow.", "related": ["Data catalog", "Cortex Sense", "Row-level security"], "src": ""}, {"term": "Snowflake Native Apps", "aka": ["Native App Framework", "Native Apps"], "category": "Snowflake", "technical": "Applications packaged with the Snowflake Native App Framework that install and run inside a customer's Snowflake account. Support for Cortex Agents and Snowflake-managed MCP servers inside Native Apps went GA August 7, 2026.", "sales": "A way for software vendors to ship an app that runs inside the customer's own Snowflake account. It is the route any third party, including a CPM vendor, could use to deliver an AI planning agent in Snowflake.", "related": ["Cortex Agents", "MCP server", "Streamlit in Snowflake"], "src": "https://docs.snowflake.com/en/release-notes/2026/other/2026-08-07-native-apps-agents-mcp-ga"}, {"term": "Snowflake Postgres", "aka": ["Postgres in Snowflake"], "category": "Snowflake", "technical": "Managed PostgreSQL instances that run inside Snowflake, GA February 24, 2026 in selected AWS and Azure regions, suited to transactional application state and write-back.", "sales": "A standard transactional database now available inside Snowflake. It gives builders a place to save plan inputs, but versions, workflow and calculations still have to be built around it.", "related": ["Hybrid Tables", "OLTP vs OLAP", "Lakebase"], "src": "https://docs.snowflake.com/en/release-notes/2026/other/2026-02-24-snowflake-postgres-ga"}, {"term": "Snowplan", "aka": ["Snowplan v2"], "category": "Snowflake", "technical": "Snowflake's internal long-range planning application for 40+ entities, built by its finance team on Snowflake, Streamlit and the CoCo coding agent, with write-back, versioned scenarios, role-based review and row-level controls. Described in a July 8, 2026 blog that discloses no team size or cost.", "sales": "Proof that a data platform company had to build its own planning app, with its own engineers, on its own platform. It shows planning on Snowflake is possible, and also that it is a custom software project.", "related": ["Streamlit in Snowflake", "Forward deployed engineering (FDE)", "Write-back"], "src": "https://www.snowflake.com/en/blog/fpa-ai-modernization-snowplan-v2/"}, {"term": "SOC 2", "aka": ["SOC 2 Type II", "SOC2"], "category": "General data", "technical": "An AICPA attestation framework in which an independent auditor reports on a service provider's controls for security, availability, processing integrity, confidentiality and privacy. A Type II report covers how those controls operated over a period.", "sales": "The security audit report enterprise buyers request from every SaaS vendor, and a homegrown build needs its own controls and evidence. Buyers will also ask which attestation covers Vena Omega, so confirm internally before answering, since Morpheo listed SOC2 as initiated before the acquisition.", "related": ["Morpheo", "Audit trail"], "src": ""}, {"term": "Spreading and breakback", "aka": ["spreading", "breakback", "top-down allocation", "rolldown"], "category": "Planning and FP&A", "technical": "Spreading pushes a value entered at a summary level down to lower-level members or periods by a method such as even, seasonal or prior-year pattern, while breakback adjusts the detail proportionally when a parent total is changed.", "sales": "Entering an annual number and having it fall into months, or changing a total and having the detail adjust automatically. Finance users expect this in any planning grid, and it is a significant build item on a data platform.", "related": ["Allocations", "Driver-based planning", "Write-back"], "src": ""}, {"term": "Star schema", "aka": ["fact and dimension tables", "snowflake schema"], "category": "General data", "technical": "A relational modeling pattern with a central fact table of numeric events joined to surrounding dimension tables, used by warehouses and by semantic layers such as semantic views and metric views.", "sales": "The standard layout for reporting data, with transactions in the middle and lookups like account and department around them. It works well for reporting actuals but does not handle versions, input or sign logic on its own.", "related": ["Dimension", "Measure", "Semantic layer", "OLAP cube"], "src": ""}, {"term": "Streamlit in Snowflake", "aka": ["Streamlit", "SiS"], "category": "Snowflake", "technical": "Snowflake's hosted Streamlit environment for building Python data apps with interactive inputs that run against Snowflake data. Cortex Agents APIs require its container runtime rather than the warehouse runtime.", "sales": "A quick way for developers to build simple web apps on Snowflake. Snowflake's own finance team used it as the input screen for its internal planning app, Snowplan.", "related": ["Snowplan", "Hybrid Tables", "Databricks Apps"], "src": "https://www.snowflake.com/en/blog/fpa-ai-modernization-snowplan-v2/"}, {"term": "Text-to-SQL", "aka": ["NL2SQL", "natural language query", "NLQ", "NL to MQL"], "category": "Data and AI", "technical": "Translating a natural-language question into a SQL query, usually guided by a semantic layer and verified examples, then running it and summarizing the result. Vena's Query Agent does the equivalent for Vena's MQL.", "sales": "Asking a question in plain English and getting the answer from the database. Accuracy figures come from vendors' own tests, such as Snowflake's 90%+ from 2024, so ask how it holds up on a full finance model with versions and hierarchies.", "related": ["Cortex Analyst", "Genie", "Verified queries", "Semantic layer", "Vena Planning, Query and Reporting agents"], "src": ""}, {"term": "Tokens and token pricing", "aka": ["tokens", "per-token pricing", "consumption pricing"], "category": "AI and agents", "technical": "Tokens are the chunks of text that models read and write, and many AI services bill per million input and output tokens. For example, Google's data agents cost $3 per million input and $20 per million output tokens once a free trial ends on December 31, 2026.", "sales": "The meter AI usage is billed on, similar to a utility bill. Pilot costs can look small, especially during free promotions, so model the run-rate cost of a full finance team using it every day.", "related": ["AI Credits", "Databricks Unit (DBU)", "Fabric capacity units", "Large language model (LLM)"], "src": ""}, {"term": "Tool calling", "aka": ["function calling", "tool use"], "category": "AI and agents", "technical": "The ability of an LLM to output a structured request to invoke a defined function, API or query with arguments, receive the result and continue reasoning.", "sales": "How an AI assistant takes action, such as running a report or saving a number, instead of only talking. The tools that are exposed define what the AI can and cannot change.", "related": ["Model Context Protocol (MCP)", "AI agent", "Guardrails"], "src": ""}, {"term": "Translytical task flows", "aka": ["Power BI write-back", "translytical"], "category": "Microsoft", "technical": "A GA Power BI capability that lets report users add, edit or delete data and call external APIs from a report, executed by Fabric user data functions against Fabric SQL databases, warehouses or lakehouse files.", "sales": "Buttons in a Power BI report that save changes back to the database. It is a general-purpose write-back building block, not a planning process with versions and approvals.", "related": ["User data functions", "Write-back", "Acterys"], "src": "https://learn.microsoft.com/en-us/power-bi/create-reports/translytical-task-flow-overview"}, {"term": "Unity Catalog", "aka": ["UC", "Databricks Unity Catalog"], "category": "Databricks", "technical": "Databricks' unified governance layer for data and AI assets, providing access control including ABAC, lineage, auditing, metric views and business semantics. At Data + AI Summit 2026 its Glossary was listed as preview coming soon and Domains as public preview.", "sales": "Databricks' central catalog and permission system. It governs who can read data and what it means, while plan input, approval and versioning sit outside its scope.", "related": ["Metric views", "ABAC", "Data catalog", "Genie Ontology"], "src": "https://www.databricks.com/blog/whats-new-unity-catalog-data-ai-summit-2026"}, {"term": "User data functions", "aka": ["UDF", "Fabric user data functions"], "category": "Microsoft", "technical": "Serverless Python functions in Fabric that read and write Fabric SQL databases, warehouses and lakehouse files and can be called from reports, pipelines, notebooks, Activator rules or REST.", "sales": "Small pieces of custom code that handle saving and logic behind Fabric apps. They are how a builder would let an AI agent write to Fabric, which is custom work.", "related": ["Translytical task flows", "Copilot Studio", "Write-back"], "src": "https://learn.microsoft.com/en-us/fabric/data-engineering/user-data-functions/user-data-functions-overview"}, {"term": "Variance analysis", "aka": ["budget vs actual", "BvA", "plan vs actual"], "category": "Planning and FP&A", "technical": "Comparing actuals with budget, forecast or prior periods across dimensions, quantifying the differences and attributing them to drivers such as price, volume or mix, usually with written commentary.", "sales": "Explaining why results differ from plan, the core monthly conversation in FP&A. AI can draft the analysis, but the commentary and decisions are exactly the history a cumulative context engine aims to keep.", "related": ["Versions", "Rolling forecast", "Cumulative context"], "src": ""}, {"term": "Vena Copilot", "aka": ["Vena AI", "Vena Copilot for Teams"], "category": "Vena", "technical": "Vena's AI assistant built on Microsoft Azure OpenAI and the CubeFLEX model, introduced in beta April 3, 2024, which inherits Vena data, application and individual permissions and hosts Vena's named agents. Vena Copilot for Microsoft Teams has been GA since May 15, 2025.", "sales": "Vena's built-in AI assistant for finance users, available inside Vena and Microsoft Teams. It respects existing permissions, and Vena states customer data is never used to train public AI models.", "related": ["Vena Planning, Query and Reporting agents", "CubeFLEX", "Microsoft Copilot"], "src": "https://www.venasolutions.com/vena-ai"}, {"term": "Vena MCP server", "aka": ["Vena MCP", "Vena Model Context Protocol server"], "category": "Vena", "technical": "Vena's MCP server, GA May 13, 2026, connects Claude, ChatGPT and Microsoft Copilot to live Vena data under each user's existing data and application permissions. Developer docs list read tools only, while release materials announce plan updates and write-back.", "sales": "Lets a customer's preferred AI assistant work with live Vena data. Say read access is documented and write-back is announced until the developer docs change.", "related": ["Model Context Protocol (MCP)", "MCP server", "Microsoft Copilot"], "src": "https://developers.venasolutions.com/docs/mcp-overview"}, {"term": "Vena Omega", "aka": ["Omega", "cumulative context engine"], "category": "Vena", "technical": "Vena's announced cumulative context engine for finance, intended to combine governed data with definitions, assumptions, drivers, calculations, approvals, relationships and historical decisions so AI context compounds across planning cycles. Vena has published no GA date, pricing or architecture.", "sales": "Vena's direction for AI that remembers how a specific finance team plans and decides. Present it as announced roadmap and lead with Vena's GA agents, MCP server and planning platform.", "related": ["Cumulative context", "Morpheo", "Vena Copilot", "Context layer"], "src": "https://www.venasolutions.com/newsroom/vena-to-acquire-morpheo-ai"}, {"term": "Vena Planning, Query and Reporting agents", "aka": ["Planning Agent", "Query Agent", "Reporting Agent", "Analytics Agent", "Scenario Agent"], "category": "Vena", "technical": "Named Vena Copilot agents, with the Planning Agent (GA May 13, 2026) generating forecasts, updating plans and applying scenario logic in natural language, the Query Agent (GA, Spring 2026) turning plain English into MQL, and the Reporting Agent (GA) working in the Ad Hoc tool. A Scenario Agent is listed as coming soon.", "sales": "Vena's shipped AI agents that answer questions and, in the Planning Agent's case, update plans inside governed workflows. That is a key contrast with data platform agents, which are read-only.", "related": ["Vena Copilot", "Text-to-SQL", "Scenarios", "AI agent"], "src": "https://www.venasolutions.com/product-release/fy27/spring/partner"}, {"term": "Verified queries", "aka": ["golden queries", "verified answers", "example queries"], "category": "Data and AI", "technical": "Human-approved question and SQL pairs stored with a semantic model and reused when a matching question arrives, either executed directly or supplied to the model as examples. Snowflake and BigQuery call them verified queries, Looker calls them golden queries.", "sales": "Pre-approved answers to common questions, like EBITDA by quarter, that the AI reuses instead of improvising. They raise trust, but someone has to review and maintain them.", "related": ["Text-to-SQL", "Cortex Analyst", "Conversational Analytics API", "Grounding"], "src": ""}, {"term": "Versions", "aka": ["plan versions", "version dimension", "Budget v1", "Forecast 3+9"], "category": "Planning and FP&A", "technical": "Distinct, persistent copies of plan data such as Budget, Forecast 3+9 or Actuals, held in a version dimension with lifecycle states like open, locked and archived so they can be compared and promoted.", "sales": "Keeping Budget, each forecast and actuals side by side without overwriting each other. Database branching, such as Lakebase's, is not the same thing, because finance versions need business rules, locking and comparison.", "related": ["Scenarios", "Period locking", "Variance analysis", "Lakebase"], "src": ""}, {"term": "Workflow and approvals", "aka": ["planning workflow", "budget calendar", "submission and approval"], "category": "Planning and FP&A", "technical": "Process orchestration for planning cycles, including a budget calendar, task assignment, submission, review, rejection and approval routing, notifications and status tracking for each contributor.", "sales": "Making sure every department submits on time and the right people sign off. Snowflake's Multi-Party Approval and Databricks' Lakeflow Jobs sound similar but are admin and data controls, not budget workflows.", "related": ["Period locking", "Audit trail", "Agentic workflow"], "src": ""}, {"term": "Write-back", "aka": ["writeback", "data entry", "plan input"], "category": "Planning and FP&A", "technical": "Saving user- or system-entered values, such as budget inputs or forecast changes, back into the model's storage so they are immediately available to calculations, reports and other users.", "sales": "Typing a number into the plan and having it saved where everyone can use it. On data platforms this usually means custom development, for example Databricks' Excel add-in only overwrites whole tables, while Vena writes back natively from Excel.", "related": ["Versions", "Cell-level security", "Translytical task flows", "Hybrid Tables"], "src": ""}, {"term": "Zero-copy", "aka": ["zero-copy integration", "data in place", "no-copy access"], "category": "General data", "technical": "An integration approach where a consuming system queries data in place through sharing protocols, shortcuts or federation instead of physically replicating it, so one governed copy remains. Some features sold as zero-copy, such as Fabric mirroring, still maintain a managed replica.", "sales": "Using data where it already lives instead of copying it into another system. Vendors use the term loosely, so ask whether a tool truly reads in place or quietly copies data behind the scenes.", "related": ["Data sharing", "OpenSharing", "OneLake", "SAP Business Data Cloud"], "src": "https://www.snowflake.com/en/product/features/zero-copy-integrations/"}]</script>

   ['Situation','Understand the build',['"Walk me through how you\'d set it up."','"What tool does the heavy lifting?"','"Who maintains it after go-live?"'],'Heard, not sold to'],
   ['Last mile','Surface the gaps',Object.keys(GAPS).filter(g=>!gaps.includes(g)&&['g1','g2','g3'].includes(g)).map(g=>GAPS[g][1]),'Slight doubt they found on their own'],
   ['Cost of the build','Put a price on it',['"Who\'s on this and for how long?"','"Which close will run on it first?"',...(gaps.includes('g4')?[]:[GAPS.g4[1]]),'"What are you not doing while you build this?"'],'The build isn\'t free'],

   ['Outcome','Agree the future state',['"If this worked perfectly in 12 months, what would be different?"','"Who else would benefit beyond finance?"'],'Ambition'],

  return {persona,believe,truth,play,tone,pkg,pkgWhy,people,funnel,actions,words};

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build vs Buy Navigator</title>
<meta name="description" content="Guided build-vs-buy funnel for Vena reps: persona, questions, who to bring in, and the Omega path.">
<style>html{color-scheme:light dark}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one narrow rail of steps (guided funnel) that resolves into a result sheet; a second view is the full reference. Vena green as the single accent. */
:root{
  --bg:#F5F7F5; --surface:#FFFFFF; --surface2:#EDF3EE; --fg:#1E2B24; --muted:#6B746E; --line:#D8E0DA;
  --accent:#4A9462; --accent-deep:#2F5E41; --accent-soft:#DDEDE1; --ink-on-accent:#FFFFFF;
  --warn:#B8542F; --warn-soft:#F6E6DF; --info:#3A6EA5; --info-soft:#E3ECF6; --amber:#8A6100; --amber-soft:#F7EBCB; --grey-soft:#ECEFED;
  --display:"Manrope",system-ui,sans-serif; --body:"Public Sans",system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,40,28,.06),0 8px 24px rgba(20,40,28,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121A15; --surface:#1A241E; --surface2:#213028; --fg:#E8EFEA; --muted:#98A59D; --line:#2E3D34;
  --accent:#6FB886; --accent-deep:#A8DB8A; --accent-soft:#24402E; --ink-on-accent:#0F1A13;
  --warn:#E48B66; --warn-soft:#3C271E; --info:#8FB4E0; --info-soft:#1F2E40; --amber:#E8C46A; --amber-soft:#3A3018; --grey-soft:#26302A; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A15; --surface:#1A241E; --surface2:#213028; --fg:#E8EFEA; --muted:#98A59D; --line:#2E3D34;
  --accent:#6FB886; --accent-deep:#A8DB8A; --accent-soft:#24402E; --ink-on-accent:#0F1A13;
  --warn:#E48B66; --warn-soft:#3C271E; --info:#8FB4E0; --info-soft:#1F2E40; --amber:#E8C46A; --amber-soft:#3A3018; --grey-soft:#26302A; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
h2{font-size:20px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
header .lead{max-width:60ch;margin-top:8px;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface2);padding:4px;border-radius:18px;max-width:100%}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 13px var(--display);padding:8px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.tabs button:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* progress */
.progress{display:flex;gap:6px;margin-bottom:20px}
.progress span{flex:1;height:5px;border-radius:99px;background:var(--line)}
.progress span.done{background:var(--accent)}
.progress span.cur{background:var(--accent);opacity:.55}

/* step card */
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--shadow)}
.step .q{font-family:var(--display);font-size:22px;font-weight:700;margin:6px 0 4px;text-wrap:balance}
.step .why{color:var(--muted);max-width:62ch;margin-bottom:18px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;color:var(--fg);font:inherit;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .ic{flex:none;width:36px;height:36px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--accent-deep)}
.opt[aria-pressed="true"] .ic{background:var(--accent);color:var(--ink-on-accent)}
.opt b{display:block;font-family:var(--display);font-weight:700}
.opt small{display:block;color:var(--muted);font-size:13px;line-height:1.4;margin-top:2px}
.ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;align-items:center}
.btn{border:0;border-radius:10px;padding:11px 18px;font:700 14px var(--display);cursor:pointer;background:var(--accent);color:var(--ink-on-accent)}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:13px;color:var(--muted)}
.tip{display:flex;gap:10px;background:var(--info-soft);color:var(--fg);border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:16px}
.tip svg{flex:none;width:18px;height:18px;stroke:var(--info);fill:none;stroke-width:2;margin-top:2px}

/* result */
.result{display:grid;gap:18px}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.card.accent{background:var(--accent-deep);color:#fff;border-color:transparent}
:root[data-theme="dark"] .card.accent,:root:not([data-theme="light"]) .card.accent{color:var(--fg)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .card.accent{color:#fff}}
:root[data-theme="light"] .card.accent{color:#fff}
.card.accent .eyebrow{color:inherit;opacity:.8}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font:600 12px var(--display);background:var(--accent-soft);color:var(--accent-deep)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
.funnel{display:grid;gap:10px}
.rung{display:grid;grid-template-columns:38px 1fr;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
.rung .n{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--ink-on-accent);display:grid;place-items:center;font:700 13px var(--display)}
.rung h3{margin-bottom:6px}
.rung ul{margin:0;padding-left:18px;font-size:14px}
.rung li{margin:3px 0}
.vof{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vof span{font-size:12px;border-radius:6px;padding:3px 8px;background:var(--surface2)}
.vof span b{color:var(--accent-deep);font-weight:700}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-child{border-top:0}
.row b{font-family:var(--display)}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.people{display:grid;gap:10px}
.person{display:flex;gap:12px;align-items:center}
.person .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-deep);font:800 13px var(--display);flex:none}
.actions .row{grid-template-columns:120px 1fr}
@media(max-width:560px){.actions .row{grid-template-columns:1fr}}
.copybar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
textarea#summary{width:100%;min-height:140px;border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--fg);resize:vertical}

/* reference */
.ref{display:grid;gap:22px}
.ref section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.ref h2{margin-bottom:6px}
.ref .sub{color:var(--muted);margin-bottom:14px;max-width:70ch}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-top:1px solid var(--line)}
th{font-family:var(--display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
td:first-child{font-weight:600}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:720px){.flow{grid-template-columns:1fr}}
.flow .f{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative}
.flow .f .n{font:800 28px var(--display);color:var(--accent);line-height:1}
.flow .f h3{margin:6px 0 4px}
.ladder{display:grid;gap:8px}
.ladder .l{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.ladder .l .n{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--ink-on-accent);display:grid;place-items:center;font:700 12px var(--display)}
.ladder .l small{display:block;color:var(--muted)}
.pkgs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:720px){.pkgs{grid-template-columns:1fr}}
.pkg{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg)}
.pkg.dark{background:var(--accent-deep);color:#fff;border-color:transparent}
.pkg h3{font-size:17px}
.pkg p{font-size:13.5px;margin-top:6px}
.pkg .who{margin-top:10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
@media (prefers-reduced-motion:no-preference){.step,.card{animation:in .25s ease-out}}
@keyframes in{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ---------- Compare + Glossary ---------- */
.cmp{display:grid;gap:18px}
.banner{background:var(--warn-soft);border-radius:var(--r);padding:16px 18px}
.banner summary{cursor:pointer;font:700 14px var(--display);color:var(--warn);list-style:none;display:flex;gap:8px;align-items:center}
.banner summary::-webkit-details-marker{display:none}
.banner summary::after{content:"Show";margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.banner[open] summary::after{content:"Hide"}
.banner ul{margin:10px 0 0;padding-left:18px;font-size:14px}
.banner li{margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 14px;font:600 13px var(--display);cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ink-on-accent)}
.chip small{font-weight:500;opacity:.75;margin-left:4px}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:12.5px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.rt{display:inline-flex;align-items:center;justify-content:center;border-radius:6px;padding:2px 8px;font:700 11.5px var(--display);white-space:nowrap;letter-spacing:.01em}
.rt.strong{background:var(--accent-soft);color:var(--accent-deep)}
.rt.partial{background:var(--amber-soft);color:var(--amber)}
.rt.gap{background:var(--warn-soft);color:var(--warn)}
.rt.nd{background:var(--grey-soft);color:var(--muted)}
.rt.info{background:var(--info-soft);color:var(--info)}
.st{font:600 10.5px var(--display);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-left:6px;white-space:nowrap}
.srcs{white-space:nowrap}
.srcs a{font-size:11px;color:var(--info);text-decoration:none;margin-left:2px;vertical-align:super}
.srcs a:hover{text-decoration:underline}
.h2h-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}
@media(max-width:720px){.h2h-head{grid-template-columns:1fr}}
.score{display:flex;gap:10px;flex-wrap:wrap}
.score .s{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:center;min-width:96px}
.score .s b{display:block;font:800 20px var(--display)}
.score .s small{font-size:11.5px;color:var(--muted)}
.mtx{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.mtx table{min-width:720px}
.mtx th,.mtx td{border-top:1px solid var(--line)}
.mtx thead th{position:sticky;top:0;background:var(--surface);z-index:1}
.mtx tr.cat td{background:var(--surface2);font:700 12px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-deep);border-top:0}
.mtx td.crit{font-weight:600;min-width:170px}
.mtx td.crit small{display:block;font-weight:400;color:var(--muted);font-size:12px;line-height:1.35;margin-top:2px}
.mtx td.cell{min-width:220px}
.mtx td.cell p{font-size:13px;margin-top:4px;line-height:1.4}
.mtx.master td.cell{min-width:0;text-align:center;padding:6px}
.mtx.master td.cell button{border:0;background:transparent;cursor:pointer;padding:2px}
.mtx.master td.cell button:focus-visible{outline:2px solid var(--accent);border-radius:6px}
.mtx.master th.pv{text-align:center;min-width:92px}
.mtx.master th.pv button{border:0;background:transparent;font:700 12px var(--display);color:var(--fg);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line)}
.mtx.master th.pv.vena,.mtx.master td.vena{background:var(--accent-soft)}
.cellpop{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;box-shadow:var(--shadow)}
.ll{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:720px){.ll{grid-template-columns:1fr}}
.ll ul,.cmp ul.plain{margin:0;padding-left:18px;font-size:14px}
.ll li,.cmp ul.plain li{margin:7px 0}
.card.lead-c{border-top:0;background:var(--accent-soft)}
.card.lag-c{background:var(--amber-soft)}
.talk{display:grid;gap:8px}
.talk div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.tools td:first-child{white-space:nowrap}
.tools td{font-size:13.5px}
.tools a{color:var(--info)}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px}
details.more summary{cursor:pointer;font:700 16px var(--display)}
details.more[open] summary{margin-bottom:12px}
details.more ol{font-size:13px;padding-left:22px;margin:0;columns:2;column-gap:28px}
@media(max-width:720px){details.more ol{columns:1}}
details.more ol li{break-inside:avoid;margin:3px 0}
details.more ol a{color:var(--info);word-break:break-word}
/* glossary */
.gl-tools{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
@media(max-width:720px){.gl-tools{position:static}}
.gl-search{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.gl-search input{flex:1;min-width:220px;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;font:15px var(--body);background:var(--bg);color:var(--fg)}
.gl-search input:focus{outline:none;border-color:var(--accent)}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 12.5px var(--display);padding:7px 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.gl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;margin-top:16px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;align-content:start;min-width:0}
.term.flash{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.term h3{font-size:17px}
.term .aka{font-size:12.5px;color:var(--muted)}
.term .def{font-size:14px}
.term .def b{display:block;font:700 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.term .def.sales b{color:var(--accent)}
.term .rel{display:flex;flex-wrap:wrap;gap:5px}
.term .rel button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:3px 9px;font:600 12px var(--display);cursor:pointer}
.term .rel button:hover{border-color:var(--accent)}
.term .foot{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px}
.term .foot a{color:var(--info)}
.empty{padding:30px;text-align:center;color:var(--muted)}

</style>
</head>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Vena sales cheat sheet</div>
      <h1>Build vs Buy Navigator</h1>
      <p class="lead">When a prospect says they can build planning themselves, answer five questions and get the persona, the questions to ask, who to bring in, and the Omega path to lead them to.</p>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-view="guide" id="tab-guide">Guided funnel</button>
      <button role="tab" aria-selected="false" data-view="ref" id="tab-ref">Full reference</button>
      <button role="tab" aria-selected="false" data-view="compare" id="tab-compare">Compare platforms</button>
      <button role="tab" aria-selected="false" data-view="glossary" id="tab-glossary">Glossary</button>
    </div>
  </header>

  <div id="view-guide">
    <div class="progress" id="progress"></div>
    <div id="stepHost"></div>

  <div id="view-glossary" hidden></div>

://atlan.com/know/snowflake/summit-2026-announcements/"]}}, "leads": [{"text": "Snowflake has no native planning product. Snowplan, its internal planning app for 40+ entities, needed a custom Streamlit interface, write-back, versioned scenarios, review and approval, and row-level controls.", "src": ["https://www.snowflake.com/en/blog/fpa-ai-modernization-snowplan-v2/"]}, {"text": "Snowflake points customers to Forward Deployed Finance Specialists rather than a product, and its SVP of Finance concedes not every finance team has engineers inside the function.", "src": ["https://www.snowflake.com/en/blog/fpa-ai-modernization-snowplan-v2/", "https://www.snowflake.com/en/blog/cortex-code-fpa-real-time-insight/"]}, {"text": "Vena ships versions, approvals, consolidation, audit history and Excel write-back as product.", "src": ["https://www.venasolutions.com/newsroom/vena-launches-advanced-financial-consolidation-solution", "https://barc.com/review/vena/"]}, {"text": "Vena's Planning Agent writes plans inside governed workflows, while Snowflake agents write only through procedures a developer builds.", "src": ["https://www.venasolutions.com/newsroom/vena-announces-financial-consolidation-and-ai-innovations-at-excelerate-2026", "https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents"]}, {"text": "Snowflake's Multi-Party Approval is a governance four-eyes control, not a budget submission workflow.", "src": ["https://www.recordlydata.com/blog/a-curated-list-of-new-snowflake-features-released-at-snowflake-summit-2026"]}, {"text": "Snowflake's Excel Extension is GA soon with no write-back shown, while Vena is native Excel.", "src": ["https://www.snowflake.com/en/news/press-releases/snowflake-cowork-powers-the-agentic-enterprise-as-the-personal-agent-for-knowledge-workers-to-work-smarter/", "https://barc.com/review/vena/"]}], "lags": [{"text": "Snowflake's learning loop is real and shipping. Verified-query suggestions and Autopilot propose updates that humans certify, and Vena has nothing equivalent documented.", "src": ["https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-analyst/verified-query-suggestions", "https://www.snowflake.com/en/blog/semantic-view-autopilot/"]}, {"text": "Snowflake ships per-user CoWork memory while Omega is announced.", "src": ["https://docs.snowflake.com/en/user-guide/snowflake-cortex/snowflake-cowork", "https://www.venasolutions.com/newsroom/vena-completes-acquisition-of-morpheo-ai"]}, {"text": "Snowflake leads on agent orchestration and MCP breadth.", "src": ["https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents", "https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents-mcp"]}, {"text": "Snowflake wins on data gravity, with zero-copy SAP and Salesforce GA and Workday in private preview.", "src": ["https://www.snowflake.com/en/product/features/zero-copy-integrations/"]}, {"text": "Parity on semantic layer and natural language query. Vena is finance-specific, Snowflake broader. Neither side has independent accuracy figures.", "src": ["https://docs.snowflake.com/en/release-notes/2025/9_25", "https://www.snowflake.com/en/engineering-blog/cortex-analyst-text-to-sql-accuracy-bi/", "https://www.venasolutions.com/product-release/fy27/spring/partner"]}], "build": ["Planning data model with versions, scenarios and hierarchy rollups", "Grid or Excel input layer with validation and locking", "Calculation engine for drivers, allocations, FX and consolidation", "Submission and approval workflow", "Intersection-level write security (row and column policies govern reads)", "Plan-change audit trail (one secondary source says Hybrid Tables lack Time Travel)", "Planning-aware semantics for the agent"], "talkTrack": ["Snowflake is an excellent place to keep and query finance data, and its AI on top of that data is moving fast.", "What Snowflake does not sell is a planning application. Its own finance team had to build one on Streamlit, and Snowflake sends customers s/en/integrations/excel-write-back"]}, {"text": "Databricks positions itself as the foundation under finance, and its planning accelerator pairs the lakehouse and Genie with BOARD for plan versions and scenarios.", "src": ["https://www.databricks.com/blog/beyond-spreadsheet-how-databricks-delivering-modern-cfo-financial-services", "https://www.databricks.com/blog/foundational-context-cross-industry-function-specific-accelerators-lakebase"]}, {"text": "Established planning vendors connect to Databricks one way. Pigment is import-only with no write-back and Anaplan uses a read pipeline.", "src": ["https://kb.pigment.com/docs/connect-pigment-with-databricks", "https://help.anaplan.com/import-data-from-databricks-6db47b71-cf74-48ac-a2e0-2ba3d996b1e7"]}, {"text": "Vena's MCP Server is GA while Databricks' managed MCP servers are public preview.", "src": ["https://www.venasolutions.com/newsroom/vena-announces-financial-consolidation-and-ai-innovations-at-excelerate-2026", "https://docs.databricks.com/gcp/en/agents/mcp-tools/managed-mcp"]}, {"text": "Vena's Planning Agent writes plans today, while Genie is read-only and MCP writes are Beta.", "src": ["https://www.venasolutions.com/newsroom/vena-announces-financial-consolidation-and-ai-innovations-at-excelerate-2026", "https://learn.microsoft.com/en-us/azure/databricks/genie-agents/concepts", "https://docs.databricks.com/aws/en/ai-bi/release-notes/2026"]}], "lags": [{"text": "Genie Ontology is the most direct competitor to the context-accumulates-with-use story, framed as model the head and learn the tail.", "src": ["https://docs.databricks.com/aws/en/genie/genie-ontology", "https://www.databricks.com/blog/data-ontology-defined-context-layer-your-ai-agents-are-missing"]}, {"text": "Databricks publishes internal accuracy claims, such as 32% to over 90% on an internal benchmark, which no Vena figure matches, though none are independent.", "src": ["https://www.databricks.com/blog/pushing-frontier-data-agents-genie"]}, {"text": "Databricks leads on orchestration with the GA Supervisor Agent.", "src": ["https://www.databricks.com/blog/agent-bricks-supervisor-agent-now-ga-orchestrate-enterprise-agents"]}, {"text": "Databricks leads on data in place through OpenSharing.", "src": ["https://www.databricks.com/company/newsroom/press-releases/databricks-announces-opensharing"]}, {"text": "Pilot economics favor Databricks. Genie usage by human users is free through January 31, 2027.", "src": ["https://learn.microsoft.com/en-us/azure/databricks/genie/monitor-cost"]}, {"text": "Its learning is still curated. Genie Ontology learns from analytics artifacts, not planning events, and agent behavior does not change on user feedback alone.", "src": ["https://docs.databricks.com/aws/en/genie/genie-ontology", "https://docs.databricks.com/aws/en/genie-agents/monitor"]}], "build": ["Dimensional planning model with sign logic and version dimensions", "Input layer with intersection-level saves (the Excel add-in only overwrites tables)", "Version manager (Lakebase branching is a database feature, not business versioning)", "Calculation engine for drivers, spreading, allocations and consolidation", "Business-user approval workflow", "Intersection-level write security (ABAC governs reads)", "Finance-owned administration", "Agents that can write plans"], "talkTrack": ["Databricks is building one of the best AI analytics layers on top of finance data, and Genie Ontology is a smart way to learn business context from how people use data.", "But Genie only reads, and Databricks' own finance accelerator brings in BOARD for budgets and scenarios.", "If you want plans, approvals and consolidation, you either build a CPM product on Lakebase or you buy one. Vena is the one your finance team can run without engineers.", "Do not claim Omega runs on Databricks until Vena announces it."]}, {"id": "fabric", "name": "Microsoft Fabric (Fabric IQ and Fabric Planning)", "short": "Microsoft Fabric", "headline": "vs Microsoft Fabric eters from Aug 1, 2026", "src": ["https://learn.microsoft.com/en-us/fabric/iq/plan/overview", "https://community.fabric.microsoft.com/blog/fbc_fabricupdatesblogs/bring-enterprise-planning-to-the-ai-era-with-planning-in-microsoft-fabric-iq/5326315"]}, "maturity": {"r": "info", "status": "", "note": "Planning GA mid-2026; Ontology Preview", "src": ["https://learn.microsoft.com/en-us/fabric/iq/plan/overview", "https://learn.microsoft.com/en-us/fabric/iq/ontology/overview"]}}, "leads": [{"text": "Allocations and financial consolidation do not appear in the Planning pages reviewed, and AI agents for mid-cycle course correction are a roadmap item.", "src": ["https://community.fabric.microsoft.com/blog/fbc_fabricupdatesblogs/bring-enterprise-planning-to-the-ai-era-with-planning-in-microsoft-fabric-iq/5326315"]}, {"text": "Vena's consolidation shipped GA on August 26, 2026 and its Planning Agent went GA on May 13, 2026.", "src": ["https://www.venasolutions.com/newsroom/vena-launches-advanced-financial-consolidation-solution", "https://www.venasolutions.com/newsroom/vena-announces-financial-consolidation-and-ai-innovations-at-excelerate-2026"]}, {"text": "Planning write-back goes only to Fabric SQL and does not update the connected semantic model, each plan item is tied to one semantic model, users without an RLS role see union of all role data, and write-back caps at 1.2 million cells.", "src": ["https://learn.microsoft.com/en-us/fabric/iq/plan/overview-limitations"]}, {"text": "Data agents are capped at 25 rows by 25 columns per answer, cannot write, and are English only, which matters for bilingual Canadian finance teams.", "src": ["https://learn.microsoft.com/en-us/fabric/data-science/concept-data-agent"]}, {"text": "Vena runs in native Excel, while Planning offers an Excel-like web grid with import and export and no documented Excel add-in.", "src": ["https://community.fabric.microsoft.com/blog/fbc_fabricupdatesblogs/bring-enterprise-planning-to-the-ai-era-with-planning-in-microsoft-fabric-iq/5326315", "https://barc.com/review/vena/"]}, {"text": "Vena already works in Microsoft surfaces, with Vena Copilot for Teams GA since May 15, 2025 and the MCP Server supporting Microsoft Copilot as a client.", "src": ["https://www.venasolutions.com/newsroom/vena-sets-new-standard-in-agentic-ai-for-fpa-with-microsoft-teams-integration", "https://www.venasolutions.com/newsroom/vena-announces-financial-consolidation-and-ai-innovations-at-excelerate-2026"]}], "lags": [{"text": "Microsoft wins on procurement. Planning, Copilot and data agents draw on Fabric capacity a customer may already own, with reservations saving about 41% over pay-as-you-go.", "src": ["https://learn.microsoft.com/en-us/fabric/fundamentals/copilot-fabric-overview", "https://learn.microsoft.com/en-us/fabric/iq/plan/overview", "https://azure.microsoft.com/en-us/pricing/details/microsoft-fabric/"]}, {"text": "Microsoft is at parity on core planning mechanics, with scenarios, what-if, write-back, multi-level approvals with change history, and Teams integration.", "src": ["https://learn.microsoft.com/en-us/fabric/iq/plan/overview", "https://community.fabric.microsoft.com/blog/fbc_fabricupdatesblogs/bring-enterprise-planning-to-the-ai-era-with-planning-in-microsoft-fabric-iq/5326315", "https://learn.microsoft.com/en-us/fabric/iq/plan/planning-concept-writeback"]}, {"text": "Microsoft leads on data access, with zero-copy planning on Power BI semantic models and OneLake shortcuts.", "src": ["https://lumel.com/newsroom/lumel-microsoft-strategic-first-party-alliance-fabric-planning/"]}, {"text": "Fabric Planning overlaps Acterys directly, since Acterys pitches Power BI and Fabric write-back planning.", "src": ["https://www.venasolutions.com/newsroom/vena-completes-acterys-acquisition"]}, {"text": "Microsoft's first-party planning partner is Lumel, not Vena. This research could not confirm whether Acterys or Vena ships as a native Fabric workload.", "src": ["https://lumel.com/newsroom/lumel-microsoft-strategic-first-party-alliance-fabric-planning/", "https://azure.microsoft.com/en-us/blog/fabcon-and-sqlcon-2026-unifying-databases-and-fabric-on-a-single-data-platform/"]}, {"text": "Governance through Purview DLP, audit and eDiscovery applies to data agents.", "src": ["https://learn.microsoft.com/en-us/fabric/data-science/concept-data-agent"]}], "build": ["Cumulative memory and learning layer (nothing native does this)", "Consolidation and allocations", "Multi-model driver plans", "Agents in Foundry or Copilot Studio that read through data agents and write through user data functions or Planning APIs", "Budget-calendar process orchestration", "Excel-native experience", "Workarounds for the agent row cap, English-only agents and RLS behavior"], "talkTrack": ["Fabric Planning is a solid budgeting grid on your Power BI models, and it bills on capacity you already own.", "Before you standardize on it, ask three questions. Where does consolidation happen, with eliminations and FX? Will your team work in a web grid or in Excel? What does the AI actually do in the plan today?", "Microsoft lists agentic planning as roadmap, while Vena's Planning Agent is GA.", "Vena runs on the same Microsoft stack, in Excel, in Power BI through Acterys, and in Teams and Copilot through MCP."]}, {"id": "google", "name": "Google Cloud (BigQuery and Looker)", "short": "Google", "headline": "vs BigQuery and Looker Conversational Analytics", "summary": "Google ships a mature semantic layer in LookML, GA conversational analytics (June 23, 2026), a GA BigQuery MCP server and the broadest shipped forecasting toolkit in this comparison. Its data agents are read-only, and corporate FP&A on Google Cloud runs through partner planning tools such as Pigment and Anaplan.", "tools": [{"name": "LookML", "what": "Looker semantic layer", "mapsTo": "Semantic layer (CubeFLEX finance cube)", "status": "GA", "date": "", "url": "https://docs.cloud.google.com/looker/docs/conversational-analytics-o A on Google runs through partners.", "src": ["https://www.pigment.com/newsroom/pigment-partners-with-google-cloud-to-accelerate-ai-led-business-planning", "https://cloud.google.com/blog/topics/partners/anaplan-cloudworks-integrates-with-google-cloud"]}, {"text": "The only documented Looker to BigQuery write-back is a reference implementation that only appends rows.", "src": ["https://docs.cloud.google.com/looker/docs/best-practices/bigquery-writeback-actions"]}, {"text": "Versions, approval workflows, allocations, consolidation, cell-level input security and plan audit are absent from the pages reviewed.", "src": ["https://docs.cloud.google.com/looker/docs/best-practices/bigquery-writeback-actions"]}, {"text": "Google's data agents are read-only while Vena's Planning Agent updates plans.", "src": ["https://docs.cloud.google.com/bigquery/docs/conversational-analytics", "https://www.venasolutions.com/newsroom/vena-announces-financial-consolidation-and-ai-innovations-at-excelerate-2026"]}, {"text": "Data agent tokens are free until December 31, 2026, so pilot costs measured today understate run-rate cost.", "src": ["https://cloud.google.com/products/data-agents/pricing"]}], "lags": [{"text": "Google has the broadest shipped forecasting toolkit, with AI.FORECAST GA since September 30, 2025, TimesFM in Connected Sheets and AI.KEY_DRIVERS GA September 29, 2026.", "src": ["https://cloud.google.com/blog/products/data-analytics/ai-based-forecasting-and-analytics-in-bigquery-via-mcp-and-adk", "https://docs.cloud.google.com/bigquery/docs/release-notes"]}, {"text": "Memory Bank is a GA cross-session memory service, though it is user-scoped rather than shared organizational memory.", "src": ["https://docs.cloud.google.com/agent-builder/agent-engine/memory-bank/overview?hl=en"]}, {"text": "Google leads on agent orchestration with ADK, Agent Runtime and A2A.", "src": ["https://cloud.google.com/blog/topics/google-cloud-next/google-cloud-next-2026-wrap-up", "https://thenewstack.io/google-donates-the-agent2agent-protocol-to-the-linux-foundation/"]}, {"text": "Google claims Looker's semantic layer reduces gen AI query errors by as much as two thirds in internal testing, while a third party calls its business context relatively weak.", "src": ["https://cloud.google.com/blog/products/business-intelligence/how-lookers-semantic-layer-enhances-gen-ai-trustworthiness", "https://blog.rittmananalytics.com/google-next-2026-whats-new-for-looker-bigquery-data-platforms-and-agentic-analytics-732cb3c1aa1b"]}, {"text": "Parity on semantic layer, natural language query and MCP.", "src": ["https://docs.cloud.google.com/looker/docs/conversational-analytics-overview", "https://docs.cloud.google.com/bigquery/docs/release-notes"]}], "build": ["Multidimensional planning model in BigQuery or AlloyDB/Spanner", "Grid or Sheets input app with transactional writes", "Versions and scenarios", "Calculation engine for drivers, allocations, spreading and consolidation", "Submission and approval workflow", "Intersection-level write entitlements (row and column policies govern reads)", "Plan-cell audit trail", "Finance context capture into Memory Bank or tables", "ADK agents with human approval before writes"], "talkTrack": ["Google gives you excellent forecasting functions and a mature semantic layer in Looker, and it is fair to use them for analysis.", "But Google's agents are read-only, and corporate FP&A on Google Cloud runs through partner planning tools.", "Vena is that planning layer, with GA agents that write into governed plans and Excel as the front end your team already uses.", "Confirm Vena's BigQuery integration path internally before promising it."]}, {"id": "aws", "name": "AWS (Amazon Quick, Bedrock AgentCore, SageMaker Catalog)", "short": "AWS", "headline": "vs AWS (Amazon Quick, Bedrock AgentCore, SageMaker Catalog)", "summary": "AWS is a kit of separate services rather than an integrated context layer. AgentCore Memory is the most productized generic agent me  "Ontology-centered platform", "src": ["https://www.palantir.com/docs/foundry/aip/overview"]}, "governance": {"r": "strong", "status": "", "note": "Permissions, action logs", "src": ["https://www.palantir.com/docs/foundry/action-types/overview", "https://www.palantir.com/docs/foundry/ontology-mcp/overview"]}, "published_limits": {"r": "nd", "status": "", "note": "Not documented", "src": []}, "components_to_build": {"r": "gap", "status": "", "note": "Model planning on Ontology", "src": ["https://www.palantir.com/docs/foundry/action-types/overview"]}, "pricing": {"r": "info", "status": "", "note": "Compute-seconds, contract terms", "src": ["https://www.palantir.com/docs/foundry/aip/aip-compute-usage"]}, "maturity": {"r": "info", "status": "", "note": "Documented; GA dates not sourced", "src": ["https://www.palantir.com/docs/foundry/aip/overview"]}}, "leads": [{"text": "Palantir ships no packaged FP&A semantics. Versions, spreading, allocations, rollups, consolidation and an Excel front end would all have to be engineered on the Ontology.", "src": ["https://www.palantir.com/docs/foundry/action-types/overview"]}, {"text": "Finance examples found are government-oriented, and no commercial FP&A planning reference on Foundry was found.", "src": ["https://blog.pvmit.com/pvm-blog/palantir-foundry-demo-financial-management"]}, {"text": "Vena ships native Excel, while Palantir's Excel interface is not documented.", "src": ["https://barc.com/review/vena/"]}], "lags": [{"text": "Palantir is the closest analogue to context layer plus orchestrated actions, with governed transactional write-back and audit documented today.", "src": ["https://www.palantir.com/docs/foundry/action-types/overview"]}, {"text": "External-agent writes through Ontology MCP are documented, while Vena's MCP write-back is not in its docs.", "src": ["https://www.palantir.com/docs/foundry/ontology-mcp/overview", "https://developers.venasolutions.com/docs/mcp-overview"]}, {"text": "Palantir leads on agent orchestration with AIP Logic and pro-code agents.", "src": ["https://www.palantir.com/docs/foundry/aip/aip-features", "https://www.palantir.com/docs/foundry/agents/overview"]}, {"text": "Parity on audit, with Palantir action logs against Vena audit history.", "src": ["https://www.palantir.com/docs/foundry/action-types/overview", "https://www.venasolutions.com/newsroom/vena-launches-advanced-financial-consolidation-solution"]}], "build": ["FP&A ontology (accounts, entities, versions, scenarios)", "Planning calculations in functions or AIP Logic", "Input grids and approval gates in Workshop and actions", "Excel interface", "Agent memory pattern"], "talkTrack": ["Palantir gives you a powerful, governed foundation, and it can absolutely power bespoke decision apps.", "For FP&A, though, you would be designing the planning model, the calculations, the approvals and the Excel experience yourself.", "Vena ships that as product, and the two can coexist.", "Treat any claim that Omega could read the Palantir Ontology through Ontology MCP as an untested idea, not a Vena feature."]}], "alternatives": [{"name": "Microsoft Fabric Planning (Lumel)", "type": "Planning vendor", "lakehouse": "Power BI semantic models; OneLake shortcuts and mirroring to Snowflake, Databricks, BigQuery, SAP, Oracle. Zero-copy claim on semantic models; write-back to Fabric SQL or OneLake. Mirroring is a managed replica", "memory": "Agentic planning on roadmap", "status": "GA by mid-2026, billing from August 1, 2026", "src": ["https://lumel.com/newsroom/lumel-microsoft-strategic-first-party-alliance-fabric-planning/", "https://learn.microsoft.com/en-us/fabric/iq/plan/planning-concept-writeback", "https://community.fabric.microsoft.com/blog/fbc_fabricupdatesblogs/bring-enterprise-planning-to-the-ai-era-with-planning-in-microsoft-fabric-iq/5326315"]}, {"name": "Anaplan", "type": "Planning vendor", "lakehouse": "Snowflake write-back (replace, append, upsert); Databricks read pipeline; XL Reporting live SQL for rep release/fy27/spring/partner"]}, {"component": "Planning-event memory", "whatItTakes": "Memory of why numbers changed", "complexity": "High, and no vendor ships it (estimate)", "evidence": "Generic memory stores such as AgentCore Memory, Memory Bank, Lakebase-backed memory; Vena Omega is Announced", "src": ["https://aws.amazon.com/blogs/machine-learning/amazon-bedrock-agentcore-memory-building-context-aware-agents/", "https://docs.cloud.google.com/agent-builder/agent-engine/memory-bank/overview?hl=en", "https://docs.databricks.com/aws/en/agents/agent-memory/managed-memory", "https://www.venasolutions.com/newsroom/vena-completes-acquisition-of-morpheo-ai"]}, {"component": "Finance-owned administration", "whatItTakes": "Administration of hierarchies, drivers and templates by finance", "complexity": "Medium (estimate)", "evidence": "Data-team tools such as UC privileges and LookML in Git; Vena has a CPM admin model", "src": ["https://learn.microsoft.com/en-us/azure/databricks/business-semantics/metric-views/create-edit", "https://cloud.google.com/blog/products/business-intelligence/how-lookers-semantic-layer-enhances-gen-ai-trustworthiness"]}, {"component": "Ongoing maintenance", "whatItTakes": "Keeping up as entities, hierarchies and integrations change", "complexity": "Ongoing (estimate)", "evidence": "Connectors and pipelines; Vena is a vendor-maintained product", "src": []}], "effortNote": "No published, quantified estimate of team size, months or run cost for building FP&A planning on Snowflake, Databricks, Fabric or BigQuery was found, and sales should not quote effort numbers in either direction. Snowflake's Snowplan v2 is the best primary evidence but discloses no team size, budget or performance metrics, and proves feasibility rather than typical effort. The complexity column is the author's relative judgment, not a sourced figure. Vena's own implementation effort is also unpublished, so the fair comparison is configure a CPM product against build one.", "openQuestions": ["What is Omega's release status today (private preview, beta, GA) and its dated roadmap, and do Acterys customers get it first, as one analyst reports? Every external page must otherwise label Omega Announced.", "Can Omega run in or against a customer's Databricks, Fabric/OneLake or Snowflake, and does it use zero-copy access (Delta Sharing, OneLake shortcuts) or copy data into Vena? Vena's D3 and D4 cells and the Databricks talk track depend on it.", "Which Morpheo capabilities ship inside Vena Omega, and when? Morpheo claimed 500+ connectors and Smart Contracts as coming soon, and connector breadth would lift Vena's D1 and D2 ratings.", "Where is cumulative context stored, and how is it versioned, permissioned, audited, inspected and corrected? BARC's main risk is whether outputs stay explainable and permission-aware.", "Is MCP write-back shipped, and do AI-initiated writes route through workflow approvals? Marketing says write-back while docs list read tools only.", "Are allocations and cell-level security supported, and where are they documented? Both are Not documented in Vena's public sources, while SAP documents allocations.", "What are Omega's pricing and packaging (seats, platform or consumption), and how do they compare with Fabric capacity meters?", "Does Vena AI support French and other languages for natural language queries, and in which Azure regions is it processed? Fabric data agents are English only, so a documented answer could be a Vena differentiator in Canada.", "Will Vena or Acterys ship as a native Fabric workload via the Extensibility Toolkit, and how does Acterys position against Fabric Planning? Microsoft's first-party planning partner is Lumel.", "Should Vena join OSI / Apache Ossie? No planning vendor is a member.", "What security attestation covers Omega, given Morpheo listed SOC2 Initiated?", "Is there customer proof with measured outcomes for Omega, and can the industry's only cumulative context engine claim be substantiated? Snowflake and Databricks both market learning context layers."], "conflicts": [{"item": "Vena MCP write-back", "detail": "The Excelerate release says analysis and plan updates and the Spring '26 notes say read and write-back, but the developer docs list only read tools", "safeWording": "Read access documented, write-back announced", "src": ["https://www.venasolutions.com/newsroom/vena-announces-financial-consolidation-and-ai-innovations-at-excelerate-2026", "https://www.venasolutions.com/product-release/fy27/spring/partner", "https://developers.venasolutions.com/docs/mcp-overview"]}, {"item": "Fabric Planning GA date", "detail": "Preview March 17 to 18, 2026; GA in a post from about May; June 2026 in a community post; July 28 in a Substack", "safeWording": "GA by mid-2026, billing from August 1, 2026", "src": ["https://lumel.com/newsroom/lumel-microsoft-strategic-first-party-alliance-fabric-planning/", "https://community.fabric.microsoft.com/blog/fbc_fabricupdatesblogs/bring-enterprise-planning-to-the-ai-era-with-planning-in-microsoft-fabric-iq/5326315", "https://community.fabric.microsoft.com/blog/fiq_comm_blog/fabric-iq-is-ga-your-ontology-isnt-heres-what-that-actually-means-/5364087", "https://fabricplanning.substack.com/p/fabric-planning-went-ga-on-tuesday"]}, {"item": "Snowflake Cortex Sense status", "detail": "Private preview in Snowflake's blog vs GA soon in the press release vs GA in CoWork in a recap", "safeWording": "Preview", "src": ["https://www.snowflake.com/en/blog/enterprise-ai-agents-grounded-context/", "https://www.snowflake.com/en/news/press-releases/snowflake-cowork-powers-the-agentic-enterprise-as-the-personal-agent-for-knowledge-workers-to-work-smarter/", "https://atlan.com/know/snowflake/summit-2026-announcements/"]}, {"item": "Snowflake CoWork memory, skills, Deep Research", "detail": "Public preview soon in June; docs show no preview label", "safeWording": "Recently released or in preview", "src": ["https://www.snowflake.com/en/news/press- <script type="application/json" id="glossary-json">[{"term": "ABAC", "aka": ["attribute-based access control", "tag-based policies"], "category": "General data", "technical": "An access model that grants or denies access by evaluating attributes of the user, the data (such as governed tags) and the context against central policies, which scales better than granting permissions object by object. Databricks reports support for 10,000+ such policies per metastore.", "sales": "Rules like anyone in HR can see data tagged as payroll, instead of granting access table by table. It is strong for governing reads, but write permissions on plan intersections still have to be designed.", "related": ["RBAC", "Row-level security", "Column masking", "Unity Catalog"], "src": "https://www.databricks.com/blog/abac-row-filtering-and-column-masking-policies-governed-tags-and-data-classification-are-now"}, {"term": "Acterys", "aka": ["Acterys planning", "Managility"], "category": "Vena", "technical": "A Power BI and Fabric planning, analytics and app-building platform with proprietary write-back and multidimensional modeling, acquired by Vena (closed March 26, 2026) and still branded Acterys.", "sales": "Vena's planning option for teams that work in Power BI rather than Excel. It overlaps directly with Microsoft's Fabric Planning, so be ready to position the two.", "related": ["Planning in Fabric", "Translytical task flows", "Write-back"], "src": "https://www.venasolutions.com/newsroom/vena-completes-acterys-acquisition"}, {"term": "Agent Bricks", "aka": ["Supervisor Agent", "Knowledge Assistant", "Databricks agents"], "category": "Databricks", "technical": "Databricks' governed platform for building and running enterprise agents, which now includes the former Mosaic AI Agent Framework, with components such as Supervisor Agent (GA February 10, 2026), Knowledge Assistant and Document Intelligence.", "sales": "Databricks' toolkit for building AI agents and multi-agent teams. It suits custom agents, which is the point, since a buyer would be building the finance agents themselves.", "related": ["Mosaic AI", "Multi-agent system", "MLflow", "Agent orchestration"], "src": "https://www.databricks.com/blog/agent-bricks-governed-enterprise-agent-platform"}, {"term": "Agent Development Kit (ADK)", "aka": ["ADK", "Google ADK"], "category": "Google", "technical": "Google's open-source framework for building single and multi-agent systems as graphs of sub-agents, with MCP and A2A support and deployment to Agent Runtime.", "sales": "Google's developer toolkit for coding AI agents. It is a building block for teams who plan to write their own finance agents.", "related": ["Agent Runtime and Memory Bank", "Agent2Agent protocol (A2A)", "MCP Toolbox for Databases"], "src": "https://cloud.google.com/blog/topics/google-cloud-next/google-cloud-next-2026-wrap-up"}, {"term": "Agent harness", "aka": ["harness", "agent framework", "agent runtime"], "category": "AI and agents", "technical": "The software scaffolding around an LLM that runs the agent loop, including the system prompt, tool definitions, context management, memory, permissions and logging. Databricks describes its Omnigent project as an open-source meta-harness.", "sales": "The machinery that turns a raw AI model into a dependable worker. Building and maintaining a harness is real engineering work a buyer takes on when they build their own finance agents.", "related": ["AI agent", "Agent orchestration", "Guardrails"], "src": ""}, {"term": "Agent memory", "aka": ["short-term memory", "long-term memory", "episodic memory", "user memory"], "category": "AI and agents", "technical": "Stored state an agent reuses, split into short-term memory (events from the current session or recent turns) and long-term memory (facts, preferences, summaries or episodes extracted and kept across sessions). AgentCore Memory, Memory Bank and Genie One memory are examples.", "sales": "Whether an AI remembers past conversations and what it learned. Most shipped memory today is per user, such as remembering preferences, rather than shared memory of how the finance team plans.", "related": ["Cumulative context", "AgentCore Memory", "Agent Runtime and Memory Bank", "Snowflake CoWork"], "src": ""}, {"term": "Agent orchestration", "aka": ["orchestration", "orchestrator"], "category": "AI and agents", "technical": "Coordinating the sequence of model calls, tool invocations, sub-agents, state and error handling needed to finish a task, handled either by a framework or by a supervising agent.", "sales": "The traffic control that decides which AI step or tool runs next. Data platforms are strong here, but orchestrating AI steps is different from orchestrating a budget process with deadlines and sign-offs.", "related": ["Multi-agent system", "Agent Bricks", "Amazon Bedrock AgentCore", "Agent Development Kit (ADK)"], "src": ""}, {"term": "Agent Runtime and Memory Bank", "aka": ["Agent Engine", "Vertex AI Agent Engine", "Memory Bank", "Gemini Enterprise Agent Platform"], "category": "Google", "technical": "Agent Runtime, formerly Vertex AI Agent Engine, hosts agents on Gemini Enterprise Agent Platform, and Memory Bank stores long-term user preferences and facts across sessions with revision tracking and IAM-based access control. Sessions and Memory Bank billing began September 1, 2026.", "sales": "Google's hosting and memory service for custom agents. Its memory is scoped to individual users rather than shared knowledge of how finance plans.", "related": ["Agent memory", "Agent Development Kit (ADK)", "AgentCore Memory"], "src": "https://docs.cloud.google.com/agent-builder/agent-engine/memory-bank/overview?hl=en"}, {"term": "Agent2Agent protocol (A2A)", "aka": ["A2A", "Agent2Agent"], "category": "AI and agents", "technical": "An open protocol, created by Google and donated to the Linux Foundation in June 2025, that lets agents discover each other, exchange tasks and collaborate across vendors. It complements MCP, which connects agents to tools.", "sales": "A standard way for one vendor's AI agent to hand work to another's. Google, SAP and others back it, though SAP describes Joule Studio support as future.", "related": ["Model Context Protocol (MCP)", "Multi-agent system", "Agent Development Kit (ADK)"], "src": ""}, {"term": "AgentCore Memory", "aka": ["Amazon Bedrock AgentCore Memory"], "category": "AWS", "technical": "The AgentCore memory service that keeps short-term session events for up to 365 days and extracts long-term semantic, summary, preference and episodic memories, with namespaces that scope memories by organization, team or user. Episodic memory went GA December 2, 2025.", "sales": "Amazon's well-engineered memory store for AI agents. It knows nothing about finance, so someone has to decide what an assumption or planning decision memory looks like.", "related": ["Agent memory", "Amazon Bedrock AgentCore", "Cumulative context"], "src": "https://aws.amazon.com/blogs/machine-learning/amazon-bedrock-agentcore-memory-building-context-aware-agents/"}, {"term": "Agentic workflow", "aka": ["agentic process", "AI-driven workflow"], "category": "AI and agents", "technical": "A business process in which one or more agents carry out multi-step work, such as data preparation, analysis or plan updates, with defined tools, checkpoints and human approvals.", "sales": "A process where AI does much of the legwork and people review and approve. In planning it only works well if the workflow, approvals and audit trail already exist for the agent to operate inside.", "related": ["AI agent", "Workflow and approvals", "Guardrails"], "src": ""}, {"term": "AI agent", "aka": ["agent", "AI assistant"], "category": "AI and agents", "technical": "Software in which an LLM plans steps, calls tools such as queries, APIs or other agents, observes the results and iterates toward a goal, rather than producing a single response.", "sales": "An AI assistant that can carry out a multi-step task, such as pulling actuals, comparing them to budget and drafting commentary. In a planning deal, the key question is whether the agent can only read or can also update a plan inside governed workflow.", "related": ["Agentic workflow", "Tool calling", "Agent orchestration"], "src": ""}, {"term": "AI Credits", "aka": ["Snowflake AI Credits"], "category": "Snowflake", "technical": "Snowflake's separate billing currency for AI services such as Cortex Agents, CoWork and AI Functions, priced at $2.00 with global cross-region routing or $2.20 with regional routing, separate from platform credits, with costs adding up across every service an agent calls.", "sales": "The meter Snowflake uses to bill AI usage, on top of normal compute. Because an agent's costs stack across several services, the monthly bill is harder to predict than a subscription.", "related": ["Tokens and token pricing", "Cortex Agents", "Snowflake CoWork"], "src": "https://docs.snowflake.com/en/user-guide/snowflake-cortex/pricing"}, {"term": "AI gateway", "aka": ["LLM gateway", "model gateway", "Unity Gateway"], "category": "AI and agents", "technical": "A proxy layer in front of model and tool endpoints that centralizes routing, authentication, rate limits, spend caps, logging and policy enforcement across providers. Databricks renamed its AI Gateway to Unity Gateway, GA August 4, 2026.", "sales": "A central checkpoint for all AI traffic, used to control cost and keep a record of what was asked. It is infrastructure a build team has to set up and run.", "related": ["Guardrails", "Tokens and token pricing", "Unity Catalog"], "src": "https://docs.databricks.com/aws/en/release-notes/unity-gateway/"}, {"term": "AI.FORECAST and TimesFM", "aka": ["AI.FORECAST", "TimesFM", "AI.KEY_DRIVERS"], "category": "Google", "technical": "AI.FORECAST is a BigQuery SQL function that produces time-series forecasts using Google's pretrained TimesFM model, GA since September 30, 2025, and TimesFM in Connected Sheets went GA July 1, 2026. AI.KEY_DRIVERS for contribution analysis went GA September 29, 2026.", "sales": "Google's built-in forecasting that works without training a model. It produces a useful statistical baseline, but turning a baseline into an approved plan still needs a planning process.", "related": ["BigQuery", "Connected Sheets", "Rolling forecast", "Driver-based planning"], "src": "https://cloud.google.com/blog/products/data-analytics/ai-based-forecasting-and-analytics-in-bigquery-via-mcp-and-adk"}, {"term": "AIP Logic", "aka": ["Palantir AIP Logic"], "category": "Palantir", "technical": "A no-code environment in Palantir AIP for creating, testing and deploying AI-powered functions that read and act on Ontology data and can be triggered from applications or automations.", "sales": "Palantir's point-and-click builder for AI steps. Planning calculations like allocations or spreading would still need to be engineered in it or in code.", "related": ["Palantir AIP", "Ontology actions"], "src": "https://www.palantir.com/docs/foundry/aip/aip-features"}, {"term": "Allocations", "aka": ["cost allocation", "allocation rules", "chargebacks"], "category": "Planning and FP&A", "technical": "Rules that distribute amounts, such as shared costs or targets, from a source across entities, departments or products using bases like headcount, revenue or square footage.", "sales": "Spreading shared costs like IT or rent across departments fairly. Ask every vendor to show this live, since it is complex to build and not consistently documented in public material.", "related": ["Spreading and breakback", "Driver-based planning", "SAP Analytics Cloud planning"], "src": ""}, {"term": "Amazon Bedrock AgentCore", "aka": ["AgentCore", "Bedrock AgentCore", "AgentCore Policy", "AgentCore Gateway"], "category": "AWS", "technical": "AWS's managed services for running agents at scale, GA October 13, 2025, including Runtime, Memory, Gateway (which connects to MCP servers), Identity, Observability, Policy guardrails and Evaluations, billed on consumption.", "sales": "Amazon's industrial-strength plumbing for building AI agents. It is a platform for builders, so every finance-specific piece would be custom.", "related": ["AgentCore Memory", "Agent orchestration", "Guardrails"], "src": "https://aws.amazon.com/about-aws/whats-new/2025/10/amazon-bedrock-agentcore-available"}, {"term": "Amazon Quick", "aka": ["Amazon Quick Suite", "QuickSight", "Quick Sight", "Quick Flows"], "category": "AWS", "technical": "AWS's agentic business suite, launched as Amazon Quick Suite in October 2025 and later shortened to Amazon Quick, bundling chat, research, automation flows and BI, with semantic datasets added July 7, 2026. It documents no write-back or planning, and it replaces Amazon Q Business, which is closed to new customers.", "sales": "Amazon's AI assistant and reporting suite, with enterprise plans at $20 or $40 per user plus $250 per account per month. The realistic overlap with Vena is reporting and Q&A, not planning.", "related": ["Amazon Bedrock AgentCore", "Semantic layer", "Amazon Redshift"], "src": "https://aws.amazon.com/blogs/machine-learning/your-complete-guide-to-amazon-quick-suite-at-aws-reinvent-2025/"}, {"term": "Amazon Redshift", "aka": ["Redshift"], "category": "AWS", "technical": "AWS's managed cloud data warehouse for SQL analytics, accessible through SageMaker Unified Studio and SageMaker Catalog. Its AI features were not separately researched for this comparison.", "sales": "Amazon's data warehouse, often where AWS customers keep actuals. Like other warehouses, it stores data for reporting but does not include planning workflow, versions or input.", "related": ["Data warehouse", "SageMaker Unified Studio", "Amazon Quick"], "src": "https://aws.amazon.com/about-aws/whats-new/2025/03/amazon-sagemaker-unified-studio-generally-available/"}, {"term": "Apache Iceberg", "aka": ["Iceberg tables"], "category": "General data", "technical": "An open table format governed by the Apache Software Foundation that adds transactions, schema evolution and snapshots to files in object storage, supported by BigQuery, Snowflake, AWS and other engines.", "sales": "An open format, similar to Delta Lake, that lets several platforms read the same tables without copying them. It matters because it reduces lock-in to any single data vendor.", "related": ["Delta Lake", "Lakehouse", "Parquet", "Zero-copy"], "src": ""}, {"term": "Audit trail", "aka": ["change history", "audit log", "provenance"], "category": "Planning and FP&A", "technical": "An immutable log recording who changed which value or object, when, from what to what, and ideally why through comments, covering user, system and AI-initiated changes.", "sales": "The record auditors and controllers use to answer who changed this number and why. Platform logs track queries and agent actions, but plan-level change history with comments usually has to be built.", "related": ["Data lineage", "Period locking", "Ontology actions"], "src": ""}, {"term": "BigQuery", "aka": ["Google BigQuery", "BigQuery conversational analytics", "BigQuery data agents"], "category": "Google", "technical": "Google Cloud's serverless data warehouse, now with conversational analytics (GA June 23, 2026), built-in AI functions such as AI.FORECAST and AI.KEY_DRIVERS, a managed MCP server (GA April 20, 2026) and Iceberg table support.", "sales": "Google's main data warehouse. It is strong for analysis and forecasting, but its data agents are read-only and there is no native planning application.", "related": ["Looker", "AI.FORECAST and TimesFM", "Knowledge Catalog", "Data warehouse"], "src": "https://docs.cloud.google.com/bigquery/docs/release-notes"}, {"term": "Business glossary", "aka": ["glossary", "business terms", "data dictionary"], "category": "Data and AI", "technical": "A curated set of business terms with definitions, synonyms, owners and links to the data assets they describe, maintained in a catalog and used by AI to interpret questions. Databricks listed its Glossary as preview coming soon in June 2026, while SageMaker Catalog can require glossary terms before an asset is published.", "sales": "The agreed definitions of terms like ARR, opex or headcount, written down and owned. Most platforms now have one, but someone still has to write and maintain the entries.", "related": ["Data catalog", "Semantic layer", "Context layer"], "src": ""}, {"term": "Cell-level security", "aka": ["intersection-level security", "entity-level security", "write security"], "category": "Planning and FP&A", "technical": "Permissions that control read or write access at the level of individual intersections of dimensions, such as letting a manager edit only their own cost center's opex in the current forecast. Vena publicly documents entity-level security, so confirm cell-level detail internally.", "sales": "Controlling exactly which numbers each person can see and edit in the plan. Data platform row and column policies mainly govern reading, so write permissions by intersection are custom work.", "related": ["Row-level security", "Write-back", "ABAC"], "src": ""}, {"term": "Change data capture (CDC)", "aka": ["CDC", "log-based replication"], "category": "General data", "technical": "A technique that detects inserts, updates and deletes in a source database, often by reading its transaction log, and streams only those changes to a target system.", "sales": "A way to keep a copy of ERP or CRM data current without reloading everything each night. It shortens the lag between a posting in the GL and the number a planner sees.", "related": ["ETL and ELT", "Openflow", "Data sharing"], "src": ""}, {"term": "Column masking", "aka": ["column-level security", "CLS", "dynamic data masking"], "category": "General data", "technical": "A policy that hides or obfuscates values in sensitive columns, such as salary, for users without permission while still returning the rest of the row.", "sales": "Hiding sensitive fields like individual salaries from people who should not see them. It is important for workforce planning data, and data platforms enforce it when data is read.", "related": ["Row-level security", "ABAC", "Cell-level security"], "src": "https://www.databricks.com/blog/abac-row-filtering-and-column-masking-policies-governed-tags-and-data-classification-are-now"}, {"term": "Connected Sheets", "aka": ["Google Connected Sheets"], "category": "Google", "technical": "A Google Sheets feature for analyzing BigQuery data through pivots, charts, extracts and scheduled refresh without moving the data into the sheet. Its documentation describes analysis and refresh but not write-back.", "sales": "Google Sheets connected live to BigQuery for analysis. It does not save planning inputs back to the warehouse, unlike Excel-native planning in Vena.", "related": ["BigQuery", "AI.FORECAST and TimesFM", "Write-back"], "src": "https://support.google.com/docs/answer/9703214?hl=en"}, {"term": "Context engineering", "aka": ["context curation", "prompt context design"], "category": "Data and AI", "technical": "The practice of designing, curating and maintaining what information, tools, instructions and memory go into an AI model's context for each task, including retrieval, summarization and permission filtering.", "sales": "The behind-the-scenes work that decides what the AI is shown before it answers. Snowflake and Databricks currently ship more automated context engineering than Vena, through usage-mined semantics and inferred ontologies.", "related": ["Context layer", "Retrieval-augmented generation (RAG)", "Semantic View Autopilot", "Genie Ontology"], "src": ""}, {"term": "Context layer", "aka": ["data context layer", "AI context layer", "context engine"], "category": "Data and AI", "technical": "The combined semantics, metadata, business definitions, rules, examples and memory that are assembled and supplied to an AI model so its answers reflect how a specific business works. a16z describes it as a superset of the traditional semantic layer.", "sales": "Everything an AI assistant needs to know about the company to give a right answer, not just a plausible one. Every data platform now sells a version of this, so the real questions are what context it holds and who keeps it current.", "related": ["Semantic layer", "Cumulative context", "Context engineering", "Vena Omega"], "src": "https://a16z.com/your-data-agents-need-context/"}, {"term": "Conversational Analytics API", "aka": ["CA API", "Data Agent API"], "category": "Google", "technical": "Google's API for building data agents over BigQuery and Looker, offering text-to-SQL, Looker query generation, a Python code interpreter, context retrieval and charts through stateful and stateless chat. GA June 23, 2026 per its release notes, though one Google blog says August 2026.", "sales": "Google's developer service for embedding ask-your-data assistants into apps. Like Google's other data agents, it reads data and does not update plans.", "related": ["BigQuery", "Looker", "Verified queries", "Text-to-SQL"], "src": "https://docs.cloud.google.com/gemini/data-agents/conversational-analytics-api/release-notes"}, {"term": "Copilot Studio", "aka": ["Microsoft Copilot Studio"], "category": "Microsoft", "technical": "Microsoft's low-code platform for building custom agents that publish to Teams and Microsoft 365 Copilot. Fabric data agents now plug in as a tool through the Fabric IQ Data MCP, an integration Microsoft announced as GA around September 2026.", "sales": "Microsoft's builder for custom AI assistants. It is where a Microsoft shop might assemble its own planning agent, which would still need a planning backend to write to.", "related": ["Fabric data agents", "Microsoft Copilot", "Agent orchestration"], "src": "https://community.fabric.microsoft.com/blog/fbc_fabricupdatesblogs/fabric-data-agents-in-microsoft-copilot-studio-generally-available/5362882"}, {"term": "Cortex Agents", "aka": ["Snowflake Cortex Agents"], "category": "Snowflake", "technical": "Snowflake's fully managed agent platform (GA) that runs a plan, tool-use and reflect loop over tools such as Cortex Analyst, Cortex Search, stored procedures, sandboxed code and MCP connectors, with persisted threads and feedback capture.", "sales": "Snowflake's toolkit for building AI agents on Snowflake data. Agents can only change data through procedures a developer writes, so plan updates are a custom build.", "related": ["Cortex Analyst", "Cortex Search", "Snowflake CoWork", "AI Credits"], "src": "https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents"}, {"term": "Cortex Analyst", "aka": ["Snowflake Cortex Analyst"], "category": "Snowflake", "technical": "Snowflake's text-to-SQL service that answers natural-language questions over semantic views or legacy YAML semantic models, billed per 1,000 messages through its API or by tokens when called from Cortex Agents.", "sales": "Snowflake's ask-a-question feature for data in Snowflake. Its 90%+ accuracy claim comes from Snowflake's own 2024 test on simple pre-joined data, and it reads data rather than updating plans.", "related": ["Semantic views", "Verified queries", "Text-to-SQL", "Cortex Agents"], "src": "https://www.snowflake.com/en/engineering-blog/cortex-analyst-text-to-sql-accuracy-bi/"}, {"term": "Cortex Search", "aka": ["Snowflake Cortex Search"], "category": "Snowflake", "technical": "Snowflake's managed search service over text and unstructured data, used as a retrieval tool by Cortex Agents and billed on serving compute per GB per month plus embedding tokens.", "sales": "Snowflake's search engine that lets AI agents find relevant documents and text. It supports the document side of an AI assistant rather than planning calculations.", "related": ["Cortex Agents", "Embeddings and vector database", "Retrieval-augmented generation (RAG)"], "src": "https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents"}, {"term": "Cortex Sense", "aka": ["Snowflake Cortex Sense"], "category": "Snowflake", "technical": "A Snowflake runtime context layer that assembles context from query history, object metadata, BI definitions and semantic views, with self-correcting evaluation loops. Snowflake's June 30, 2026 blog says private preview from mid-July 2026, while other sources say GA soon or GA, so status is disputed.", "sales": "Snowflake's newest attempt at an AI layer that learns the business from signals it already has. Treat it as preview, and note that it learns from data usage rather than from budget approvals or overrides.", "related": ["Context layer", "Semantic View Autopilot", "Snowflake Horizon", "Cumulative context"], "src": "https://www.snowflake.com/en/blog/enterprise-ai-agents-grounded-context/"}, {"term": "CPM and EPM", "aka": ["CPM", "EPM", "corporate performance management", "enterprise performance management", "FP&A software"], "category": "Planning and FP&A", "technical": "Corporate and enterprise performance management are software categories covering budgeting, planning, forecasting, consolidation, close, reporting and analytics with finance-owned models, workflow and controls.", "sales": "The category of software Vena, Anaplan, OneStream and others sell for running planning and close. The real build versus buy question is whether to configure one of these products or build one from data platform parts.", "related": ["Financial consolidation", "Workflow and approvals", "Planning in Fabric", "SAP Analytics Cloud planning"], "src": ""}, {"term": "CubeFLEX", "aka": ["Vena cube", "CubeFLEX engine"], "category": "Vena", "technical": "Vena's in-memory multidimensional engine of dimensions, hierarchies and members, paired with relational storage for high transaction volumes, which serves as the governed model Vena AI operates on.", "sales": "The finance cube at the heart of Vena where plans, actuals and versions live. It plays the role a semantic layer plays on data platforms, and it also supports input, versions and workflow.", "related": ["OLAP cube", "Semantic layer", "Vena Copilot"], "src": "https://www.venasolutions.com/vena-ai"}, {"term": "Cumulative context", "aka": ["compounding context", "institutional memory", "planning memory"], "category": "Data and AI", "technical": "Context that persists and grows across sessions, users and planning cycles, capturing items such as assumptions, overrides, approvals and decisions, rather than resetting with each conversation. Vena positions Vena Omega around this idea.", "sales": "An AI that remembers why last quarter's forecast was overridden and who approved it, so it gets more useful every cycle. Vena has announced this through Vena Omega but not shipped it, and no competitor reviewed documents memory built from planning events.", "related": ["Vena Omega", "Agent memory", "Context layer", "Variance analysis"], "src": "https://www.venasolutions.com/newsroom/vena-to-acquire-morpheo-ai"}, {"term": "Currency translation", "aka": ["FX translation", "multi-currency", "foreign exchange"], "category": "Planning and FP&A", "technical": "Converting entity results from their functional currency into the reporting currency using rules such as average rates for income statement items, closing rates for balance sheet items and historical rates for equity, with differences booked to a translation reserve.", "sales": "Turning results in euros or pesos into the group's reporting currency at the right rates. Getting the rate rules right is accounting logic that a homegrown build must design, test and maintain.", "related": ["Financial consolidation", "Intercompany eliminations"], "src": ""}, {"term": "Data catalog", "aka": ["metadata catalog", "catalog"], "category": "General data", "technical": "A metadata system that inventories data assets with descriptions, owners, classifications, glossary terms, lineage and access policies, such as Unity Catalog, Knowledge Catalog or SageMaker Catalog.", "sales": "The searchable directory of what data exists, what it means and who may use it. Catalogs feed AI context, but they describe data rather than run a budget process.", "related": ["Business glossary", "Data lineage", "Unity Catalog", "Knowledge Catalog"], "src": ""}, {"term": "Data lake", "aka": ["object storage", "raw data zone"], "category": "General data", "technical": "A low-cost storage repository, usually cloud object storage, that holds raw structured and unstructured files in open formats such as Parquet without imposing a schema up front.", "sales": "A large, inexpensive storage pool where data from every system lands before it is cleaned up. It is a source of actuals for planning, not a place where budgets are entered or approved.", "related": ["Data warehouse", "Lakehouse", "Parquet"], "src": ""}, {"term": "Data lineage", "aka": ["lineage"], "category": "General data", "technical": "Metadata that traces how data flows from sources through transformations to tables, reports, models and AI outputs, usually captured automatically by the catalog down to column level.", "sales": "The ability to show where a number came from and what touched it along the way. It helps with audit questions, but it tracks data pipelines, not who changed a plan and why.", "related": ["Audit trail", "Data catalog", "Unity Catalog"], "src": ""}, {"term": "Data mesh", "aka": ["domain-oriented data ownership"], "category": "General data", "technical": "An organizational approach in which business domains own and publish their data as governed products on shared self-service platform standards, instead of one central data team owning everything.", "sales": "A way of organizing data so finance, sales and operations each own their own data sets. In a mesh, finance usually owns planning data, which favors tools finance can run without engineers.", "related": ["Data product", "Data catalog"], "src": ""}, {"term": "Data product", "aka": ["curated data set", "certified data set"], "category": "General data", "technical": "A curated, documented and governed data set with a named owner, quality checks and access rules, published for reuse by people, applications or agents. SAP Business Data Cloud and Google Knowledge Catalog use the term heavily.", "sales": "A packaged, trusted data set, such as approved actuals by entity, that others can reuse. SAP and Google pitch data products as the raw material for their AI agents.", "related": ["Data mesh", "SAP Business Data Cloud", "Knowledge Catalog"], "src": ""}, {"term": "Data sharing", "aka": ["secure data sharing", "live data sharing"], "category": "General data", "technical": "Platform features that give another account, organization or tool live, governed read access to tables without exporting files, for example OpenSharing (formerly Delta Sharing), Snowflake sharing or SAP BDC Connect.", "sales": "Letting another team or vendor see a live table instead of emailing extracts. Most planning vendors still use sharing only to import actuals one way, so ask how approved plans flow back.", "related": ["Zero-copy", "OpenSharing", "Data product"], "src": ""}, {"term": "Data warehouse", "aka": ["DW", "EDW", "cloud data warehouse"], "category": "General data", "technical": "A database optimized for analytical SQL over cleaned, structured data, typically organized in star schemas and kept separate from the transactional systems that produce the data.", "sales": "The governed, cleaned-up copy of company data that reporting runs on. When a prospect says their actuals already live there, that is a reason to connect planning to it, not a reason to build planning inside it.", "related": ["Data lake", "Lakehouse", "Star schema", "OLTP vs OLAP"], "src": ""}, {"term": "Databricks Apps", "aka": ["Apps on Databricks"], "category": "Databricks", "technical": "A Databricks service for hosting custom web applications built with frameworks such as Dash, Flask and Streamlit, with a managed service principal and native Lakebase connection, billed in DBUs per hour by compute size.", "sales": "A place to run custom-built apps on Databricks. Databricks documents its write-back pattern with a simple to-do app template, which shows that a planning interface would be custom development.", "related": ["Lakebase", "Streamlit in Snowflake", "Databricks Unit (DBU)"], "src": "https://docs.databricks.com/gcp/en/oltp/projects/databricks-apps"}, {"term": "Databricks Unit (DBU)", "aka": ["DBU", "DBUs"], "category": "Databricks", "technical": "The Databricks Unit, a normalized unit of compute consumption billed at rates that vary by product, tier and cloud. Genie, Databricks Apps and model serving are billed in DBUs.", "sales": "The meter Databricks bills on. Genie is free for people using it through January 31, 2027, so pilot costs understate long-run cost.", "related": ["Tokens and token pricing", "Genie", "Databricks Apps"], "src": "https://learn.microsoft.com/en-us/azure/databricks/genie/monitor-cost"}, {"term": "Delta Lake", "aka": ["Delta tables", "Delta format"], "category": "General data", "technical": "An open-source table format, originated by Databricks, that adds a transaction log over Parquet files to provide ACID transactions, schema enforcement and table history.", "sales": "The file format most Databricks and Microsoft Fabric data is stored in. If a prospect's finance data sits in Delta tables, it is already in an open format that other tools can read and share.", "related": ["Lakehouse", "Apache Iceberg", "Parquet", "OpenSharing"], "src": ""}, {"term": "Dimension", "aka": ["attribute", "hierarchy"], "category": "General data", "technical": "An attribute used to slice and group data, such as account, entity, department, product, time, scenario or version, often organized into hierarchies with rollup rules.", "sales": "The ways finance cuts the numbers, such as by entity, department or month. Planning models add dimensions that reporting models usually lack, like version and scenario.", "related": ["Measure",

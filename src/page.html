<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one narrow rail of steps (guided funnel) that resolves into a result sheet; a second view is the full reference. Vena green as the single accent. */
:root{
  --bg:#F5F7F5; --surface:#FFFFFF; --surface2:#EDF3EE; --fg:#1E2B24; --muted:#6B746E; --line:#D8E0DA;
  --accent:#4A9462; --accent-deep:#2F5E41; --accent-soft:#DDEDE1; --ink-on-accent:#FFFFFF;
  --warn:#B8542F; --warn-soft:#F6E6DF; --info:#3A6EA5; --info-soft:#E3ECF6; --amber:#8A6100; --amber-soft:#F7EBCB; --grey-soft:#ECEFED;
  --display:"Manrope",system-ui,sans-serif; --body:"Public Sans",system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,40,28,.06),0 8px 24px rgba(20,40,28,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121A15; --surface:#1A241E; --surface2:#213028; --fg:#E8EFEA; --muted:#98A59D; --line:#2E3D34;
  --accent:#6FB886; --accent-deep:#A8DB8A; --accent-soft:#24402E; --ink-on-accent:#0F1A13;
  --warn:#E48B66; --warn-soft:#3C271E; --info:#8FB4E0; --info-soft:#1F2E40; --amber:#E8C46A; --amber-soft:#3A3018; --grey-soft:#26302A; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A15; --surface:#1A241E; --surface2:#213028; --fg:#E8EFEA; --muted:#98A59D; --line:#2E3D34;
  --accent:#6FB886; --accent-deep:#A8DB8A; --accent-soft:#24402E; --ink-on-accent:#0F1A13;
  --warn:#E48B66; --warn-soft:#3C271E; --info:#8FB4E0; --info-soft:#1F2E40; --amber:#E8C46A; --amber-soft:#3A3018; --grey-soft:#26302A; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
h2{font-size:20px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
header .lead{max-width:60ch;margin-top:8px;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface2);padding:4px;border-radius:18px;max-width:100%}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 13px var(--display);padding:8px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.tabs button:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* progress */
.progress{display:flex;gap:6px;margin-bottom:20px}
.progress span{flex:1;height:5px;border-radius:99px;background:var(--line)}
.progress span.done{background:var(--accent)}
.progress span.cur{background:var(--accent);opacity:.55}

/* step card */
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--shadow)}
.step .q{font-family:var(--display);font-size:22px;font-weight:700;margin:6px 0 4px;text-wrap:balance}
.step .why{color:var(--muted);max-width:62ch;margin-bottom:18px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;color:var(--fg);font:inherit;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .ic{flex:none;width:36px;height:36px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--accent-deep)}
.opt[aria-pressed="true"] .ic{background:var(--accent);color:var(--ink-on-accent)}
.opt b{display:block;font-family:var(--display);font-weight:700}
.opt small{display:block;color:var(--muted);font-size:13px;line-height:1.4;margin-top:2px}
.ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;align-items:center}
.btn{border:0;border-radius:10px;padding:11px 18px;font:700 14px var(--display);cursor:pointer;background:var(--accent);color:var(--ink-on-accent)}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:13px;color:var(--muted)}
.tip{display:flex;gap:10px;background:var(--info-soft);color:var(--fg);border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:16px}
.tip svg{flex:none;width:18px;height:18px;stroke:var(--info);fill:none;stroke-width:2;margin-top:2px}

/* result */
.result{display:grid;gap:18px}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.card.accent{background:var(--accent-deep);color:#fff;border-color:transparent}
:root[data-theme="dark"] .card.accent,:root:not([data-theme="light"]) .card.accent{color:var(--fg)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .card.accent{color:#fff}}
:root[data-theme="light"] .card.accent{color:#fff}
.card.accent .eyebrow{color:inherit;opacity:.8}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font:600 12px var(--display);background:var(--accent-soft);color:var(--accent-deep)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
.funnel{display:grid;gap:10px}
.rung{display:grid;grid-template-columns:38px 1fr;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
.rung .n{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--ink-on-accent);display:grid;place-items:center;font:700 13px var(--display)}
.rung h3{margin-bottom:6px}
.rung ul{margin:0;padding-left:18px;font-size:14px}
.rung li{margin:3px 0}
.vof{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vof span{font-size:12px;border-radius:6px;padding:3px 8px;background:var(--surface2)}
.vof span b{color:var(--accent-deep);font-weight:700}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-child{border-top:0}
.row b{font-family:var(--display)}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.people{display:grid;gap:10px}
.person{display:flex;gap:12px;align-items:center}
.person .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-deep);font:800 13px var(--display);flex:none}
.actions .row{grid-template-columns:120px 1fr}
@media(max-width:560px){.actions .row{grid-template-columns:1fr}}
.copybar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
textarea#summary{width:100%;min-height:140px;border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--fg);resize:vertical}

/* reference */
.ref{display:grid;gap:22px}
.ref section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.ref h2{margin-bottom:6px}
.ref .sub{color:var(--muted);margin-bottom:14px;max-width:70ch}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-top:1px solid var(--line)}
th{font-family:var(--display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
td:first-child{font-weight:600}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:720px){.flow{grid-template-columns:1fr}}
.flow .f{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative}
.flow .f .n{font:800 28px var(--display);color:var(--accent);line-height:1}
.flow .f h3{margin:6px 0 4px}
.ladder{display:grid;gap:8px}
.ladder .l{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.ladder .l .n{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--ink-on-accent);display:grid;place-items:center;font:700 12px var(--display)}
.ladder .l small{display:block;color:var(--muted)}
.pkgs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:720px){.pkgs{grid-template-columns:1fr}}
.pkg{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg)}
.pkg.dark{background:var(--accent-deep);color:#fff;border-color:transparent}
.pkg h3{font-size:17px}
.pkg p{font-size:13.5px;margin-top:6px}
.pkg .who{margin-top:10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
@media (prefers-reduced-motion:no-preference){.step,.card{animation:in .25s ease-out}}
@keyframes in{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
__EXTRA_CSS__
</style>

    </div>
    <div class="tabs" role="tablist">

<script>
const ICONS={
  fin:'<svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg>',
  it:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>',
  q:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01"/></svg>',
  chat:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  flow:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="15" y="15" width="6" height="6" rx="1.5"/><path d="M9 6h4a3 3 0 0 1 3 3v6"/></svg>',
  code:'<svg viewBox="0 0 24 24"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 4l-4 16"/></svg>',
  bi:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  lake:'<svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>',
  bulb:'<svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.6 1 1.3 1 2.5h6c0-1.2.3-1.9 1-2.5A6 6 0 0 0 12 3z"/></svg>',
  proto:'<svg viewBox="0 0 24 24"><path d="M14 3v6h6M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6z"/><path d="M9 15l2 2 4-4"/></svg>',
  live:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  broken:'<svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  info:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>',
  users:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4.5-6.2"/></svg>',
  flag:'<svg viewBox="0 0 24 24"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>',
  key:'<svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l3 3"/></svg>',
};

const STEPS=[
 {id:'owner',q:'Who owns the decision?',why:'Even with both on the call, one of them signs. Satisfy that person first.',
  tip:'Ask: who kicked this off and why now, whose budget is it, who would own it a year from now. If Finance is on the call but IT holds the data and the budget, it is IT-led.',
  opts:[
   {v:'fin',ic:'fin',b:'Finance-led',s:'CFO, controller or FP&A lead. Their view of AI is the chat tools they have used'},
   {v:'it',ic:'it',b:'IT-led',s:'CIO, CTO, VP Data or an innovation lead with a data platform and engineers'},
  ]},
 {id:'build',q:'Where are they building it?',why:'Prospects like talking about their build. Let them.',
  opts:[
   {v:'chat',ic:'chat',b:'Chat tools on a laptop',s:'Claude, ChatGPT, Copilot, Grok. One person, one model'},
   {v:'lowcode',ic:'flow',b:'Low-code flows',s:'Power Query, Power Automate. A pipeline with no planning layer'},
   {v:'vibe',ic:'code',b:'Vibe-coded app',s:'Lovable, Replit, Claude Code. A real prototype with one owner'},
   {v:'pbi',ic:'bi',b:'Power BI with write-back',s:'Reporting first, planning bolted on. Usually a BI team'},
   {v:'lake',ic:'lake',b:'Databricks, Snowflake, BigQuery, Fabric',s:'Serious data team. They can build the plumbing'},
  ]},
 {id:'stage',q:'How far along are they?',why:'Stage sets the tone and the timing of your follow-up.',
  opts:[
   {v:'idea',ic:'bulb',b:'Idea',s:'"We think we can do this ourselves"'},
   {v:'proto',ic:'proto',b:'Prototype',s:'A model or app exists, one owner, not in the close yet'},
   {v:'live',ic:'live',b:'In production',s:'They ran a cycle on it'},
   {v:'failed',ic:'broken',b:'Failed or stalled',s:'Someone left, the auditor asked, the CFO lost trust'},
  ]},
 {id:'ladder',q:'Which rungs of the build ladder have they covered?',why:'Tick what they have actually thought through. Every unticked rung is a question to ask.',multi:true,onlyIf:s=>s.owner==='it',
  opts:[
   {v:'r1',ic:'check',b:'Data in a lake or warehouse',s:'All of it, or finance only?'},
   {v:'r2',ic:'check',b:'Semantic model',s:'How does AI know what a cost centre or driver is?'},
   {v:'r3',ic:'check',b:'Planning layer',s:'Write-back, versions, workflow, approvals'},
   {v:'r4',ic:'check',b:'Cumulative context',s:'Are questions and decisions kept, and does the next answer improve?'},
   {v:'r5',ic:'check',b:'Orchestration',s:'Agent flows, harnesses, routing question types'},
   {v:'r6',ic:'check',b:'Context weighting',s:'Industry, company and user level, weighted over time'},
   {v:'r7',ic:'check',b:'Interfaces',s:'How finance actually uses it. Excel, Power BI, chat'},
  ]},
 {id:'gaps',q:'Which gaps did they admit to?',why:'Tick what they said out loud. Every unticked gap is a question to ask.',multi:true,onlyIf:s=>s.owner==='fin',
  opts:[
   {v:'g1',ic:'check',b:'Budget owners entering numbers',s:'No clean way for others to input'},
   {v:'g2',ic:'check',b:'Two people, one driver',s:'No versioning or locking'},
   {v:'g3',ic:'check',b:'Audit trail',s:'Cannot show who changed what'},
   {v:'g4',ic:'check',b:'Key person risk',s:'One builder, no plan if they leave'},
   {v:'g5',ic:'check',b:'Business meaning',s:'The model does not know what gross margin means here'},
   {v:'g6',ic:'check',b:'Memory',s:'Starts over each session, nothing compounds'},
  ]},
 {id:'signals',q:'What else did you hear?',why:'These signals move the deal between the three Omega packages.',multi:true,
  opts:[
   {v:'own',ic:'key',b:'"We want to own the data layer"',s:'They will build their own apps and agents on it'},
   {v:'excel',ic:'fin',b:'Finance wants Excel back',s:'Planning and reporting in the tools they know'},
   {v:'teams',ic:'users',b:'Teams beyond finance',s:'Sales, HR, ops or supply chain planning came up'},
   {v:'mandate',ic:'flag',b:'AI mandate from the top',s:'Board or CEO told them to use AI'},
   {v:'dbx',ic:'lake',b:'"Databricks already does this"',s:'Or Snowflake, Fabric. Platform-as-competitor objection'},
  ]},
];

const RUNGS={r1:['Data','"Is the data already in a lake or warehouse? All of it, or finance only?"','Omega can run on what they have. Not a blocker.'],
 r2:['Semantic model','"Have you built a semantic model? How does the AI know what a cost centre or a driver is?"','Where most builds stall. Omega builds it.'],
 r3:['Planning layer','"How do budget owners enter and change numbers? How do versions, workflow and approvals work?"','The part EPM vendors spent 20 years on.'],
 r4:['Cumulative context','"When someone asks a question or makes a decision, is that kept? Does the next answer get better?"','Omega\'s core. Most builds start over every session.'],
 r5:['Orchestration','"How are you handling model orchestration? Agent flows, harnesses, routing different question types?"','Omega handles it. Bring Solution Architecture or Morpheo to go deep.'],
 r6:['Context weighting','"How do you prioritize context? Industry, company, user level? How is it weighted over time?"','Almost nobody has. The strongest rung.'],
 r7:['Interfaces','"Once it works, how does finance use it? Excel? Power BI? A chat window?"','Vena for Excel, PowerPoint and Power BI already sit on Omega.']};
const GAPS={g1:['Budget owners','"How do budget owners enter their numbers?"'],g2:['Versions','"What happens when two people change the same driver?" "How do you lock a version?"'],g3:['Audit','"How would your auditor see who changed what?"'],g4:['Key person','"What\'s the plan if that person leaves?"'],g5:['Meaning','"How will the model know what gross margin means at your company?" "Where does that knowledge live today?"'],g6:['Memory','"Does it get smarter as people use it, or start over each time?"']};

const PKG={
 core:{n:'Omega Core',d:'The context layer, hosted by Vena or on their platform. MCP and API access. They build their own apps and agents on it.'},
 fin:{n:'Omega for Finance',d:'Core plus Vena for Excel, PowerPoint and Vena AI. Finance gets a full planning and reporting tool with the context layer under it.'},
 ent:{n:'Omega Enterprise',d:'Every interface, deployment on their platform, and a dedicated FDE pod. Planning and AI across more than one business domain.'},
 wait:{n:'Wait and see',d:'They want to try. Leave the door open, set a dated check-in, and send one useful thing rather than a pitch.'}};

function evaluate(s){
  const fin=s.owner==='fin';
  const sig=s.signals||[], gaps=s.gaps||[], lad=s.ladder||[];
  let persona,believe,truth,play,tone;
  if(fin){
    persona=s.build==='lake'?'Finance with a data ally':'Finance DIY';
    believe='"We can set this up ourselves with the AI tools we already use."';
    truth='Works for one model with one owner. Breaks when a second person enters numbers, the auditor asks who changed what, or the builder leaves. AI speeds the build but gives the model no memory of the business.';
    play='Gentle challenge, then wait and see. Ask the questions that let them find the gaps. Never say it won\'t work.';
    tone='Curious and gentle';
  } else {
    persona=sig.includes('mandate')?'IT with an AI mandate':'IT platform builder';
    believe='"EPM is a boxed app. We can build this on the platform we already run."';
    truth='They can build the data layer. They underestimate planning semantics, write-back, security by intersection, and the ongoing work of keeping context current. They think of AI as a model to call, not a layer that learns the business.';
    play='Partner, don\'t compete. Walk them up the build ladder one rung at a time. By the top they are describing Omega. Then say so and show it on their platform.';
    tone='Respectful of the builder';
  }

  ['"What happens when that person leaves?"','"That\'s not sustainable"','Same point, but they say it']])}</section>`;

// tabs
const VIEWS=['guide','ref','compare','glossary'];
function showView(v){
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x.dataset.view===v));
  VIEWS.forEach(k=>document.getElementById('view-'+k).hidden=k!==v);
  if(v==='compare')renderCompare(); if(v==='glossary')renderGlossary();
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));
render();
__EXTRA_JS__
const HASHMAP={'#reference':'ref','#compare':'compare','#glossary':'glossary'};
if(HASHMAP[location.hash])showView(HASHMAP[location.hash]);
</script>
